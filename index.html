<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.10.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.10.2/core.js"></script>

    <title>小5 算数AI家庭教師</title>

    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
        margin: 24px;
      }
      .card {
        max-width: 760px;
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .question {
        font-size: 20px;
        margin: 12px 0;
      }
      input {
        padding: 10px;
        font-size: 16px;
        width: 220px;
      }
      button {
        padding: 10px 14px;
        font-size: 16px;
        cursor: pointer;
      }
      .log {
        white-space: pre-wrap;
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 12px;
        min-height: 140px;
      }
      .muted {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border: 1px solid #ddd;
        border-radius: 999px;
        font-size: 14px;
      }
      .spacer {
        height: 10px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="row">
        <div class="pill" id="topic-pill">単元：-</div>
        <div class="muted">「出題」→ 答え入力 →「答える」</div>
      </div>

      <div class="question" id="question">まず「出題」を押してね。</div>

      <div class="row">
        <input id="answer" placeholder="ここに答え" />
        <button id="btn-new" py-click="new_problem">出題</button>
        <button id="btn-submit" py-click="submit_answer">答える</button>
        <button id="btn-stats" py-click="show_stats">せいせき</button>
        <button id="btn-reset" py-click="reset_session">リセット</button>
      </div>

      <div class="spacer"></div>

      <div class="log" id="log"></div>

      <div class="spacer"></div>

      <div class="muted">
        ※ もし更新しても同じエラーが出るときは、ブラウザのキャッシュの影響が強いです。<br />
        その場合は、シークレットタブで開くか、ページを強制再読み込みしてください。
      </div>
    </div>

    <!--
      main.py を同じフォルダに置いてください：
      /CODEX_study/ai_tutor_web/main.py

      キャッシュ対策でクエリを付けています（適当に値を変えると強制更新できます）
    -->
    <script type="py" src="main.py?v=20260215b"></script>
  </body>
</html>
