:"NTP","choice3":"PPP","choice4":"RIP","choice5":"SNMP","correct_answer":1,"correct_answers":[1],"explanation":"RIP（Routing Information Protocol）はルーターなどの通信経路を動的に制御するプロトコルである"},{"year":"2017","category":"情報処理技術系","question_number":29,"question_text":"Bluetoothについて正しいのはどれか。","choice1":"赤外線を利用する。","choice2":"青色可視光を利用する。","choice3":"利用には免許が必要である。","choice4":"2.4GHz帯の電波を利用する。","choice5":"高速シリアルインターフェース規格である。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":30,"question_text":"物理的な接続とは異なる仮想的なネットワークはどれか。","choice1":"VDI","choice2":"VLAN","choice3":"VOD","choice4":"WebDAV","choice5":"WLAN","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":31,"question_text":"本人確認のための2要素認証として適切なのはどれか。","choice1":"体重と性別","choice2":"虹彩と静脈","choice3":"ICカードとパスワード","choice4":"中指の指紋と親指の指紋","choice5":"異なる2つのパスワード","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":32,"question_text":"情報セキュリティにおけるリスク対応の種類として","choice1":"定義されていないのはどれか。","choice2":"リスクの移転","choice3":"リスクの回避","choice4":"リスクの低減","choice5":"リスクの分析","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":33,"question_text":"情報セキュリティ対策の分類と実施例の組み合わせで正しいのはどれか。","choice1":"物理的安全対策 – 外部委託管理","choice2":"組織的安全対策 – 利用ユーザの棚卸","choice3":"人的安全対策　 – 利用ユーザ向け研修","choice4":"組織的安全対策 – サーバ室の入退室管理","choice5":"技術的安全対策 – 医療情報システム運用管理規定の制定","correct_answer":3,"correct_answers":[3],"explanation":"1)組織的もしくは人的安全対策 （参考：https://www.mhlw.go.jp/content/10808000/000761087.pdf） 2)技術的安全対策（不正アクセスの防止） 3)正解 4)物理的安全対策 5)組織的安全対策"},{"year":"2017","category":"情報処理技術系","question_number":34,"question_text":"データの暗号化を行い解除キーの代わりに金銭を要求する不正プログラムはどれか。","choice1":"ボット","choice2":"アドウェア","choice3":"キーロガー","choice4":"スパイウェア","choice5":"ランサムウェア","correct_answer":5,"correct_answers":[5],"explanation":"1）ボット（BOT）とは、コンピュータを外部から遠隔操作するためのコンピュータウイルスです。ボットに感染したコンピュータは、ボットネットワークの一部として動作するようになります。そして、インターネットを通じて、悪意のあるハッカーが、常駐しているボットにより感染したコンピュータを遠隔操作します。外部から自由に操るという動作から、このような常駐型の遠隔操作ソフトウェアのことをロボット（Robot）をもじってボット（BOT）と呼んでいます。 2)アドウェア (Adware) とは、広告を目的とした通常は無料のソフトウェアである。 なかには、ユーザーに告知せずに何らかの情報を収集するような、マルウェアであるものもある。 料金を支払う事で広告が無くなる、有料版を販売している場合もある。 3)キーロガーは、キーボード操作の内容を記録するソフトウェアおよびハードウェアの総称である。 本来はソフトウェア開発などのデバッグ作業に用いられてきた技術であるが、パスワードや機密情報を盗み出すために悪用される事例が報告されている。 4)スパイウェアとは、コンピュータ内部からインターネットに対して情報を送り出すソフトウェアの総称です。 一般的には、そのようなソフトウェアがインストールされていることや動作していることにユーザーが気付いていない状態で、自動的に情報を送信するソフトウェアをスパイウェアと呼んでいます。"},{"year":"2017","category":"情報処理技術系","question_number":35,"question_text":"情報セキュリティの3要素(CIA)に含まれるのはどれか。","choice1":"完全性","choice2":"見読性","choice3":"真正性","choice4":"信頼性","choice5":"責任追跡性","correct_answer":1,"correct_answers":[1],"explanation":"情報セキュリティの3要素をご存じですか？ 「機密性」（Confidentiality）、「完全性」（Integrity）、「可用性」（Availability）の3つの要素のことで、それぞれの頭文字からCIAと略されています。 「機密性」は限られた人だけが情報に接触できるように制限をかけること。「完全性」は不正な改ざんなどから保護すること。「可用性」は利用者が必要なときに安全にアクセスできる環境であることです。"},{"year":"2017","category":"情報処理技術系","question_number":36,"question_text":"個人情報入力が必要なWebサイトで安全な通信を実現するために利用されるプロトコルはどれか。","choice1":"DES","choice2":"OTP","choice3":"UDP","choice4":"VPN","choice5":"SSL/TLS","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":38,"question_text":"共通鍵暗号方式について正しいのはどれか。","choice1":"電子署名に利用される。","choice2":"暗号化と復号で鍵が異なる。","choice3":"受信者が送信者の秘密鍵で暗号化する。","choice4":"通信相手ごとに異なる鍵で暗号化する。","choice5":"公開鍵方式より暗号化アルゴリズムが複雑である。","correct_answer":4,"correct_answers":[4],"explanation":"DNSキャッシュポイズニングは、パソコンとIPアドレスの組み合わせ情報を記録する「DNSサーバ」に悪意のある嘘の情報を記憶させる攻撃です。 DNSキャッシュサーバは、問い合わせを受けたとき、回答となりうる情報が履歴にあればその情報を返しますが、ない場合（または履歴の有効期限が切れている場合）には、DNSコンテンツサーバに問い合わせます。 ここで悪意を持った攻撃者は、DNSコンテンツサーバの回答よりも先に不正な情報をDNAキャッシュサーバに送り、不正な情報を履歴に保存させます。 そしてユーザーがそこにアクセスすると、攻撃者のサイトに誘導されるという仕組みです。"},{"year":"2017","category":"情報処理技術系","question_number":40,"question_text":"無線LANのセキュリティ規格はどれか。","choice1":"CHAP","choice2":"LDAP","choice3":"SSID","choice4":"Wi-Fi","choice5":"WPA2","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":41,"question_text":"侵入を検知するために設置されるネットワーク機器はどれか。","choice1":"IDS","choice2":"IKE","choice3":"UPS","choice4":"WAF","choice5":"WEP","correct_answer":1,"correct_answers":[1],"explanation":"1)IDS（Intrusion Detection System)は「侵入検知システム」と呼ばれ、ネットワーク上を流れるパケットやホスト上のログ、ファイルなどを監視し、不正なアクセスを検知して警告するシステムである。 2)IKE（Internet Key Exchange)は「インターネット鍵交換」と呼ばれ、IPせｃによる暗号化通信を行うのに先立って、暗号かぎの交換・共有を安全に行うためのプロトコルである。 3)UPSは「無停電電源装置」のこと 4)WAF(Web Application Firewall)は、「Webアプリケーションファイアウォール」と呼ばれ、Webアプリケーションの脆弱性を悪用した攻撃からWebアプリケーションを保護する装置・アプリケーションのことである 5)WEP(Wired Equvalent Privacy)は、初期に登場した無線LAN通信を暗号化する方式の一つである。"},{"year":"2017","category":"情報処理技術系","question_number":42,"question_text":"ウォーターフォールモデルにおける要求分析後の工程の順序として正しいのはどれか。","choice1":"プログラム設計 → 外部設計 → 内部設計","choice2":"内部設計 → プログラム設計 → 外部設計","choice3":"内部設計 → 外部設計 → プログラム設計","choice4":"外部設計 → プログラム設計 → 内部設計","choice5":"外部設計 → 内部設計 → プログラム設計","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":43,"question_text":"次のネットワーク図におけるクリティカルパスはどれか。","choice1":"A→B→E→H→I","choice2":"A→C→F→H→I","choice3":"A→C→F→G→I","choice4":"A→D→F→G→I","choice5":"A→D→G→I","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":44,"question_text":"E-R図が表現するのはどれか。","choice1":"実体と関連","choice2":"作業の手順","choice3":"状態変化の状況","choice4":"データの処理プロセス","choice5":"データの処理と組み合わせ","correct_answer":1,"correct_answers":[1],"explanation":"参考文献サイト】"},{"year":"2017","category":"情報処理技術系","question_number":45,"question_text":"システムの信頼性を評価・検証する「信頼性評価指標(RASIS)」に含まれるのはどれか。","choice1":"機密性","choice2":"見読性","choice3":"真正性","choice4":"保存性","choice5":"保守性","correct_answer":5,"correct_answers":[5],"explanation":"信頼性評価指数とは、信頼性、可用性、保守性または保全性、完全性、安全性の5項目の頭文字をとったもの"},{"year":"2017","category":"情報処理技術系","question_number":46,"question_text":"システム障害発生時、待機系に自動的に切り替える手法はどれか。","choice1":"フェールセーフ","choice2":"フェールソフト","choice3":"フォールバック","choice4":"フールプルーフ","choice5":"フェールオーバー","correct_answer":5,"correct_answers":[5],"explanation":"1)フェールセーフとは、装置はいつか必ず壊れることを前提とし、故障時や異常発生時でも、安全側に動作させることで絶対に人命を危険に晒させないようにシステムを構築する設計手法です。 2)フェイルソフトとは、故障箇所を切り離すなど被害を最小限に抑え、機能低下を許しても、システムを完全には停止させずに機能を維持した状態で処理を続行する設計のこと。これは信頼性設計の一つである。 3)フォールバックとは、通常使用する方式や系統が正常に機能しなくなったときに、機能や性能を制限したり別の方式や系統に切り替えるなどして、限定的ながら使用可能な状態を維持すること。 また、そのような切り替え手順・動作のこと。 4)フールプルーフ とは、安全工学における用語のひとつで、工業製品やシステムを設計する際、誤操作や誤設定などの間違った使い方をしても、少なくとも使用者や周囲にとって危険な動作をしないように、あるいはそもそも間違った使い方ができないように配慮する設計手法のこと。 5)フェイルオーバーは、現用系コンピュータサーバ/システム/ネットワークで異常事態が発生したとき、自動的に冗長な待機系コンピュータサーバ/システム/ネットワークに切り換える機能を意味する。これに対して、何らかの異常を察知して、人間が手動で切り替えを行うことをスイッチオーバーという。"},{"year":"2017","category":"情報処理技術系","question_number":47,"question_text":"運用時間が2,000時間に達したシステムにおいて、1回あたりの復旧に平均0.5時間を要した通算4回のシステム停止があった。","choice1":"0.94","choice2":"0.989","choice3":"0.994","choice4":"0.998","choice5":"0.999","correct_answer":5,"correct_answers":[5],"explanation":"4*0.5=2.0h (2000-2)/2000=0.999"},{"year":"2017","category":"情報処理技術系","question_number":48,"question_text":"eラーニングを実現するための情報システムはどれか。","choice1":"CMS","choice2":"CSS","choice3":"HAL","choice4":"LMS","choice5":"LTO","correct_answer":4,"correct_answers":[4],"explanation":"1)Contents Management System(コンテンツ管理システム）の略。Webコンテンツを管理する仕組み。 2)Cascading Style Sheetの略である。Webページを作成する際に用いる、文書の表現方式にかかわる機能の一つ。 3)IT用語として、この略語を用いる企画やシステム名はない。 4)Learning Management System（学習管理システム）の略である。 5)IT用語としてはLinear TapeｰOpenの略である。大量のデータを長期保管するために適した磁気テープ記憶装置の規格である。"},{"year":"2017","category":"情報処理技術系","question_number":49,"question_text":"クラウドサービスモデルの一つであるIaaS(Infrastructure as a Service)が提供するのはどれか。","choice1":"ハードウェア環境","choice2":"アプリケーション機能","choice3":"モバイル向け開発環境","choice4":"OSとミドルウェアの機能","choice5":"リモートデスクトップ環境","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2017","category":"情報処理技術系","question_number":50,"question_text":"ユーザがデータを対話的に分析するツールはどれか。","choice1":"DWH","choice2":"EDC","choice3":"IDE","choice4":"OLAP","choice5":"RDB","correct_answer":4,"correct_answers":[4],"explanation":"1)Data Ware Houseの略。 2)Electronic Data Captureの略。医療情報システムの一つである地検管理システムの略称として用いられる 3)Integrated Drive Electronicsの略である。コンピュータとハードディスクを接続するための代表的なパラレルインターフェース。 4)OnLine Analytical Processingの略。ビジネスインテリジェンス（BI）ツールのひとつである。 5)Relational DataBaseの略。"},{"year":"2017","category":"医学・医療系","question_number":1,"question_text":"正しいものはどれか。","choice1":"個人情報とプライバシーは、同じ意味である。","choice2":"プライバシーとは、特定の個人を識別する情報である。","choice3":"本人から保有個人情報の開示請求があっても応じる必要はない。","choice4":"個人情報を取得する場合、利用目的を明確にしなければならない。","choice5":"同姓同名者がいるので、氏名は特定の個人を識別する情報ではない。","correct_answer":4,"correct_answers":[4],"explanation":"1)個人情報は個人を特定出来る情報(名前・生年月日・住所・性別・等)。プライバシーは個人が持つ秘密・私事・家族の秘密など。 2)個人情報のこと。 3)必要有 4)正解 5)情報である。"},{"year":"2017","category":"医学・医療系","question_number":2,"question_text":"厚生労働省は、下図のような地域包括ケアシステムの構築を推進している。図中のaに該当するのはどれか。","choice1":"訓練","choice2":"就労","choice3":"福祉","choice4":"保険","choice5":"予防","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":3,"question_text":"インフォームドコンセントについて誤っているものはどれか。","choice1":"医師法に規定されている。","choice2":"十分な説明が必要である。","choice3":"ヘルシンキ宣言で明文化された。","choice4":"患者が自己選択する権利である。","choice5":"リスボン宣言で患者の権利として明文化された。","correct_answer":1,"correct_answers":[1],"explanation":"「医師法」ではなく「医療法」に規定されている。 参考文献サイト】 日本看護協会"},{"year":"2017","category":"医学・医療系","question_number":4,"question_text":"DPC/PDPSにおいて包括評価部分に含まれないのはどれか。","choice1":"検査料","choice2":"手術料","choice3":"投薬料","choice4":"画像診断料","choice5":"入院基本料","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)医師の技量に係わる「ドクターフィー」として、出来高算定される 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":5,"question_text":"保険診療との併用が認められるものはどれか","choice1":"健康診断","choice2":"無診察診療","choice3":"予防的医療","choice4":"医薬品の治験に係る診療","choice5":"特殊療法・研究的検査等","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year ice3":"健康増進法","choice4":"健康保険法","choice5":"社会福祉法","correct_answer":3,"correct_answers":[3],"explanation":"健康増進法第25条に規定されている。"},{"year":"2017","category":"医学・医療系","question_number":14,"question_text":"医療の質に関する評価指標として適切でないのはどれか。","choice1":"外来患者数","choice2":"患者満足度","choice3":"手術後死亡率","choice4":"褥瘡発症患者数","choice5":"ヒヤリハット件数","correct_answer":1,"correct_answers":[1],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":15,"question_text":"院内感染予防を目的に組織横断的に活動しているチームを指すのはどれか。","choice1":"ICT","choice2":"NST","choice3":"RCT","choice4":"DMAT","choice5":"MRSA","correct_answer":1,"correct_answers":[1],"explanation":"1)院内感染予防(Infection Contorl Team) 2)栄養サポートチーム(Nutrition Support Team) 3)ランダム化比較試験(Randomized Controlled Trial) 4)災害派遣医療チーム(Disaster Medical Assistance Team) 5)メチシリン耐性黄色ブドウ球菌(Methicillin-resistant Staphylococcus Aureus) 1)必要な資料を得るために、調査事項をあらかじめ質問の形で記載した用紙を調査対象に配布して、回答を集計・分析する方法。 面接によるもの、郵送によるもの、電話によるもの、集団的に回答を記入させるものなどがある。 調査票法。 2)「４M4E」とは、事故の具体的要因と対応策をマトリックス表にし、まず事故の具体的な要因を記した後、教育、技術、強化・徹底、模範・事例の面から対応策を記すものです。 マトリックス表により、４つの「M」で事故要因を分析し、4つの「E」で対策を立てることで、原因と対策をより明確にすることができます。 3)シェルモデルはヒトを中心におき要因を周囲に配置し図式化、視覚的に事象を把 握しつつ、各々の相互関係から事故発生に影響を与えた要因を整理できるとされ ています。 4)根本原因分析(RCA)とは、問題の原因を特定し、対策を講じて再発を防止できるようにするためのプロセスを指します。 RCAの前提には、症状だけでなく、その根底にある原因に対処すれば、問題をより効果的に解決できるという考え方があります。 5)"},{"year":"2017","category":"医学・医療系","question_number":17,"question_text":"医薬品医療機器等法で高度管理医療機器に分類されるものはどれか。","choice1":"心電計","choice2":"人工呼吸器","choice3":"ネブライザー","choice4":"手術用照明器","choice5":"電子式血圧計","correct_answer":5,"correct_answers":[5],"explanation":"2012年問39と同内容。"},{"year":"2017","category":"医学・医療系","question_number":19,"question_text":"入院診療計画書について誤っているものはどれか。","choice1":"患者に渡す必要はない。","choice2":"多職種が共同して作成する。","choice3":"推定される入院期間を記載する。","choice4":"主治医以外の担当者名も記載する。","choice5":"緊急入院の場合でも作成が必要である。","correct_answer":1,"correct_answers":[1],"explanation":"1)患者説明・署名が必要 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":20,"question_text":"クリニカルパスの説明 ct_answers":[1],"explanation":"1)痛風に関連があるのは「尿素」でなく「尿酸」 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":26,"question_text":"自己免疫性疾患はどれか。2つマークしなさい。","choice1":"帯状疱疹","choice2":"関節リウマチ","choice3":"自律神経失調症","choice4":"本態性高血圧症","choice5":"全身性エリテマトーデス","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。　1)水痘(すいとう)・帯状疱疹ウイルスによって引き起こされる感染症。 2)関節が炎症を起こし、軟骨や骨が破壊されて関節の機能が損なわれ、放っておくと関節が変形してしまう病気。 3)不規則な生活習慣やストレスなどにより、自律神経のバランスが乱れるために起こる、様々な身体の不調のこと。 4) 5)発熱、全身倦怠感などの全身的な炎症と、関節、皮膚、内臓などのさまざまな臓器の障害が一度に、あるいは次々に起こってくる病気。"},{"year":"2017","category":"医学・医療系","question_number":27,"question_text":"特定生物由来製品の使用記録の保存義務期間はどれか。","choice1":"2年","choice2":"5年","choice3":"10年","choice4":"20年","choice5":"50年","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2017","category":"医学・医療系","question_number":28,"question_text":"全身的な効果が期待できない医薬品はどれか。","choice1":"坐剤","choice2":"顆粒剤","choice3":"注射剤","choice4":"軟膏剤","choice5":"内用錠剤","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":29,"question_text":"院外処方箋の有効期間は発行日を含めて何日か。","choice1":"1日","choice2":"4日","choice3":"7日","choice4":"14日","choice5":"30日","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2017","category":"医学・医療系","question_number":30,"question_text":"重症度、医療・看護必要度の評価に含まれないものはどれか。","choice1":"寝返り","choice2":"開腹手術","choice3":"自己注射","choice4":"食事摂取","choice5":"心電図モニター","correct_answer":3,"correct_answers":[3],"explanation":"自己注射は患者自身が行うため看護必要度には含まれない。 1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":31,"question_text":"前立腺がんの診察に用いられる腫瘍マーカーはどれか。","choice1":"AFP","choice2":"CEA","choice3":"PSA","choice4":"CA125","choice5":"CA19-9","correct_answer":3,"correct_answers":[3],"explanation":"1)αフェトプロテイン(AFP)は肝臓がんに用いられる 2)主に胃がんや大腸がんで用いられる腫瘍マーカー 4)主に卵巣がんで用いられる腫瘍マーカー 5)主に膵臓がんで用いられる腫瘍マーカー"},{"year":"2017","category":"医学・医療系","question_number":32,"question_text":"疾患と検査項目の組み合わせで正しいものはどれか。2つマーク。","choice1":"肝炎　－　血清アミラーゼ","choice2":"腎不全　－　血清クレアチニン","choice3":"糖尿病　－　HbA1c","choice4":"膵臓がん　－　AFP","choice5":"脂質異常症　－　CRP","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　1)血清アミラーゼは膵炎や耳下腺炎などで高値となる。肝炎の場合、ALT(GPT)、AST(GOT)が高値を示す。 2)クレアチニンは腎臓の糸球体から濾過され、尿細管から再吸収されにくいため腎機能の評価に用いられる。 3)糖尿病の診断には空腹時血糖のほか、HbAlc、グルコアルブミンの検査値が用いられる。 4)膵臓がんの腫瘍マーカーにはCA19-9が用い垂れる。AFPhは肝臓がんの腫瘍マーカーである。 5)脂質異常症の診断にはLDLおよびHDLコレステロールの検査値が用いられる。CRPは炎症マーカーとして用いられる。"},{"year":"2017","category":"医学・医療系","question_number":33,"question_text":"誤っている組み合わせはどれか。","choice1":"内視鏡検査　－　検体検査","choice2":"血糖検査　－　検体検査","choice3":"組織診断　－　病理検査","choice4":"12誘導心電図　－　生理機能検査","choice5":"スパイロメトリー　－　生理機能検査","correct_answer":1,"correct_answers":[1],"explanation":"検体検査･･･人体から採取した血液や尿など（＝検体）を調べる 生理機能検査･･･人体を直接調べる 1)内視鏡は人体を直接調べるから「検体検査」は間違い。 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":34,"question_text":"X線検査に該当するものはどれか。2つマーク。","choice1":"CT検査","choice2":"MRI検査","choice3":"核医学検査","choice4":"超音波検査","choice5":"血管造影検査","correct_answer":1,"correct_answers":[1,5],"explanation":"正答は1、5。　1)X線を使う 2)磁力と電磁波(ラジオ波)を使う 3)放射性薬剤を使う 4)超音波を使う 5)造影剤を投与し、X線を使う"},{"year":"2017","category":"医学・医療系","question_number":35,"question_text":"造影剤を使わずに血管撮影ができるのはどれか。","choice1":"PET検査","choice2":"MRI検査","choice3":"X線CT検査","choice4":"X線単純撮影検査","choice5":"心筋シンチグラフィ検査","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) MRIは水分を描出するので、血管が撮影できる。 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":36,"question_text":"誤っている組み合わせはどれか。2つマーク。","choice1":"ギプス　－　骨折の治療","choice2":"ブジー　－　病的貯留の排出","choice3":"栄養処置　－　滋養浣腸","choice4":"ドレナージ　－　狭窄部位に管を挿入して拡大","choice5":"カウンターショック　－　心室細動に対する電気的刺激","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　2)狭窄部位に管を挿入して拡大 4)病的貯留の排出 ※2と4の役割が逆"},{"year":"2017","category":"医学・医療系","question_number":37,"question_text":"診療報酬上リハビリテーションに分類されないものはどれか。","choice1":"運動器リハビリテーション","choice2":"感覚器リハビリテーション","choice3":"廃用症候群リハビリテーション","choice4":"心大血管疾患リハビリテーション","choice5":"脳血管疾患等リハビリテーション","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":38,"question_text":"放射線治療について誤っているものはどれか。","choice1":"形態や機能の温存ができる。","choice2":"良性腫瘍で行うことはない。","choice3":"手術後に予防的に行うことがある。","choice4":"陽子線・重粒子線を用いる場合がある。","choice5":"化学療法と併用して行うことがある。","correct_answer":3,"correct_answers":[3,5],"explanation":"正答は3、5。　■POSとは？ POSとは「問題志向型システム（Problem Oriented System）」の略称で、患者さまの持つ「問題」を治療の軸とし、その問題に沿って治療や医療・看護を展開する治療過程のことです。 ■SOAPとは？ このPOSをベースに、患者さまの問題にフォーカスして以下のようなSOAP形式で看護記録を作成します。 1) 2) 3)現病歴、既往歴、家族歴、処方歴、現症等の情報をもとに、入院の契機となった医療上、健康上、あるいは家庭・社会生活上の問題点を、優先順位の高いものから順に箇条書きに記載するものである。 4) 5)状態の変化が激しい患者の場合など経時記録ごとにすべての項目をSOAPで記載すると煩雑になるため、変化のあった問題に限って記録してもよい"},{"year":"2017","category":"医学・医療系","question_number":40,"question_text":"SOAP形式の経過記録について正しい組み合わせはどれか。2つマーク。","choice1":"Ｓ　－　患者の訴え","choice2":"Ｏ　－　病名","choice3":"Ａ　－　治療計画","choice4":"Ｐ　－　検査結果","choice5":"Ｐ　－　処方オーダ","correct_answer":1,"correct_answers":[1,5],"explanation":"正答は1、5。　1)Subject：主観的データ。患者の話や病歴など。 2)Object：客観的データ。身体診察・検査などから得られた情報。 3)Assessment：上記SとOの情報の評価。 4)Plan：上記３つをもとにした治療方針。 5)同上。"},{"year":"2017","category":"医学・医療系","question_number":41,"question_text":"看護記録の保管を義務付けているものはどれか。","choice1":"医師法","choice2":"健康増進法","choice3":"医療法施行規則","choice4":"保健師助産師看護師法","choice5":"看護師の人材確保の促進に関する法律","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":42,"question_text":"人を対象とする医学系研究において配慮すべき点でないものはどれか。","choice1":"倫理審査を受けること","choice2":"研究の必要性を十分説明すること","choice3":"プライバシーに十分配慮すること","choice4":"研究者が医師の資格を有していること","choice5":"被験者へのインフォームドコンセントを実施すること","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":43,"question_text":"「人を対象とする医学系研究に関する倫理指針」において「侵襲」として扱われないものはどれか。","choice1":"切開","choice2":"穿刺","choice3":"放射線照射","choice4":"治療のための投薬","choice5":"造影剤を用いたMRI検査","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":44,"question_text":"コホート研究について誤っているものはどれか。","choice1":"介入研究である。","choice2":"前向き研究がある。","choice3":"後ろ向き研究がある。","choice4":"一定期間追跡調査する。","choice5":"固定集団を観察対象とする。","correct_answer":1,"correct_answers":[1],"explanation":"1)コホート研究とは要因と疾病発生の関連を調べる観察的研究のことで、実験的な介入は行わない 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":45,"question_text":"有病割合が１０％の母集団Ａと有病割合が２０％の母集団Ｂに対して、感度と特異度がどちらも９０％の検査を実施した。正しいものはどれか。","choice1":"陽性的中率も陰性的中率もＡの方が高い。","choice2":"陽性的中率も陰性的中率もＢの方が高い。","choice3":"陽性的中率も陰性的中率もＡとＢは等しくなる。","choice4":"陽性的中率はＡの方が高く、陰性的中率はＢの方が高い。","choice5":"陽性的中率はＢの方が高く、陰性的中率はＡの方が高い。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":46,"question_text":"順序尺度のデータの場合に使用しても差し支えない統計量はどれか。2つ選択。","choice1":"分散","choice2":"最頻値","choice3":"中央値","choice4":"平均値","choice5":"標準偏差","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":47,"question_text":"年齢層が幅広く、分布が非対称である場合、年齢分布の要約統計量として最も適切なものはどれか。","choice1":"中央値と範囲","choice2":"平均値と範囲","choice3":"最頻値と変動係数","choice4":"中央値と標準偏差","choice5":"平均値と標準偏差","correct_answer":1,"correct_answers":[1],"explanation":"要約統計量では代表値とバラツキの指標の２つを組み合わせて示す必要がある。 ・分布が対称の場合…代表値は平均値、バラツキの指標は分散と標準偏差 ・分布が非対称の場合…代表値は中央値、バラツキの指標は四分位範囲と範囲 1)正解 2)組み合わせが不適切 3)変動係数は相対的なバラツキの指標 4)組み合わせが不適切 5)組み合わせは正しいが分布が対称の場合に用いるもの 1)箱の長さを四分位範囲という。 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":49,"question_text":"次の５つの値の中央値が２のとき、[　]に当てはまる数値はどれか。","choice1":"-6","choice2":"-2","choice3":"0","choice4":"1","choice5":"7","correct_answer":5,"correct_answers":[5],"explanation":"5つならべた中の真ん中の数値が中央値。2が中央値となるには-8,-5,2の後に2つ数値が必要。1つは4なので、3以上の数値 1) 2) 3) 4) 5)"},{"year":"2017","category":"医学・医療系","question_number":50,"question_text":"「がん登録等の推進に関する法律」について誤っているものはどれか。","choice1":"がんに係る調査研究に活用する。","choice2":"収集する情報に個人情報は含まれない。","choice3":"がんの診療に関する詳細な情報の収集を図る。","choice4":"各都道府県の登録室へがん患者の罹患情報を届け出る。","choice5":"罹患、診療、転帰等の状況をできる限り正確に把握する。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":1,"question_text":"通常、動画として記録される検査はどれか。","choice1":"PET検査","choice2":"造影CT検査","choice3":"頭部MRI検査","choice4":"眼底カメラ検査","choice5":"心臓カテーテル検査","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)血液の流れや心臓の動きをみるので、動画です"},{"year":"2017","category":"医療情報システム系","question_number":6,"question_text":"在宅患者への遠隔診療を行う際に必須なのはどれか。番号を解答記入欄(６)に２つマークしなさい。","choice1":"代替手段の確保","choice2":"保健所への届出","choice3":"専用通信回線の設置","choice4":"患者もしくは家族の同意","choice5":"生体情報収集装置の設置","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　1)「情報通信機器が故障した場合における対処方法につちえ、あらかじめ患者側及び近隣の意思または歯科医師と綿密に打ち合わせ、取り決めを交わしておくこと。 2)保健所への届け出は不要 3)専用通信回線の設置はあると都合がよいが必須ではない 4)遠隔診療の開始に当たっては、患者及びその家族等に対して、十分な説明を行い、理解を得たうえで行うこと 5)生体情報収集装置の設置は、あると都合がよいが必須ではない"},{"year":"2017","category":"医療情報システム系","question_number":10,"question_text":"患者毎に医薬品アレルギーを登録し、薬剤オーダをするときに自動チェックするシステムを開発した。仕様と運用について適切なのはどれか。２つ選択しなさい。","choice1":"医薬品アレルギーの有無の初期値を「無」とした","choice2":"アレルギーを起こした医薬品はコードで管理できるようにした。","choice3":"医療機関内の採用薬のみでチェック対象のマスターを作成した。","choice4":"医薬品アレルギーの既往がないことを確認した日付を入力できるようにした。","choice5":"アレルギーを起こした医薬品の名称はテキストのみで入力できるようにした。","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1)「無し」ではなく「不明」「未登録」などとすべき 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":11,"question_text":"レセプト電算処理システムに関係しないのはどれか。","choice1":"医療機関","choice2":"介護施設","choice3":"調剤薬局","choice4":"健康保険組合","choice5":"審査支払機関","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3)調剤薬局は医療機関にふくまれる 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":12,"question_text":"通常、予約枠管理が必要でない検査はどれか。","choice1":"胸部CT検査","choice2":"胸部X線検査","choice3":"血管造影検査","choice4":"胸部MRI検査","choice5":"大腸内視鏡検査","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":13,"question_text":"注射実施時の3点認証によって防止できないのはどれか。２つ選択しなさい。","choice1":"禁忌薬投与","choice2":"実施入力もれ","choice3":"患者の取り違え","choice4":"ミキシングの間違い","choice5":"オーダ変更の伝達もれ","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　1)注射オーダ入力の時点でチェック・防止すべき事項。 2) 3) 4)ミキシング＝薬の調合。なので注射実施時にはもう間違っているかどうか確認できない。 5)"},{"year":"2017","category":"医療情報システム系","question_number":14,"question_text":"電子カルテの代行入力について適切でないのはどれか。","choice1":"作成責任者により速やかに承認する。","choice2":"代行入力者のIDでシステムにアクセスする。","choice3":"誰の代行が誰によっていつ行われたかを記録する。","choice4":"代行入力をどの業務に適用するかを運用管理規定で定める。","choice5":"一定時間後に自動確定し、代行入力者を作成責任者とする。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":15,"question_text":"レジメンシステムに求められる機能として適切でないのはどれか。","choice1":"登録されたレジメンに基づくスケジュール管理","choice2":"オーダ時に抗がん剤を自由に組み合わせる機能","choice3":"薬剤師による監査のための投与内容の確認機能","choice4":"オーダされた抗がん剤の容量から最適な規格の組み合わせを示す機能","choice5":"オーダ確定後、医師による最終承認が行われるまで実施ができない機能","correct_answer":2,"correct_answers":[2],"explanation":"レジメンとは、抗がん剤、輸液、支持療法薬の投与に関する時系列的な治療計画である。レジメンは医療安全の確保、がん薬物療法の標準化、施設内業務の効率化を目的としたレジメン委員会等の審査組織を整備して管理される。レジメン管理には薬剤部門（薬剤師）が大きく関与する。がん薬物療法は、施設内の審査を経て登録管理されているレジメンに沿って実施される。レジメンシステムはレジメンの審査承認、登録、実施運用をサポートするシステムであり、オーダエントリシステムと連携する（あるいは機能として組み込まれる）システムである。 よって、（２）オーダー時に抗がん剤を自由に組み合わせる機能はレジメンの目的を損なうことになるため適切でない。"},{"year":"2017","category":"医療情報システム系","question_number":16,"question_text":"処方監査にもっとも関連が低い患者情報はどれか。","choice1":"体重","choice2":"年齢","choice3":"検査値","choice4":"手術日","choice5":"アレルギー歴","correct_answer":4,"correct_answers":[4],"explanation":"処方監査とは、処方箋の内容が対象とsなる患者にとって適切かどうか、薬剤師が確認することである。薬剤師は、患者基本情報、検査結果、過去の処方情報などを確認することで、禁忌薬、投与量、剤型、複数の薬剤を混合した時の安定性や相互作用、重複処方の有無などをチェックする。 1) 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":17,"question_text":"医薬品との関連がもっとも低いのはどれか。","choice1":"手術オーダ","choice2":"創傷処置オーダ","choice3":"糖尿病食オーダ","choice4":"レジメンオーダ","choice5":"胸部単純撮影オーダ","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3)糖尿病食の対象となる糖尿病患者は、食事療法・運動療法・薬物療法を合わせて行っていることが一般的である。インスリンの単位数など薬物療法の詳細をは把握することは、糖尿病食オーダーにおいて摂取エネルギー量など食事内容を決定するうえで不可欠である。 4) 5)単純撮影とは、造影剤を用いない検査を指している。よって同オーダーと医薬品との関係は薄い。"},{"year":"2017","category":"医療情報システム系","question_number":18,"question_text":"医療用医薬品へのバーコード表示の目的でないのはどれか。","choice1":"有効期限の明示","choice2":"医薬品価格の明示","choice3":"取り違え事故の防止","choice4":"医薬品流通の効率化","choice5":"トレーサビリティの確保","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)トレーサビリティ(物品の流通経路を生産段階から最終消費段階あるいは廃棄段階まで追跡が可能な状態)"},{"year":"2017","category":"医療情報システム系","question_number":19,"question_text":"麻薬施用者番号を管理するシステムはどれか。","choice1":"麻薬管理システム","choice2":"処方オーダシステム","choice3":"ユーザ管理システム","choice4":"服薬指導支援システム","choice5":"薬品情報提供システム","correct_answer":3,"correct_answers":[3],"explanation":"麻薬施用者とは、麻薬の施用を許された医師・歯科医師を指す。麻薬を含む処方・注射オーダーの発行には麻薬施用者免許が必要であり、麻薬処方箋にも麻薬施用者番号を記載することが義務付けられている。しかし、オーダーエントリシステムでは同番号を含むユーザー情報を管理していないので、（３）ユーザー管理システムから提供を受けることが一般的である。 1)麻薬管理システムは麻薬の使用を管理するためのシステムであって、一般的には麻薬施用社判尾久の管理を目的としていない。 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":20,"question_text":"処方オーダの機能に含まれないのはどれか。","choice1":"調剤監査","choice2":"薬剤検索","choice3":"禁忌チェック","choice4":"薬剤情報表示","choice5":"院外処方箋発行","correct_answer":1,"correct_answers":[1],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":21,"question_text":"オーダエントリシステムの抗がん剤プロトコルに関する機能として適切でないのはどれか。","choice1":"休薬期間を管理する。","choice2":"抗がん剤のロット番号を管理する。","choice3":"抗がん剤の累積投与量を管理する。","choice4":"患者の体表面積から抗がん剤の投与量を算出する。","choice5":"患者の検査結果値から抗がん剤の投与量を算出する。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)ロット番号の記録が法令で義務づけられているのは、特定生物由来製品である。 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":22,"question_text":"臨床検査情報システムが有する品質管理機能でないのはどれか。","choice1":"デルタチェック","choice2":"レシオチェック","choice3":"ストレスチェック","choice4":"リミットチェック","choice5":"パニック値チェック","correct_answer":3,"correct_answers":[3],"explanation":"1)デルタチェックは、同一患者について、直近の前回値との差や比をチェックする。 2)レシオチェックは、項目間で相関性のある検査項目について、項目間の比や差をチェックする。 3)ストレスチェックは、労働安全衛生法に基づきメンタルヘルスを管理する目的で実施されるもので、臨床検査の品質管理とは関係ない 4)リミットチェックは、あらかじめ設定した範囲から外れた測定値をチェクする。 5)パニック値チェックは、生命に危険が及ぶ限界値としてあらかじめパニック値を設定した項目について、その値に達するかそれを超える異常値をチェックする。"},{"year":"2017","category":"医療情報システム系","question_number":23,"question_text":"検体採取ラベルに印字する必要がないのはどれか。","choice1":"住所","choice2":"採取日","choice3":"患者氏名","choice4":"患者番号","choice5":"依頼診療科","correct_answer":1,"correct_answers":[1],"explanation":"1) 2) 3) 4) 5)"},{"year":"2017","category":"医療情報システム系","question_number":24,"question_text":"検体検査に関するシステムについて正しいのはどれか。２つ選択しなさい。","choice1":"標準化マスターの使用が義務付けられている。","choice2":"オーダと検査結果は必ず1対1の関係にある。","choice3":"微生物検査は結果に応じて追加オーダが発生する。","choice4":"採取検体に対して複数の検査項目を指定できる必要がある。","choice5":"血液検査の場合、入院・外来とも採血の実施時に実施情報が送信される。","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　1)検体検査の分析操作にかかわる情報などは、電子カルテを想定した標準化マスターの範囲外であり、検査システムではより分析業務に最適化されたマスターが使用される。 2)1つのオーダに対し、たとえばパニック値における速報値と最終確定値の、2種類の検査結果が報告されることがある。 3)たとえば想定外の病原体が検出された場合に、感受性検査の追加オーダが発生しうる。 4)たとえば１本の血清検体から、数十もの生化学検査項目が測定されることがある。 5)血液検査の場合は、検査部門で検体の受付がなされた時点で、実施情報が送信されることが多い。"},{"year":"2017","category":"医療情報システム系","question_number":25,"question_text":"生理機能検査に関するシステムの記述について適切なのはどれか。","choice1":"呼吸機能検査の結果は数値のみである。","choice2":"検査レポートの項目・書式は標準化されている。","choice3":"心電図波形を自動判定するためにPDF形式で保存する。","choice4":"心臓超音波検査の画像はPACSに保存することもできる。","choice5":"腹部超音波検査では、患者受付時点で検査内容が確定している。","correct_answer":4,"correct_answers":[4],"explanation":"1)呼吸機能検査の結果には、画像情報に属するスパイログラムが含まれる。 2)検査レポートの項目・書式は、各施設で培われた診療スタイルに最適化されていることが多い。 3)心電図は軽の自動判定には、デジタル化された波形データが用いられる。PDF形式での保存は、閲覧に適している。 4)PACSは画像情報全般の処理に適しており、放射線画像以外にも、心臓超音波検査画像などの保存に利用されることがある。 5)腹部超音波検査では、たとえば検査時点で初めて見つかった結節用所見に対し血流ドプラを追加するなど、患者受付後であっても適宜、検査内容が追加・修正される。"},{"year":"2017","category":"医療情報システム系","question_number":26,"question_text":"放射線検査の運用とそれに関連するシステムの組み合わせで誤っているのはどれか。","choice1":"医師が検査を依頼する　　　　　-　RIS","choice2":"検査依頼情報を撮影装置に送る　-　RIS","choice3":"読影医が画像診断を行う　　　　-　PACS","choice4":"医師が画像を閲覧する　　　　　-　PACS","choice5":"医師が撮影実施情報を確認する　-　オーダエントリシステム","correct_answer":1,"correct_answers":[1],"explanation":"1）放射線検査の依頼は外来、病棟のHIS端末のオーダエントリシステムから入力され、HISサーバーへ保存される。その情報がRISに転送される。IHE-SWF（通常の運用フロー）ではRISから検査依頼の発行はあるが、日本では検査の前処置薬などの関連会計情報を検査依頼にまとめるため行われないので誤りである。 2)検査依頼情報を撮影危機に送るのはRISからDICOMのMWM（ワークリスト）転送で行う。 3)読影医が画像診断を行うにはPACSの画像表示端末に画像を受信表示する。 4)医師が画像閲覧するのもPACSである。放射線部内PACSと病院全体のPACSの２つが存在する場合もあるが、基本的にPACSである。 5)外来石が患者診察のため検査終了を待っている場合、患者の検査終了はRISあるいはPACSからHISに実施情報として送付され、オーダエントリシステムで検査終了の表示を確認することになる。"},{"year":"2017","category":"医療情報システム系","question_number":27,"question_text":"RISの機能でないのはどれか。","choice1":"検査画像の参照","choice2":"検査依頼の受付","choice3":"使用した造影剤の登録","choice4":"医事会計システムへの実施情報の送信","choice5":"物流システムへの使用物品情報の送信","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":28,"question_text":"PACSについて適切でないのはどれか。","choice1":"検像に利用する。","choice2":"画像の保存と交換を行う。","choice3":"DICOM規格が用いられている。","choice4":"心電図波形の保管に対応している。","choice5":"画像は1/20以上に圧縮して保存する。","correct_answer":5,"correct_answers":[5],"explanation":"画像データの圧縮を行うと画像が劣化して診断や説明に支障をきたす可能性がある。診断能力の観点から、１０分の１の圧縮は容認できるが、２０分の１以上の圧縮は容認できないという報告がある。"},{"year":"2017","category":"医療情報システム系","question_number":29,"question_text":"「患者紹介等に付随する医用画像についての合意事項」(平成28年9月16日)に記載されていないのはどれか。","choice1":"画像の圧縮を行わないこと","choice2":"大量の画像を送らないこと","choice3":"DICOM規格に違反しないこと","choice4":"IHE統合プロファイルに準拠すること","choice5":"1枚のCD-Rに家族のデータをまとめて記録すること","correct_answer":5,"correct_answers":[5],"explanation":"１枚のCD-Rに書き込む患者は１名ー１IDとすることと記載されているので誤りである。"},{"year":"2017","category":"医療情報システム系","question_number":30,"question_text":"輸血部門システムについて誤っているのはどれか。","choice1":"血液型不適合輸血を防止する機能が必要である。","choice2":"血液製剤の使用記録ならびに患者輸血歴の保存期間を5年間とする。","choice3":"血液製剤出庫の際にはコンピュータクロスマッチの機能が必要である。","choice4":"輸血後2～3か月後に感染症マーカーをチェックできることが望ましい。","choice5":"患者本来の血液型とは異なる血液製剤の払い出しを可能にする必要がある。","correct_answer":2,"correct_answers":[2],"explanation":"2）輸血用血液を含む血液製剤は特定生物由来製品であるため、製材使用記録ならびに患者輸血歴を20年間保管することが義務付けられている。 5）緊急時に患者の血液型検査を行う余裕がない場合や血液型が一致する血液がない場合に、考査適合試験を行わずにO型赤血球製剤を輸血する場合がある。骨髄移植を行う場合、白血球の型が適合していることが必須だが、赤血球の型（血液型）が異なっていても可能である。よって、骨髄移植後にほんらいの血液型と異なった血液型になるケースがある。"},{"year":"2017","category":"医療情報システム系","question_number":31,"question_text":"通常、手術管理システムに実装されないのはどれか。","choice1":"使用材料入力機能","choice2":"術中看護記録機能","choice3":"麻酔管理記録機能","choice4":"医師手術記録機能","choice5":"手術室予約管理機能","correct_answer":4,"correct_answers":[4],"explanation":"4)手術を行った医師の氏名、患者の氏名等手術記録を識別できる情報を記録するもので、手術オーダと関連させ、電子診療録の診療文書機能などで作成されることから、誤りである。"},{"year":"2017","category":"医療情報システム系","question_number":32,"question_text":"歯科システムについて誤っているのはどれか。","choice1":"患者基本情報は医科と同様の項目が必要である。","choice2":"歯の部位毎に過去の診療履歴を保持する必要がある。","choice3":"ミス防止のため複数歯を同時に選べない機能が必要である。","choice4":"歯がない状態（喪失歯）でも、病名部位として選択できる必要がある。","choice5":"複数歯に同一病名が付けられる場合、レセプトではそれらを部位で統合して表記する。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":33,"question_text":"歯科の電子カルテシステムの運用において誤っているのはどれか。","choice1":"処置中に参照される機会が多い。","choice2":"処置終了後に入力される機会が多い。","choice3":"患者基本情報のうち感染症情報がしばしば参照される。","choice4":"診療開始前に直近の治療履歴が参照される機会が多い。","choice5":"保険診療と自費診療では診療録を区別する必要がある。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":35,"question_text":"病棟指示の説明として適切でないのはどれか。","choice1":"身体拘束は安静度の指示に基づき実施される。","choice2":"医事会計システムと連携が必要な指示がある。","choice3":"用法が複雑な注射・処方は病棟指示に基づき実施される。","choice4":"測定・観察は指示がなくても看護師自らの判断で実施できる。","choice5":"予測指示（約束指示）に基づき患者に薬剤を投与し実施入力をする。","correct_answer":1,"correct_answers":[1],"explanation":"1）「身体拘束」は、医師が治療上の必要から患者の行動を制限しなければならないと判断した場合、抑制帯などを用いて患者の四肢や体幹を拘束することであり、医師の指示に基づき実施されるものである。「安静度」は、同様に医師が治療上の必要から患者の日常生活行動を制限する目的で出す支持であるが、食事制限やベッド上安静などであり、用具で身体を拘束することは含まれない。よって1)は適切ではない。なお、身体拘束は患者の人権にかw変わるものであるため、このオーダーを発行する際、その理由を明確にしなければならない"},{"year":"2017","category":"医療情報システム系","question_number":36,"question_text":"病院情報システムを更新する際の考え方として適切でないのはどれか。","choice1":"要求仕様書作成のために詳細な現状分析を実施する。","choice2":"現行システムで実現できている機能は要求仕様書に記載しない。","choice3":"システム移行日は診療報酬請求や統計情報を考慮して設定する。","choice4":"現行システムに接続中の既存機器を移行後も使用できるようにする。","choice5":"データ移行では現行システムから抽出する情報をベンダーに詳細に確認する。","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":37,"question_text":"バランストスコアカード(BSC)の4つの視点に含まれないのはどれか。","choice1":"顧客の視点","choice2":"安全の視点","choice3":"財務の視点","choice4":"学習と成長の視点","choice5":"業務プロセスの視点","correct_answer":2,"correct_answers":[2],"explanation":"バラqン巣スコアカードは、1990年代に考えられた業績評価の仕組みで、一般企業で利用され、その後病院経営にも応用されている"},{"year":"2017","category":"医療情報システム系","question_number":38,"question_text":"システム導入手順のなかで、通常病院が実施しないのはどれか。","choice1":"仕様書の作成","choice2":"マスターの作成","choice3":"リハーサルの実施","choice4":"ユーザの教育訓練","choice5":"システムの内部設計","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":39,"question_text":"IT資産調達フェーズにおいて最初に作成されるのはどれか。","choice1":"IT導入計画書","choice2":"IT資産調達計画書","choice3":"提案依頼書(RFP)","choice4":"ベンダー選定リスト","choice5":"情報提供依頼書(RFI)","correct_answer":1,"correct_answers":[1,2,3,4],"explanation":"正答は1、2、3、4。"},{"year":"2017","category":"医療情報システム系","question_number":40,"question_text":"リース契約（ファイナンス・リース）について正しいのはどれか。","choice1":"物件の所有者はリース会社である。","choice2":"リース料には保守料が含まれている。","choice3":"リース期間中の中途解約はいつでも可能である。","choice4":"リース会社はリース物件に対する瑕疵担保責任を負う。","choice5":"契約期間満了時は必ず再リース契約をしなければならない。","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":41,"question_text":"医療情報システムにおける技術的安全対策でないのはどれか。","choice1":"アクセスの記録","choice2":"盗難、窃視等の防止","choice3":"アクセス権限の管理","choice4":"利用者の識別及び認証","choice5":"ネットワークからの不正アクセス防止","correct_answer":2,"correct_answers":[2],"explanation":"盗難、窃視等の防止は物理的対策である"},{"year":"2017","category":"医療情報システム系","question_number":42,"question_text":"病院と外部の機関とを接続する場合、セキュリティの担保に必要でないのはどれか。","choice1":"利用実態の監査を行う。","choice2":"患者情報は必ず匿名化する。","choice3":"セキュリティレベルを一致させる。","choice4":"関連する組織で責任分界点を予め定める。","choice5":"利用者の研修を行い、修了者にのみ利用させる。","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":43,"question_text":"診療録等の電子保存の3基準にあてはまるのはどれか。2つ選べ。","choice1":"運用性","choice2":"可用性","choice3":"完全性","choice4":"見読性","choice5":"保存性","correct_answer":4,"correct_answers":[4,5],"explanation":"正答は4、5。　電子保存の3基準は、4）「見読性」、5）「保存性、および「真正性」である。 「見読性」は一般的なセキュリティの言葉で言えば「可用性」であるが、診療録は行政などによる監査の対象となる書類であるため、単なる「可用性」より人が見て理解できる状態にできることという意味で「見読性」という言葉が使われている。 3）「完全性」とは一般的なセキュリティ用語で、虚偽入力、書き換え、消去、混同が防止されていることであり、「真正性」の概念のひとつである。"},{"year":"2017","category":"医療情報システム系","question_number":44,"question_text":"電子保存の3基準のなかの真正性について誤っているのはどれか。","choice1":"代行操作を認める場合は運用管理規定で定める。","choice2":"情報の作成責任者が明確で、いつでも確認できる。","choice3":"保存された情報を必要に応じて直ちに書面に表示できる。","choice4":"過失による虚偽入力、書き換え、消去及び混同の防止を行う。","choice5":"一旦確定した診療録等を更新した場合、更新履歴を保存する。","correct_answer":3,"correct_answers":[3],"explanation":"見読性である"},{"year":"2017","category":"医療情報システム系","question_number":45,"question_text":"保健医療福祉分野PKI(HPKI)署名用電子証明書を使わないのはどれか。","choice1":"利用者の医療資格を確認するとき","choice2":"診療報酬請求を電子的に行うとき","choice3":"地域医療情報システムにログインするとき","choice4":"紙のカルテをスキャンして電子保存するとき","choice5":"診療情報提供書や患者紹介状を電子的に発行するとき","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":46,"question_text":"オンラインで医療情報の外部保存を委託する場合、適切でないのはどれか。","choice1":"受託事業者が情報漏洩の責任をすべて負う。","choice2":"受託事業者が独自に第三者に提供しないように規定する。","choice3":"受託事業者との委託契約に守秘に関連した項目を定める。","choice4":"受託事業者が各種ガイドラインを遵守することを契約で定める。","choice5":"受託事業者と結ぶネットワーク回線がガイドラインに適合していることを確認する。","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":47,"question_text":"システム管理部門における電子カルテシステムのアカウント管理について適切でないのはどれか。2つ選べ。","choice1":"2要素認証を採用した。","choice2":"医師のIDを退職後に削除した。","choice3":"複数のユーザが共用のアカウントを使用できるようにした。","choice4":"アクセスログを取得して不正なアクセスをしていないか定期的に確認した。","choice5":"アカウント登録時に、IDと初期パスワードが印刷された紙を直接本人に渡した。","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。"},{"year":"2017","category":"医療情報システム系","question_number":48,"question_text":"障害発生時のシステム管理部門の対応として適切でないのはどれか。","choice1":"障害の原因を調査する。","choice2":"障害発生を院内に伝達する。","choice3":"ただちにサーバの再起動を行う。","choice4":"障害の影響範囲の切り分けを行う。","choice5":"障害の回復を確認して院内に伝達する。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":49,"question_text":"システム障害時に利用者が行うべきでないのはどれか。","choice1":"現在の業務への影響を把握する。","choice2":"異常現象をシステム管理部門へ連絡する。","choice3":"予想される影響をシステム管理部門へ正確に伝える。","choice4":"周辺の端末でも類似した現象が起きていないかを確認する。","choice5":"システム管理部門に報告することなく手書き運用に切り替える。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":50,"question_text":"病院情報システムの評価と関係が薄いのはどれか。","choice1":"医療安全の向上","choice2":"患者待遇の向上","choice3":"人事考課への反映","choice4":"地域医療への貢献","choice5":"事務作業の効率向上","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":51,"question_text":"医療情報標準化指針を採択している組織はどれか。","choice1":"IPSJ","choice2":"IHE-J","choice3":"JAHIS","choice4":"HELICS","choice5":"MEDIS-DC","correct_answer":4,"correct_answers":[4],"explanation":"1)情報処理学会 2)運用ワークフローを定義し、このワークフローを実装するための標準機悪の使い方を規定した仕様書を提供する。 このワークフローを統合プロファイルといい、仕様書をテクニカル・フレームワークという。 3)日本保険医療福祉情報システム工業会は保健医療福祉情報システム提供者及びこれに関連する事業を営む法人を会員とする組織であり、技術基準の策定などを行っている 4)医療情報標準化推進協議会 5)医療情報システム開発センターは、標準病名や標準医薬品コード"},{"year":"2017","category":"医療情報システム系","question_number":52,"question_text":"保健医療情報分野の標準規格（厚生労働省標準規格）でないのはどれか。","choice1":"ICD10対応標準病名マスター","choice2":"JAHIS臨床検査データ交換規約","choice3":"JAHIS HPKI電子認証ガイドライン","choice4":"SS-MIX2ストレージ仕様書および構築ガイドライン","choice5":"IHE統合プロファイル「可搬型医用画像」およびその運用指針","correct_answer":3,"correct_answers":[3],"explanation":"制定に際しては、「標準に関する関係者合意を形成しうる団体」として、HELICS協議会が選定されている。制定された規格は厚労省が発出する通知で公表されている"},{"year":"2017","category":"医療情報システム系","question_number":53,"question_text":"標準病名マスターについて正しいのはどれか。2つ選べ。","choice1":"MEDIS-DCが作成・管理している。","choice2":"病名の接頭辞は病名ごとに別個のコードが振られている。","choice3":"各々の病名に対してICD-10の分類コードが振られている。","choice4":"同義の病名が複数ある場合はそれぞれにコードが振られている。","choice5":"病名を電子レセプト請求に用いるために専用の変換ソフトが用意されている。","correct_answer":1,"correct_answers":[1,3],"explanation":"正答は1、3。　標準病名マスターは「ICD１０対応標準病名マスター」のことであり、MEDIS-DCが開発と管理を行っている。 2)病名の接頭辞のような病名に付加して利用される修飾語をまとめたものが修飾語テーブルである。 4)同義の病名に対しては同一のコードが付与されている。 5)電子レセプト請求に用いられる「傷病名マスター」と「標準病名マスター」は事実上同じものとなっている。"},{"year":"2017","category":"医療情報システム系","question_number":54,"question_text":"DICOM規格で規定されていないのはどれか。","choice1":"読影レポート","choice2":"画像の圧縮方式","choice3":"画像に付随する検査情報","choice4":"RISとモダリティ間の通信","choice5":"画像検査オーダの送信フォーマット","correct_answer":5,"correct_answers":[5],"explanation":"5)画像検査オーダー情報のHISからRISへの送信フォーマットはHL7で規定される。"},{"year":"2017","category":"医療情報システム系","question_number":55,"question_text":"地域医療連携において患者名などによって患者情報の検索を行うための統合プロファイルはどれか。","choice1":"PDQ","choice2":"PIX","choice3":"XCA","choice4":"XDS","choice5":"ATNA","correct_answer":1,"correct_answers":[1],"explanation":"1)Patient Demographic Queryには、患者氏名、生年月日、住所など患者を同定するための患者情報が記載される 5)AuditTrail and Node Authentication）はサーバー間通信のノード認証と通信のログを記載する。"},{"year":"2017","category":"医療情報システム系","question_number":56,"question_text":"コミュニティ間の連携基盤を提供する統合プロファイルはどれか。","choice1":"PDI","choice2":"PDQ","choice3":"PIX","choice4":"SWF","choice5":"XCA","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2017","category":"医療情報システム系","question_number":57,"question_text":"病院情報システムに格納されている検体検査情報をSS-MIX2標準化ストレージに保存するときに用いられるのはどれか。","choice1":"DICOM","choice2":"HL7","choice3":"HOT","choice4":"J-MIX","choice5":"MFER","correct_answer":2,"correct_answers":[2],"explanation":"2)医療情報交換のための標準規約で、患者管理、オーダ、照会、財務、検査報告、マスタファイル、情報管理、予約、患者紹介、患者ケア、ラボラトリオートメーション、アプリケーション管理、人事管理などの情報交換を取り扱います。HL7はHealth Level Sevenの略で、「医療情報システム間のISO-OSI第７層アプリケーション層」に由来しています。米国のHL7協会本部では数多くの技術委員会を組織し新しい標準の研究・作成を行っており、会員（米国及び国際支部国）の承認後発行されます。日本においても大学病院などのシステム化や各種の標準化活動において本標準が採用されています。"},{"year":"2017","category":"医療情報システム系","question_number":58,"question_text":"SS-MIX2標準化ストレージについて誤っているのはどれか。","choice1":"災害対策として活用することも可能である。","choice2":"リレーショナルデータベースの利用が必須である。","choice3":"保健医療情報分野の標準規格（厚生労働省標準規格）の一つである。","choice4":"提供・利用者が相互合意したJPEG形式の画像ファイルを拡張ストレージに保管できる。","choice5":"標準化ストレージにはHL7v2.5をベースとした処方、注射、検体検査結果を保存できる。","correct_answer":2,"correct_answers":[2],"explanation":"SS-MIX2はストレージであり、リレーショナルデータベースの構築は必須ではない。"},{"year":"2017","category":"医療情報システム系","question_number":59,"question_text":"医療情報技師の3Cに含まれないのはどれか。2つ選べ。","choice1":"Collaboration","choice2":"Communication","choice3":"Connection","choice4":"Consultation","choice5":"Coordination","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　Communication Collaboration Coordination"},{"year":"2017","category":"医療情報システム系","question_number":60,"question_text":"ナショナルデータベース(NDB)の説明で誤っているのはどれか。","choice1":"医療動向を評価する上で悉皆性が高い。","choice2":"レセプト情報と特定健診情報が含まれる。","choice3":"介護保険による各種サービス利用情報は含まれない。","choice4":"二次利用可能な一般公開されるデータベースである。","choice5":"医療費適正化計画作成のための調査や分析に用いられる。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2018","category":"情報処理技術系","question_number":1,"question_text":"１６進数73と16進数F5の各桁の論理積（AND）を2進数で表したものはどれか","choice1":"110001","choice2":"1110001","choice3":"10110001","choice4":"11001100","choice5":"11100110","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2018","category":"情報処理技術系","question_number":2,"question_text":"情報の単位の接頭辞が小さい順に並んでいるのはどれか。","choice1":"E<P<G<T","choice2":"P<E<T<G","choice3":"E<G<T<P","choice4":"G<T<P<E","choice5":"G<T<E<P","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2018","category":"情報処理技術系","question_number":3,"question_text":"正しい組み合わせはどれか。","choice1":"画素数　byte","choice2":"記憶容量　pixel","choice3":"スキャナの解像度　dpi","choice4":"ネットワークの通信速度　Hz","choice5":"CPUのクロック周波数　bps","correct_answer":3,"correct_answers":[3],"explanation":"1)記憶容量 2)画素数 3) 4)周波数 5)インターネットの通信速度"},{"year":"2018","category":"情報処理技術系","question_number":4,"question_text":"3つの値が等しいのはどれか。（）内は基数を表す。","choice1":"129（10）、1000 0001(2), 81(16)","choice2":"5)129(10), 1000 0001(, 83(16)","choice3":"127(10),1000 0001(2), 81(16)","choi "choice1":"0.5秒","choice2":"１秒","choice3":"２秒","choice4":"４秒","choice5":"8秒","correct_answer":5,"correct_answers":[5],"explanation":"300*8/（600*0.50）＝8 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":22,"question_text":"192.168.128.0/23と設定されたネットワークにおいて、割り当て可能な最大ホスト数はどれか。","choice1":"23","choice2":"126","choice3":"254","choice4":"510","choice5":"1022","correct_answer":4,"correct_answers":[4],"explanation":"2^9-2＝510 ネットワークアドレスとブロードキャストの２つは使用できない 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":23,"question_text":"MACアドレスからIPアドレスを確認するプロトコルはどれか。","choice1":"ARP","choice2":"RIP","choice3":"DHCP","choice4":"HTTP","choice5":"RARP","correct_answer":5,"correct_answers":[5],"explanation":"1)ARP(Address Resolution Protocol)は、RARPの逆の働きをするプロトコルで、IPアドレスから通信相手のMACアドレスを知るためのプロトコルである。 2)RIP（Routing Information Protocol）は、複数のネットワークを経由してデータを送るときに、最短のルートを見つけるプロトコルである 3)ホストのネットワーク設定を自動化する仕組みで用いるプロトコル 4) 5)Reverse Address Resolution Protocolは物理アドレスからIPアドレスを問い合わせるためのプロトコルである"},{"year":"2018","category":"情報処理技術系","question_number":24,"question_text":"NAPTで変換される情報はどれか。","choice1":"プロトコルとホスト名","choice2":"ホスト名とIPアドレス","choice3":"ポート番号とプロトコル","choice4":"IPアドレスとポート番号","choice5":"MACアドレスとIPアドレス","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)プライベートアドレスとグローバルアドレスを対応付けるための手法の一つ。 NAPTはITアドレスに加えポート番号を組み合わせた変換テーブルを用いることにより1対nの変換を可能にし、 一つのグローバルアドレスに複数のプライベートIPアドレスを持つ端末を接続することが可能になる 5)"},{"year":"2018","category":"情報処理技術系","question_number":25,"question_text":"ネットワークコマンドと機能の組み合わせで正しいのはどれか。","choice1":"ipconfig – 端末のネットワーク設定情報を確認","choice2":"nslookup – サーバーの接続可否を確認","choice3":"ping – サーバー上のログを確認","choice4":"telnet – 途中経路を確認","choice5":"tracert – ホスト名からIPアドレスを確認","correct_answer":1,"correct_answers":[1],"explanation":"1)Windows OSで自端末のネットワークの設定内容を確認するこまんどである 2)nslookupは、DNSサーバに対して問い合わせを行い、ホスト名とIPアドレスの対応の確認、各種DNSレコードの参照に用いるコマンドである 3)pingは、相手先ホストやネットワーク機器へパケットを送信し、相手先機器の稼働とネットワーク疎通を確認するコマンド 4)telnetは、対象のコンピュータにリモートログインし、ネットワーク経由で遠隔操作や情報参照を行うためのコマンド 5)tracertは、WindowsOSで、相手先のホストに到達するまでに経由するネットワーク機器を順次表示し、ネットワークの途中経路を確認するコマンド"},{"year":"2018","category":"情報処理技術系","question_number":26,"question_text":"サービスとポート番号の組み合わせで誤っているのはどれか","choice1":"ssh – 22","choice2":"HTTP – 80","choice3":"HTTPS – 443","choice4":"POP3s – 995","choice5":"SMTP – 110","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)25"},{"year":"2018","category":"情報処理技術系","question_number":27,"question_text":"IMAP4について正しいのはどれか","choice1":"ホスト名を解決する","choice2":"データの暗号化をする","choice3":"電子メールを取り扱う","choice4":"ダイアルアップ接続を行う","choice5":"コンピュータの時刻を同期する","correct_answer":3,"correct_answers":[3],"explanation":"1)DNS 2)SSL/TSL 3)電子メールの受信を行うプロトコル 4)PPP 5)NTP"},{"year":"2018","category":"情報処理技術系","question_number":28,"question_text":"IPv6のアドレス長はどれか","choice1":"24ビット","choice2":"32ビット","choice3":"48ビット","choice4":"64ビット","choice5":"128ビット","correct_answer":5,"correct_answers":[5],"explanation":"IPv4が32ビットのIPアドレスを使用するのに対し、IPv6は128ビットのIPアドレスを使用する。このため、IPv6はIPv4と比べて非常に大きなIPアドレス空間を持っている。 1) 2) 3) 4) 5) 参考文献サイト】https://ja.wikipedia.org/wiki/IPv6%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9"},{"year":"2018","category":"情報処理技術系","question_number":29,"question_text":"IEEE802.11acで使用可能な周波数帯と最大通信速度の組み合わせで正しいのはどれか","choice1":"5GHz帯のみ　-　54Mbps","choice2":"5GHz帯のみ　-　6.9Gbps","choice3":"2.4GHz帯のみ　-　54Mbps","choice4":"2.4GHz帯および5GHz帯　-　6.9Gbps","choice5":"2.4GHz帯および5GHz帯　-　600Mbps","correct_answer":2,"correct_answers":[2],"explanation":"IEEE 802.11acはギガビットスループットをIEEE 802.11aやIEEE 802.11nと同じ5 GHz帯で提供することが規定されている。2.4 GHzは利用しない。最大伝送速度は、Wave2（第2世代）で6.9 Gbps（160 MHzチャネルボンディング、8ストリーム時）となる 1) 2) 3) 4) 5) 参考文献サイト】https://ja.wikipedia.org/wiki/IEEE_802.11#IEEE_802.11ac_(Wi-Fi_5)"},{"year":"2018","category":"情報処理技術系","question_number":30,"question_text":"情報セキュリティ対策において、防犯カメラの設置が該当するのはどれか","choice1":"人的安全対策","choice2":"技術的安全対策","choice3":"組織的安全管理対策","choice4":"物理的安全対策","choice5":"予防的安全対策","correct_answer":4,"correct_answers":[4],"explanation":"物理的安全管理措置とは、入退館（室）の管理、個人データの盗難の防止等の措置をいう。物理的安全管理措置には以下の事項が含まれる。 ①入退館（室）管理の実施　②盗難等に対する対策　③機器・装置等の物理的な保護 1) 2) 3) 4) 5) 参考文献サイト】https://www.lrm.jp/iso27001/blog/security/8321/"},{"year":"2018","category":"情報処理技術系","question_number":31,"question_text":"250人が相互に公開鍵暗号方式で暗号化通信するとき、必要なカギの総数はどれか","choice1":"50","choice2":"125","choice3":"250","choice4":"500","choice5":"1000","correct_answer":4,"correct_answers":[4],"explanation":"2n 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":32,"question_text":"A病院からB病院に公開鍵暗号方式を用いて暗号化した情報を送るとき、図中の鍵Xとして適切なのはどれか。","choice1":"A病院の公開鍵","choice2":"A病院の秘密鍵","choice3":"B病院の公開鍵","choice4":"B病院の秘密鍵","choice5":"A、B病院の共通鍵","correct_answer":3,"correct_answers":[3],"explanation":"公開鍵方式では、「受信側の公開鍵」で暗号化し、「受信側の秘密鍵」で復号する。 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":33,"question_text":"一定時間ごとにパスワードが更新される認証の仕組みはどれか","choice1":"コールバック","choice2":"マイナンバー","choice3":"バイオメトリクス","choice4":"シングルサインオン","choice5":"ワンタイムパスワード","correct_answer":5,"correct_answers":[5],"explanation":"一定時間ごとに発行され、文字通り一度きりしか使えないパスワード、およびそれを採用した認証の仕組み 1)電話回線を用いた通信において、正しい発信元であることを確認するために、着呼した発信元番号を記録して一旦電話を切り、 記録した番号に発呼する仕組み 2)住民票を持つ日本国内の全住民に付番される12桁の番号です 3)人間の身体的または行動的特徴を用いて個人認証する仕組み 4)1度のユーザー認証によって複数のシステム（業務アプリケーションやクラウドサービスなど）の利用が可能になる仕組み 5)"},{"year":"2018","category":"情報処理技術系","question_number":34,"question_text":"情報システムの可用性を高めるのはどれか","choice1":"アクセス制限の使用","choice2":"デジタル署名の使用","choice3":"ハッシュ関数の使用","choice4":"タイムスタンプの使用","choice5":"無停電電源装置(UPS)の使用","correct_answer":5,"correct_answers":[5],"explanation":"可用性とは「情報が必要なときはいつでも利用できる状態であること」 1)アクセス制御は不正アクセスを防ぐ目的であり「機密性」を高める 2)デジタル署名はメッセージの正当性を確認するものであり「完全性」高める 3)メッセージダイジェストの計算手順であり、MD5やSHA-1がある。「完全性」を高める 4)電子署名ではあきらかにできない文書等が作られた日時を証明するために作られたもの 5)"},{"year":"2018","category":"情報処理技術系","question_number":35,"question_text":"タイムスタンプの説明として正しいのはどれか","choice1":"有効期限がない","choice2":"検索が高速になる","choice3":"暗号化が可能になる","choice4":"データの記載内容が正しいことを証明できる","choice5":"ファイルが改ざんされていないことを証明できる","correct_answer":5,"correct_answers":[5],"explanation":"データが編集されたかどうかは判断できるが、内容について証明はできない 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":36,"question_text":"パスワード入力履歴などを特定の第3者に送信するマルウェアはどれか。","choice1":"アドウェア","choice2":"スパイウェア","choice3":"フィッシング","choice4":"ランサムウェア","choice5":"エクスプロイトコード","correct_answer":2,"correct_answers":[2],"explanation":"1)広告を目的として様々な動きをするプログラムである 2)ユーザーが閲覧したホームページの履歴や実行した操作の内容、個人情報や入力履歴などの情報を外部に送信する不正プログラムである 3)正規のウェブサイトを装い、暗証番号などを詐取する 4)感染したコンピュータを使用不能にした後、元に戻すことと引き換えに身代金を要求したりする不正プログラムである 5)コンピュータの脆弱性を利用するために記述されたスクリプトやプログラムのことである"},{"year":"2018","category":"情報処理技術系","question_number":37,"question_text":"セキュリティパッチが公開される前のセキュリティホールを利用した攻撃はどれか","choice1":"F5アタック","choice2":"DDosアタック","choice3":"ゼロデイアタック","choice4":"ブルートフォースアタック","choice5":"バッファオーバーランアタック","correct_answer":3,"correct_answers":[3],"explanation":"1) F5アタックはブラウザの再読み込みを悪用することで、サーバーに負荷を与え続ける攻撃です。 2)標的となるサーバーに多数のコンピュータから過負荷を与えることでサービスを停止させようとする攻撃である 3) 4)パスワードに使われている可能な組み合わせの文字列をすべて試みることにおり、パスワードを不正に入手する行為 5)バッファーを超えるデータを投入しデータをあふれさせることにより、システムを運用不能にしたり、不正侵入をしたりする攻撃のこと"},{"year":"2018","category":"情報処理技術系","question_number":38,"question_text":"脅威がつけ込むことのできる情報資産が持つ弱点はどれか","choice1":"瑕疵","choice2":"リスク","choice3":"脆弱性","choice4":"アクシデント","choice5":"インシデント","correct_answer":3,"correct_answers":[3],"explanation":"脆弱性（ぜいじゃくせい）とは、コンピュータのOSやソフトウェアにおいて、プログラムの不具合や設計上のミスが原因となって発生した情報セキュリティ上の欠陥のことを言います。 脆弱性は、セキュリティホールとも呼ばれます。 1) 2) 3) 4) 5)コンピュータやネットワークのセキュリティを脅かす事象"},{"year":"2018","category":"情報処理技術系","question_number":39,"question_text":"Webアプリケーションへの攻撃の検出と遮断に特化したファイアウォールはどれか","choice1":"DMZ","choice2":"IPA","choice3":"IPS","choice4":"WAF","choice5":"WPA","correct_answer":4,"correct_answers":[4],"explanation":"1)ファイアウォールに守られた領域のこと 2)情報処理推進機構のこと 3)侵入防止システム 4)Web Application Firewall　Webアプリケーションの脆弱性を突いた攻撃へ対するセキュリティ対策のひとつです。ネットショッピングやゲーム、インターネットバンキングなど、顧客情報やクレジットカード情報に関するデータのやり取りが発生するWebサービスが保護対象となります。 5)TKIPを採用した無線LANの暗号化方式である"},{"year":"2018","category":"情報処理技術系","question_number":40,"question_text":"SSL/TLSについて正しいのはどれか","choice1":"URLを秘匿する","choice2":"通信監視に利用する","choice3":"HTTPを暗号化する","choice4":"コンテンツフィルタリングを行う","choice5":"コンピュータウイルスを駆除する","correct_answer":3,"correct_answers":[3],"explanation":"Transport Layer Security（トランスポート・レイヤー・セキュリティ、TLS）は、インターネットなどのコンピュータネットワークにおいてセキュリティを要求される通信を行うためのプロトコルである。主な機能として、通信相手の認証、通信内容の暗号化、改竄の検出を提供する。 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":41,"question_text":"ウォーターフォールモデルの特徴はどれか","choice1":"工程が明確に区分される","choice2":"短期間で開発・評価を繰り返す","choice3":"基礎部分／共通部分を先行開発する","choice4":"どの工程でも顧客の要望に対応できる","choice5":"プロトタイプによるユーザーとの使用誤認を防止する","correct_answer":1,"correct_answers":[1],"explanation":"1)それぞれを順番に終わらせ次の工程に進んでいく 2)RAD（Rapid Application Development） 3)段階的モデルの特徴 4)スパイラルモデルの特徴 5)プロトタイピングモデルの特徴"},{"year":"2018","category":"情報処理技術系","question_number":42,"question_text":"各工程間の依存関係と各工程の遅れの影響を把握しやすくした図はどれか","choice1":"E-R図","choice2":"状態遷移図","choice3":"データフロー図","choice4":"ネットワーク図","choice5":"ユースケース図","correct_answer":4,"correct_answers":[4],"explanation":"1)対象世界を構成する実体(人，物，場所，事象など)と実体間の関連 2)ソフトウェアやシステムの状態がさまざまな条件やイベントによって変化することを指しますが、それらの変化を図形や矢印で表現したもの 3)ソフトウェア制作を依頼する側と作る側の認識を合わせるツール 4) 5)システムで何ができるかを「ユーザー目線で」表現する図"},{"year":"2018","category":"情報処理技術系","question_number":43,"question_text":"ホワイトボックステストに分類されるのはどれか","choice1":"因果グラフ","choice2":"限界値分析","choice3":"制御パステスト","choice4":"直行配列テスト","choice5":"ユースケーステスト","correct_answer":3,"correct_answers":[3],"explanation":"可能性のあるケースを網羅的に用意するテスト技法である 1)ブラックボックス 2)ブラックボックス 3)すべての経路を通過させるようにテストケースを作成するテスト 4)ブラックボックス 5)ブラックボックス"},{"year":"2018","category":"情報処理技術系","question_number":44,"question_text":"組織内で端末台数やユーザー数の上限を定めずにソフトウェアを利用できる契約形態はどれか","choice1":"コアライセンス","choice2":"サイトライセンス","choice3":"サーバーライセンス","choice4":"プロセッサライセンス","choice5":"ボリュームライセンス","correct_answer":2,"correct_answers":[2],"explanation":"1)サーバー上で稼働するCPUのコア総数を制限 2) 3)ライセンスサーバーで利用者数や端末台数を管理 4)サーバー機のプロセッサ数を制限する契約形態 5)"},{"year":"2018","category":"情報処理技術系","question_number":45,"question_text":"性能指標とその説明の組み合わせで正しいのはどれか","choice1":"輻輳回数　-　単位時間当たりの故障回数","choice2":"スループット　-　単位時間当たりのトランザクション数","choice3":"レスポンスタイム　-　処理が終了されるまでの時間","choice4":"ネットワーク回線使用率　-　ネットワーク回線の通信帯域","choice5":"ターンアラウンドタイム　-　処理が開始されるまでの時間","correct_answer":2,"correct_answers":[2],"explanation":"1)輻輳回数は同時アクセスの集中などにより通信ができなくなる状況の発生回数である。 2)スループットは単位時間あたりのトランザクション数を表す性能指標である。 3)レスポンスタイムはコマンドを入力して処理要求をしてから処理が行われ、結果が返し始められるまでの時間である。 4)ネットワーク回線使用率は回線容量に対する実際に伝送に使用可能な容量の割合である。 5)ターンアラウンドタイムはコマンドを入力して処理要求をしてから処理結果が出力されるまでの時間である。"},{"year":"2018","category":"情報処理技術系","question_number":46,"question_text":"ネットワークや通信の品質保証の契約はどれか。","choice1":"SLA","choice2":"EULA","choice3":"ISMS","choice4":"ITIL","choice5":"PMBOK","correct_answer":1,"correct_answers":[1],"explanation":"「SLA」とは「Service Level Agreement」の略で、「サービス品質保証」を意味します。 1) 2)ソフトウェアの開発元と購入者の間で交わされる契約。 3)情報セキュリティマネジメントシステム(ISMS)は、組織における情報資産のセキュリティを管理するための枠組み 4)ITサービスマネジメントにおけるベストプラクティス（成功事例）をまとめた書籍群です 5)PMBOK（Project Management Body of Knowledge）とは、プロジェクト管理に関するノウハウや手法を体系的にまとめたもの"},{"year":"2018","category":"情報処理技術系","question_number":47,"question_text":"本番系と同じ構成のシステムを稼働状態のまま待機させておく耐障害設計はどれか","choice1":"ミラーリング","choice2":"クラスタリング","choice3":"フェールセーフ","choice4":"ホットスタンバイ","choice5":"コールドスタンバイ","correct_answer":4,"correct_answers":[4],"explanation":"障害発生時に本番システムと同期する予備（待機）システムへ瞬時に切り替える方式。 1)同じデータを2台のディスクに書き込むことで、信頼性や耐障害性を向上させる手法。 2)負荷分散クラスタリングは、ウェブサーバーの負荷分散などに効果を発揮します。 3)フェイルセーフ (フェールセーフ, Fail Safe) とは、装置・システムにおいて、誤操作・ご動作による障害が発生した場合、常に安全側に制御することをいいます 4) 5)コールドスタンバイでは、サーバが起動されていない。"},{"year":"2018","category":"情報処理技術系","question_number":48,"question_text":"CSIRTが担う役割はどれか","choice1":"情報システムの運用管理","choice2":"情報システムの調達管理","choice3":"情報セキュリティへの対応","choice4":"災害時の運用継続計画の立案","choice5":"情報システムの費用対効果の検証","correct_answer":3,"correct_answers":[3],"explanation":"CSIRT（Computer Security Incident Response Team）は、組織内の情報セキュリティに関するインシデント対応を専門に行うチームを指す 1) 2) 3) 4) 5)"},{"year":"2018","category":"情報処理技術系","question_number":49,"question_text":"事業者がCPUやメモリ、ディスクなどのハードウェアリソースを提供するクラウドサービスはどれか。","choice1":"BaaS","choice2":"DaaS","choice3":"IaaS","choice4":"PaaS","choice5":"SaaS","correct_answer":3,"correct_answers":[3],"explanation":"IaaSは、インターネットを利用したコンピュータの利用形態である。IaaSでは、コンピュータシステムを構築および稼動させるための基盤そのものを、インターネット経由のサービスとして提供する。 1)Backend as a service 　Webアプリケーションのサーバー側で動く機能を提供 2)DaaSとは「Desktop as a Service」の略称で「ダース」と読みます。クラウド上に作成する仮想デスクトップの一種 3) 4)PaaSとは、インターネットを利用したコンピュータの新しい利用形態の1つである。 PaaSでは、ソフトウェアを構築および稼動させるための土台となるプラットフォームを、インターネット経由のサービスとして提供する。 5)SaaSは、必要な機能を必要な分だけサービスとして利用できるようにしたソフトウェアもしくはその提供形態のこと。"},{"year":"2018","category":"情報処理技術系","question_number":50,"question_text":"スマートデバイスの一括管理の仕組みはどれか","choice1":"IoT","choice2":"MDM","choice3":"SDN","choice4":"SIM","choice5":"BYOD","correct_answer":2,"correct_answers":[2],"explanation":"Mobile Device Managementとは、企業などで利用されるモバイル端末を一元的に監視・管理するためのサービスやソフトウェアのことをいいます。 1)様々な「モノ」がインターネットに接続され、情報交換することにより相互に制御する仕組みである。 2) 3)SDN（Software Defined Networking）とは、ソフトウェアを用いてネットワークを制御する技術の総称です。 4)SIMとは、Subscriber Identity Module の頭文字を略したもので、小型のカード型の形から「SIMカード」と呼ばれています。 5)BYOD（Bring Your Own Device）とは、個人が私物として所有しているパソコンやスマートフォンを業務に使う利用形態を指します。"},{"year":"2018","category":"医学・医療系","question_number":1,"question_text":"地域包括ケアシステムにおいて一体的に提供されないのはどれか。","choice1":"医療","choice2":"介護","choice3":"予防","choice4":"住まい","choice5":"子育て支援","correct_answer":5,"correct_answers":[5],"explanation":"医療・介護・予防・住まい・生活支援 団塊の世代が７５歳以上となる２０２５年をめどに、重度な要介護状態となっても 住み慣れた地域で自分らしい生活を最後まで続けられるよう、地域包括ケアシステムの 構築を実現するとされている。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":2,"question_text":"セカンドオピニオン外来について正しいのはどれか。","choice1":"患者が医師以外の医療職に専門的意見を求めること","choice2":"患者が主治医に無断で別の専門医の意見を聴くこと","choice3":"主治医が自分の判断の正しさを他の医師に確かめること","choice4":"患者が別の医師に相談することで自己決定の助けとすること","choice5":"かかりつけ医が専門的知識を有する医師に診療を依頼すること","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)セカンドオピニオンとは、患者が当事者（主治医、かかりつけ医）以外の 専門的な知識をもった第三者に求める「意見」であり、正しい。 5)"},{"year":"2018","category":"医学・医療系","question_number":3,"question_text":"インフォームドコンセントにおける医療者の責務として適切でないのはどれか。","choice1":"事実に基づいて説明する。","choice2":"患者・家族に誓約書を書面で求める。","choice3":"患者・家族に病状がわかるように説明する。","choice4":"患者・家族が病状説明を理解できたかどうかを確認する。","choice5":"決定した方針は、患者の意向によって変えることができることを説明する。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)病院や診療所が、入院や手術の際に誓約書を求めることはあるが、インフォームドコンセントとは無関係である。 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":4,"question_text":"社会保障制度に含まれないのはどれか。","choice1":"公衆衛生","choice2":"公的扶助","choice3":"社会福祉","choice4":"社会保険","choice5":"生命保険","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":5,"question_text":"国家資格はどれか。2つマークしなさい。","choice1":"管理栄養士","choice2":"臨床工学技士","choice3":"診療情報管理士","choice4":"医師事務作業補助者","choice5":"","correct_answer":1,"correct_answers":[1,3],"explanation":"正答は1、3。　1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":6,"question_text":"わが国の医療保険制度において地域保険における保険者として適切なのはどれか。","choice1":"共済組合","choice2":"健康保険組合","choice3":"国民健康保険組合","choice4":"全国健康保険協会","choice5":"後期高齢者医療広域連合","correct_answer":3,"correct_answers":[3],"explanation":"地域保険 職域保険に属さない人が対象で、国民健康保険（国保）と前期高齢者医療制度があります。 地域保険の保険者は各市区町村です。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":7,"question_text":"保険診療の対象となることがあるのはどれか。","choice1":"がん検診","choice2":"禁煙外来","choice3":"妊婦健診","choice4":"美容整形","choice5":"人間ドック","correct_answer":2,"correct_answers":[2],"explanation":"禁煙外来は実施医療機関や対象者を限定し、 条件を満たした場合には保険診療の対象になる 自己診療、混合診療、労災保険対象の傷病、自然分娩、美容外科などは 保険診療とは認められない。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":8,"question_text":"刑法による守秘義務が定められている職種はどれか。","choice1":"看護師","choice2":"助産師","choice3":"保健師","choice4":"管理栄養士","choice5":"臨床心理士","correct_answer":2,"correct_answers":[2],"explanation":"刑法における守秘義務は、 第百三十四条「医師、薬剤師、医薬品販売業者、助産師、弁護士、公証人又はこれらの職にあった者が、 正当な理由がないのに、その業務上取り扱ったことについて知り得た人の秘密をもらしたときは、 六月以下の懲役又は十万円以下の罰金を処する。」とされている。 よって上記にある助産師が正解。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":9,"question_text":"介護保険について誤っているのはどれか。","choice1":"各自治体の窓口に申請を行う。","choice2":"主治医の意見書と担当者による訪問調査が行われる。","choice3":"ケアプランの作成は医療ソーシャルワーカーが担当する。","choice4":"要介護認定には、要介護、要支援、非該当の区分がある。","choice5":"コンピュータによる1次判定、介護認定審査会による2次判定の2段階の審査が行われる。","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)医療ソーシャルワーカーではなくケアマネージャーが担当する 医療ソーシャルワーカーの主な仕事は、保険医療機関において患者さんやご家族が抱える悩みや問題を見つけ出し、問題の解決を図るために医療機関や県警期間との調整や連係を行うことです。具体的には次のような仕事を行います。 ○療養中の患者や家族の心理的・社会的問題の解決やその調整への援助 ○患者の退院援助と退院後の生活支援 ○患者の退院後の社会復帰援助 ○患者およびその家族の受診、受療に関する援助 ○患者と家族が抱える医療費や生活費などの経済的問題の解決、調整援助 ○地域ケア会議などへの参加による地域活動 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":10,"question_text":"人口動態統計の調査項目でないのはどれか。","choice1":"婚姻","choice2":"死産","choice3":"出生","choice4":"転居","choice5":"離婚","correct_answer":4,"correct_answers":[4],"explanation":"人口動態統計は人口動態事象を把握し、人口及び厚生労働行政施策の基礎資料をえることを 目的に行われている。 「戸籍法」及び「死産の届出に関する規定」により届けられた出生、死亡、婚姻、離婚及び死産の 全数を調査対象としている。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":11,"question_text":"特定健康診査の判定項目でないのはどれか。","choice1":"腹囲","choice2":"体脂肪率","choice3":"収縮期血圧","choice4":"HbA1c","choice5":"HDLコレステロール","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2018","category":"医学・医療系","question_number":12,"question_text":"救急救命士に認められていない行為はどれか。","choice1":"輸液","choice2":"採血","choice3":"気道確保","choice4":"血糖値測定","choice5":"薬剤の投与","correct_answer":2,"correct_answers":[2],"explanation":"救急救命士は救急救命士法施行規則（平成２６年改正）において 心肺停止患者に対しては、厚生労働大臣の認める輸血、気道確保、薬剤の投与が行える。 心肺停止状態ではない患者に対しては、輸液、血糖値測定、薬剤の投与が行える。 よって上記に該当しない「採血」が正解。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":13,"question_text":"医療の質の評価においてプロセス指標となるのはどれか。","choice1":"SCUの有無","choice2":"手術後死亡率","choice3":"病院標準化死亡比","choice4":"ICU専属医師の有無","choice5":"抗菌薬使用ガイドラインの遵守率","correct_answer":5,"correct_answers":[5],"explanation":"1)ストラクチャー 2)アウトカム 3)アウトカム 4)ストラクチャー 5)実際の医療の適切さなど、医療の過程を測る指標であるプロセス指標に該当する"},{"year":"2018","category":"医学・医療系","question_number":14,"question_text":"管理会計で用いられるのはどれか。2つマークしなさい。","choice1":"損益計算書","choice2":"貸借対照表","choice3":"ABC原価計算","choice4":"損益分岐点分析","choice5":"キャッシュフロー計算書","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　病院の財務分析方法には、外部に対する説明のための病院会計準則などによる財務会計と 病院運営改善を目的とした管理会計の2つがある。 管理会計は任意で取り入れるもので、経営者が経営管理をする目的で行うため、企業によって詳細は異なります。 一方の財務会計は基本的にすべての企業で取り入れます。 財務会計は企業の財務状況を外部に伝える目的があるため、会計基準に準拠した財務諸表を作成しなければなりません。 1)財務会計 2)財務会計 3) 4) 5)財務会計"},{"year":"2018","category":"医学・医療系","question_number":15,"question_text":"m-SHELモデルで誤っているのはどれか。2つマークしなさい。","choice1":"m – 経営方針","choice2":"S – 手順書","choice3":"H – 作業環境","choice4":"E – 施設の構造","choice5":"L – 人","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　1)management 2)Software（手順書やルール） 3)Hardware（施設の構造） 4)Environment（作業環境） 5)Liveware（人的要素）"},{"year":"2018","category":"医学・医療系","question_number":16,"question_text":"医療事故調査制度について正しいのはどれか。","choice1":"家族への説明は必ずしも行わなくてよい。","choice2":"個人の責任を追及するための制度である。","choice3":"医療機関で院内調査を行った報告書を提出する。","choice4":"院内調査報告書は厚生労働省が収集・分析する。","choice5":"事故の報告は医療機関の管理者の任意により行う。","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 4)医療事故調査・支援センターで医療事故調査の相談・支援、院内調査結果の整理・分析のほか、医療事故の再発防止のための普及・啓発活動を行う。 5)"},{"year":"2018","category":"医学・医療系","question_number":17,"question_text":"医療法および同施行規則において医療安全管理体制として義務付けられていないのはどれか。","choice1":"安全管理指針の整備","choice2":"感染制御体制の整備","choice3":"臨床倫理委員会の設置","choice4":"医療事故等の院内報告体制","choice5":"医療安全に関する職員研修","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":18,"question_text":"クリニカルパスにおいて診療過程で発生した「計画との差異」を指すのはどれか。","choice1":"アウトカム","choice2":"バリアンス","choice3":"アセスメント","choice4":"アウトカムマネジメント","choice5":"クリニカル・インディケーター","correct_answer":2,"correct_answers":[2],"explanation":"1)目標 2)目標の達成度から計画との差異 3)分析する 4)クリニカルパス内容を検討すること 5)臨床指標 アウトカムは目標を意味し アウトカムのうち治療に重大な影響を与えると思われるアウトカムを クリニカル・インディケーターという。 日々、アウトカムの達成・未達成を評価し、アウトカムの 達成度からバリアンス（計画との差異）をアセスメント（分析）する。 アウトカム達成状況やバリアンスをアセスメントすることでクリニカルパス内容を検討することを アウトカムマネージメントという。"},{"year":"2018","category":"医学・医療系","question_number":19,"question_text":"エビデンスレベルの高い順に並べたものはどれか。","choice1":"d ＞ a ＞ b ＞ c","choice2":"d ＞ b ＞ c ＞ a","choice3":"d ＞ b ＞ a ＞ c","choice4":"b ＞ a ＞ d ＞ c","choice5":"b ＞ d ＞ a ＞ c","correct_answer":3,"correct_answers":[3],"explanation":"エビデンスレベルの一例として「Minds診療ガイドライン作成の手引」で採用されているエビデンスレベル （Iがエビデンスレベルが最も高い） Ⅰ  システマティック・レビュー/ランダム化比較試験（RCT）のメタアナリシス Ⅱ  1つ以上のランダム化比較試験による Ⅲ  非ランダム化比較試験による Ⅳa 分析疫学的研究（コホート研究） Ⅳb 分析疫学的研究（症例対照研究、横断研究） Ⅴ  記述研究（症例報告やケース・シリーズ） Ⅵ  患者データに基づかない、専門委員会や専門家個人の意見 コホート研究は、分析疫学における手法の1つであり、特定の要因に曝露した集団と曝露していない集団を一定期間追跡し、研究対象となる疾病の発生率を比較することで、要因と疾病発生の関連を調べる観察研究の一種である システマティック・レビューまたは系統的レビューとは、文献をくまなく調査し、ランダム化比較試験のような質の高い研究のデータを、出版バイアスのようなデータの偏りを限りなく除き、分析を行うことである。"},{"year":"2018","category":"医学・医療系","question_number":20,"question_text":"患者に対する看護師の支援について誤っているのはどれか。","choice1":"痛みなどの苦痛を取り除く薬を処方する。","choice2":"日常生活が行えるよう体力の回復を助ける。","choice3":"医師や薬剤師、管理栄養士など多職種との調整を行う。","choice4":"患者・家族が治療に関する意思決定ができるよう支援する。","choice5":"地域社会に円滑に戻れるように地域医療機関と連絡調整を行う。","correct_answer":1,"correct_answers":[1],"explanation":"1)薬の処方は医師の独占業務であるため、誤り 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":21,"question_text":"厚生労働省基準の看護実践用語標準マスターについて誤っているのはどれか。","choice1":"無償で提供されている。","choice2":"日本看護協会が作成している。","choice3":"看護行為編は階層に分けられている。","choice4":"看護観察編と看護行為編の2つからなる。","choice5":"看護観察編は観察結果を記載するために作成されている。","correct_answer":2,"correct_answers":[2],"explanation":"看護実践用語標準マスターとは、看護実践現場で実際に使用されている用語を収集、整理した 看護業務における電子的記録に用いる用語集である。 無償で提供されており、看護計画の具体的なケア（看護行為）の基本的な用語と 助産・母性、在宅領域の用語が階層化して収載されている「看護行為編」と 観察項目とその結果である結果表記のための用語が収載されている「看護観察編」で 構成されている。 1) 2)厚生労働省の委託事業として医療情報システム開発センター（ＭＥＤＩＳ－ＤＣ）で 作成されている。よって誤り。 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":22,"question_text":"椎骨に含まれないのはどれか。","choice1":"胸椎","choice2":"頸椎","choice3":"鎖骨","choice4":"仙骨","choice5":"尾骨","correct_answer":3,"correct_answers":[3],"explanation":"椎骨（ついこつ）または脊椎骨（せきついこつ、英：vertebra）は、脊椎の分節をなす個々の骨のこと。 1) 2) 3)ヒトの鎖骨は、胸骨と肩甲骨を連結しているので脊椎の分節ではない 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":23,"question_text":"病因のうち物理的外因に当たらないのはどれか。","choice1":"温度","choice2":"気圧","choice3":"光線","choice4":"毒物","choice5":"放射線","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)化学的外因 5)"},{"year":"2018","category":"医学・医療系","question_number":24,"question_text":"左房と左室の間にある弁はどれか。","choice1":"三尖弁","choice2":"僧帽弁","choice3":"二尖弁","choice4":"大動脈弁","choice5":"肺動脈弁","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　一般的に二尖弁は、本来三枚の弁尖はずの大動脈弁が二尖で成り立っている稀な生まれつきの状態をいうが、僧帽弁も2枚の弁膜からなるので二尖弁ということもあり、3)も正解となった。"},{"year":"2018","category":"医学・医療系","question_number":25,"question_text":"インスリンを分泌する臓器はどれか。","choice1":"胃","choice2":"肝臓","choice3":"小腸","choice4":"膵臓","choice5":"大腸","correct_answer":4,"correct_answers":[4],"explanation":"膵臓とはお腹の真ん中のやや背中側で、胃の後ろ側に位置します。血糖値を調節するインスリンやグルカゴンなどのホルモンを分泌する内分泌機能と、十二指腸へ消化酵素を分泌し、食べ物を消化させる外分泌機能の働きを担っています。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":26,"question_text":"止血における主要な血球成分はどれか。","choice1":"血小板","choice2":"好中球","choice3":"赤血球","choice4":"白血球","choice5":"リンパ球","correct_answer":1,"correct_answers":[1],"explanation":"血小板は、白血球、赤血球とともに血液中の有形成分の一つで，止血，血液凝固にきわめて重要な役割を果す小細胞片です 1) 2)白血球の中の顆粒球の一種であり、白血球全体の約45～75％を占め、強い 貪食 どんしょく 能力を持ち、細菌や真菌感染から体を守る主要な防御機構となっています。 3)血液細胞の1種であり、酸素を運ぶ役割を持つ。 4)生体防御に際した免疫を担当する細胞である単球(マクロファージ)、リンパ球、好中球、好塩基球、好酸球の5種類を含んだ総称的物質を指す。 5)白血球の成分の1つで、さらに細かい分類として、B細胞（Bリンパ球）、T細胞（Tリンパ球）、NK細胞などがあります。 これらの細胞はチームをつくってウイルスなどの病原体やがん細胞などの異物を攻撃します。"},{"year":"2018","category":"医学・医療系","question_number":27,"question_text":"薬品のうち施錠保管が義務づけられていないのはどれか。","choice1":"劇薬","choice2":"毒薬","choice3":"麻薬","choice4":"覚せい剤","choice5":"向精神薬","correct_answer":1,"correct_answers":[1],"explanation":"1)げきやく【劇薬】 薬事法にもとづき厚生大臣が指定する一群の医薬品。 毒性が強く中毒量と常用量がきわめて接近しているもの，副作用の発現率が高いもの，常用量で激しい薬理作用を示すものなど，使用法を誤ると危険なものが指定される。 同様の主旨で指定されるものに毒薬があるが，通常劇薬の毒性は毒薬の約1/10。 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":28,"question_text":"患者に投与した場合、患者氏名・住所・薬品名・製造番号・使用日を記録し20年間保存する必要があるのはどれか。","choice1":"毒薬","choice2":"麻薬","choice3":"筋弛緩薬","choice4":"向精神薬","choice5":"特定生物由来製品","correct_answer":5,"correct_answers":[5],"explanation":"Q8　「その他、特定生物由来製品に係る保健衛生上の危害の発生又は拡大を防止するために必要な事項」とは具体的には何ですか？ A8　使用日から最低20年間の保存が義務づけられています。 1) 2) 3) 4) 5) 参考文献サイト】https://www.pref.fukuoka.lg.jp/contents/tokuteiseibutu-qa.html"},{"year":"2018","category":"医学・医療系","question_number":29,"question_text":"保険診療における処方箋について誤っているのはどれか。","choice1":"使用期間は交付日を含めて5日以内である。","choice2":"使用できる医薬品は薬価基準に収載されているものに限定されている。","choice3":"保険医療機関および保険医療養担当規則によって様式が定められている。","choice4":"麻薬処方箋は法で定める事項を記載し、記名押印または署名しなければならない。","choice5":"院外処方箋記載事項は患者氏名、年齢、薬名、分量、用法、用量、医師氏名である。","correct_answer":1,"correct_answers":[1],"explanation":"1)交付日を含めて4日以内 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":30,"question_text":"歯科の診療録に関わる記述として適切なのはどれか。2つマークしなさい。","choice1":"保存期間は4年である。","choice2":"算定点数は2号用紙に記載する。","choice3":"歯の部位を示すために歯式を用いる。","choice4":"自由診療に関わるものは2号用紙に記載する。","choice5":"歯周検査の記録は2号用紙に直接記載してはならない。","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　算定点数は２号様式に記載する。歯式は歯の部位を示すために用いる。 よって、2,3が正しい。 1)保存期間は5年。医科と同じ。 2) 3) 4)自由診療については、保険の診療録とは別の用紙に記載する。 5)歯周検査の記録は2号用紙に記載してよい。"},{"year":"2018","category":"医学・医療系","question_number":31,"question_text":"看護過程に含まれないのはどれか。","choice1":"評価","choice2":"看護計画","choice3":"共同問題","choice4":"看護必要度","choice5":"アセスメント","correct_answer":4,"correct_answers":[4],"explanation":"看護過程は看護の知識体系と経験に基づいて対象の看護上の問題を明確にし、計画的に看護を実施・評価する系統的・そして組織的な活動である。 1) 2) 3) 4)看護必要度は対象に必要な看護量の程度を評価するものであり、看護過程には含まれない 5)"},{"year":"2018","category":"医学・医療系","question_number":32,"question_text":"通常、実施中に治療も行われる検査はどれか。","choice1":"IVR","choice2":"MRI","choice3":"PET-CT","choice4":"骨シンチグラフィ","choice5":"カプセル内視鏡検査","correct_answer":1,"correct_answers":[1],"explanation":"1)IVR（Interventional Radiology)とは、血管内カテーテルなどをX線透視下で画像を 見ながら操作して、血管の形成や薬物の局所注入などの治療を行うもの 2) 3) 4) 5)カプセル内視鏡は、カメラを内蔵した小型のカプセルを飲み込んで食道～直腸までの消化管全体の撮影を行うものである。処置具を使うことができないため止血や切除などの治療は行えない"},{"year":"2018","category":"医学・医療系","question_number":33,"question_text":"酵素検査に該当しないのはどれか。","choice1":"CK","choice2":"Na","choice3":"ALT","choice4":"AST","choice5":"LDH","correct_answer":2,"correct_answers":[2],"explanation":"酵素は、種々の生体内の化学反応に関係するたんぱく質で、酵素ごとに特定の臓器・組織で合成・分泌されている。 酵素検査とは、血液中の酵素の濃度や活性を測定して、当該酵素が主に含まれる臓器の障害や機能、代謝状態の変化等を調べる。 2)ナトリウムは電解質（塩分）であり、酵素ではない。"},{"year":"2018","category":"医学・医療系","question_number":34,"question_text":"肺機能検査はどれか。","choice1":"脳波","choice2":"筋電図","choice3":"心電図","choice4":"PSG検査","choice5":"スパイロメトリー","correct_answer":5,"correct_answers":[5],"explanation":"1)脳の神経活動を調べる検査 2)筋活量を調べる検査 3)心臓が拍動する時に生じる起電力の時間変化を波形として記録する検査 4)睡眠時に脳波、呼吸、眼球運動、心電図、動脈血酸素飽和濃度などの生体信号を同時記録し、 睡眠時無呼吸症候群などの睡眠障害を評価する検査 5)肺活量、1秒率等の基本的な換気機能を調べる検査で用いられるため正しい"},{"year":"2018","category":"医学・医療系","question_number":35,"question_text":"診断のためにCT検査が行われるのはどれか。","choice1":"妊娠","choice2":"糖尿病","choice3":"脳出血","choice4":"高血圧症","choice5":"高脂血症","correct_answer":3,"correct_answers":[3],"explanation":"CT検査 急性期の出血は高吸収域（白く見える）として描出されます。 出血した部位や、血腫（脳の内部に形成された血液の塊）の量、血腫による周囲脳組織への圧迫の程度、水頭症（漏れ出した血液の影響で水の循環が滞り、水をためている空間である脳室が拡大する）の有無なども確認し、治療方針の決定に役立てます。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":36,"question_text":"X線を使用しない検査はどれか。","choice1":"胃透視","choice2":"頭部CT","choice3":"頭部MRI","choice4":"胸部単純撮影","choice5":"逆行性腎盂造影","correct_answer":3,"correct_answers":[3],"explanation":"MRIはCT検査と同様に体内の断画像が得られる検査であるが、CT検査がX線を用いてX線の透過性を画像化するのに対し、 X線を用いずに、強い磁場と電波により体内の主に水素原子の分布状況を画像化する検査である 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":37,"question_text":"体内から放出される放射線を検出し画像化する検査はどれか。2つマークしなさい。","choice1":"CT検査","choice2":"PET検査","choice3":"核医学検査","choice4":"超音波検査","choice5":"血管造影検査","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　1)体外からX線の照射を行う検査 2)PET検査は核医学検査の一種。 3)核医学検査は、がんや特定の臓器に集まりやすい放射性元素を含んだ化合物を投与し 一定時間後にその物質から放出される放射線を放射線検査機で画像化する機能的画像検査である。 がん細胞に取り込まれやすい検査薬を用いて、全身におけるがんの発見、 心筋に取り込まれやすい検査薬を用いて心筋の血流の評価などを行う。 4) 5)体外からX線の照射を行う検査"},{"year":"2018","category":"医学・医療系","question_number":38,"question_text":"超音波検査について誤っているのはどれか。","choice1":"空気の存在に影響されない。","choice2":"生体に関する侵襲が少ない。","choice3":"動画像をその場で観察できる。","choice4":"血流の方向・速さを画像化できる。","choice5":"肥満の強い症例では観察能力が低下する。","correct_answer":1,"correct_answers":[1],"explanation":"超音波検査は、皮膚に密着させたプローブから非常に高い周波数の音波を照射して その反射波の性状から内部構造を観察する 1)超音波検査の音波は、空気や脂肪組織中では著しく減衰する。 そのため空気が存在するとそれより奥は観察できない 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":39,"question_text":"治療について誤っているのはどれか。","choice1":"放射線治療は非観血的治療である。","choice2":"外科的治療は専ら観血的治療である。","choice3":"内科的治療の多くは薬物療法である。","choice4":"内視鏡的治療は開腹手術より侵襲的な治療である。","choice5":"医師の指示によりコ・メディカルが実施するものもある。","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)開腹手術は内視鏡的治療より侵襲的な治療 5)"},{"year":"2018","category":"医学・医療系","question_number":40,"question_text":"作業療法はどれか。","choice1":"歩行訓練","choice2":"筋力強化訓練","choice3":"言語聴覚訓練","choice4":"関節可動域訓練","choice5":"日常生活動作訓練","correct_answer":5,"correct_answers":[5],"explanation":"1)理学療法 2)理学療法 3)言語聴覚療法 4)理学療法 5)"},{"year":"2018","category":"医学・医療系","question_number":41,"question_text":"患者の自我をささえて情緒的な安定を図り適応能力を回復させようとするのはどれか。","choice1":"訓練療法","choice2":"芸術療法","choice3":"作業療法","choice4":"支持療法","choice5":"洞察療法","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":42,"question_text":"法律上作成すべき書類とその保存期間の組み合わせで誤っているのはどれか。","choice1":"助産録 – 2年間","choice2":"調剤録 – 3年間","choice3":"歯科技工指示書 – 2年間","choice4":"救急救命処置録 – 5年間","choice5":"","correct_answer":1,"correct_answers":[1],"explanation":"1)5年間 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":43,"question_text":"生活歴の項目として適切でないのはどれか。","choice1":"職業","choice2":"嗜好物","choice3":"飲酒の有無","choice4":"喫煙の有無","choice5":"生活習慣病の有無","correct_answer":5,"correct_answers":[5],"explanation":"生活習慣病の有無は「生活歴」ではなく「既往歴」の項目である。 1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":44,"question_text":"医薬品の治験について誤っているのはどれか。","choice1":"GCPのもとで実施される。","choice2":"計画段階で国への届出が必要である。","choice3":"医師自らが企画することも可能である。","choice4":"医薬品の製造販売承認を得るために行われる。","choice5":"結果は治験審査委員会で公正に評価しなければならない。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)治験審査員会では、治験計画の事前審査が行われる。 すなわち、提出された「治験実施計画書」などをもとに、治験を実施することの理論的・科学的 見地からの妥当性について審議を行う。また、治験機関が一年を超える場合には、年に一回以上 当該治験継続の適否について審査する。 結果の評価を行う組織ではないので誤り。"},{"year":"2018","category":"医学・医療系","question_number":45,"question_text":"システマティック・レビューの説明として誤っているのはどれか。","choice1":"診療ガイドラインにしばしば反映される。","choice2":"公開されている文献を対象にして行われる。","choice3":"得られた結果のエビデンスレベルはもっとも高い。","choice4":"良い結果が得られた研究データを抽出して分析を行う。","choice5":"出版バイアスを排除するためになるべく広く文献を調査する。","correct_answer":4,"correct_answers":[4],"explanation":"システマティック・レビューとはバイアスによるデータの偏りを避けるため 広く文献を調べて、質の高い研究データを抽出し、分析を行うことであり 導かれた結果はエビデンスレベルがもっとも高く、しばしば診療ガイドラインに 反映される。 1) 2) 3) 4)良い結果が得られた研究データのみを抽出する行為は、 データの偏りを生じさせるため、誤り。 5)"},{"year":"2018","category":"医学・医療系","question_number":46,"question_text":"対象集団において、ある時点の疾病の有無と要因との関係を調べるものはどれか。","choice1":"介入研究","choice2":"横断的研究","choice3":"症例対照研究","choice4":"後向きコホート研究","choice5":"前向きコホート研究","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":47,"question_text":"次の組み合わせで誤っているのはどれか。","choice1":"感度 – 疾患罹患者中の検査陽性者の割合","choice2":"オッズ – ある事象が起こる確率と起こらない確率の比","choice3":"特異度 – 疾患罹患者中の検査陰性者の割合","choice4":"バイアス – 偶然ではない系統的な誤差","choice5":"相対危険度 – 曝露群と非曝露群の発症率の比","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)疾患非罹患者中の検査陰性者の割合 4) 5)"},{"year":"2018","category":"医学・医療系","question_number":48,"question_text":"正規分布について誤っているのはどれか。","choice1":"一様分布の一種である。","choice2":"分布は左右対称である。","choice3":"平均値と中央値が一致する。","choice4":"分布は平均値と標準偏差で決まる。","choice5":"[ 平均値 ± 2 × 標準偏差 ] の区間に全体の約95%が入る。","correct_answer":1,"correct_answers":[1],"explanation":"一様分布とは、どの結果が起きる確率も等しいものをいう。（例：サイコロの出目）"},{"year":"2018","category":"医学・医療系","question_number":49,"question_text":"仮説検定について誤っているのはどれか。","choice1":"有意水準を設定する。","choice2":"帰無仮説と対立仮説をたてる。","ch 力する装置。ディスプレイ、スピーカー等。"},{"year":"2019","category":"情報処理技術系","question_number":6,"question_text":"登録された複数の処理を自動で一括処理するのはどれか。","choice1":"バッチ処理","choice2":"オフライン処理","choice3":"オンライン処理","choice4":"リアルタイム装置","choice5":"タイムシェアリング処理","correct_answer":1,"correct_answers":[1],"explanation":"1)バッチ処理・・・手順を決めて複数の処理をまとめて実施する方式。一括処理とも呼ばれる。 2)オフライン処理・・・他のコンピュータとは接続されていない状態で行う形態。 3)オンライン処理・・・処理を行うコンピュータにネットワーク接続した状態でデータや命令を送り処理を行う。 4)リアルタイム処理・・・処理要求のデータが来ると要求された時間内で直ちに処理する方式。 5) タイムシェアリング処理・・・CPUの割り当てを時分割して共有し、同時に処理を行う"},{"year":"2019","category":"情報処理技術系","question_number":7,"question_text":"SSD(Solid State Drive)について正しいのはどれか。","choice1":"光ディスクである。","choice2":"磁気ディスクである。","choice3":"読み出し専用である。","choice4":"フラッシュメモリである。","choice5":"ランダムアクセスができない。","correct_answer":4,"correct_answers":[4],"explanation":"SSD: ラッシュメモリに制御回路を追加して、ハードディスクと同様に取り扱えるようにしたもの。"},{"year":"2019","category":"情報処理技術系","question_number":8,"question_text":"同容量のハードディスク12台でRAID10を構成すると、実行容量は最大でディスク何台分か。","choice1":"3台","choice2":"4台","choice3":"6台","choice4":"10台","choice5":"11台","correct_answer":3,"correct_answers":[3],"explanation":"RAID0: 書き込みするデータを分割して同時に複数のハードディスクに書き込むことで速度を向上 読み込みも複数のディスクから同時に行われるため高速 耐障害性はない ハードディスク1本の故障ですべてのデータが失われます。 RAID1: 同じデータを2本のハードディスクに書き込みすることで耐障害性を高めた構成 ハードディスク1本に障害が発生してもシステムは停止せずにデータも失われない。 同じデータを二重で保管しているためハードディスク2本で1本分の容量しか使用できません。 RAID10: RAID0(ストライピング)+RAID1(ミラーリング)"},{"year":"2019","category":"情報処理技術系","question_number":9,"question_text":"ディスプレイの種類と解像度の組み合わせで正しいのはどれか。なお、数字は縦・横のピクセル数を表す。","choice1":"4K ― 7,680 × 4,320","choice2":"HD ― 1,920 × 1,200","choice3":"FHD ― 1,920 × 1,080","choice4":"VGA ― 800 × 600","choice5":"SXGA ― 1,024 × 768","correct_answer":3,"correct_answers":[3],"explanation":"XGA ― 1,024 × 768 SXGA ― 1,280 × 1,024 HD ― 1,280 × 720 FHD ― 1,920 × 1,080 4K ―  3840×2160"},{"year":"2019","category":"情報処理技術系","question_number":10,"question_text":"リーダーライターから発信される電波を用いて情報を読み書きするのはどれか。","choice1":"磁気カード","choice2":"QRコード","choice3":"バーコード","choice4":"接触式ICカード","choice5":"非接触式ICカード","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2019","category":"情報処理技術系","question_number":11,"question_text":"オペレーティングシステムでないのはどれか。","choice1":"DOS","choice2":"Java","choice3":"UNIX","choice4":"Android","choice5":"Windows","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2019","category":"情報処理技術系","question_number":12,"question_text":"ハードウェアの基本的な制御のために、機器に内蔵されたROMやフラッシュメモリにあらかじめ格納されたプログラムはどれか。","choice1":"シェアウェア","choice2":"ミドルウェア","choice3":"ファームウェア","choice4":"デバイスドライバ","choice5":"アプリケーションソフトウェア","correct_answer":3,"correct_answers":[3],"explanation":"1)シェアウェアとは、ソフトウェアの配布・利用許諾方式の一つで、取得と初期の使用は無償だが、利用期間や機能に一定の制約があり、これを解除して継続的に使用したい場合に料金の支払いを求めるもの。 2)ミドルウェアとは、ソフトウェアの種類の一つで、オペレーティングシステム（OS）とアプリケーションソフトの中間に位置し、様々なソフトウェアから共通して利用される機能を提供するもの。 OSが提供する機能よりも分野や用途が限定された、具体的・個別的な機能を提供する場合が多い 3)ファームウェアとは、コンピュータや電子機器などに内蔵されるソフトウェアの一種で、本体内部の回路や装置などの基本的な制御を司る機能を持ったもの。 4)デバイスドライバとは、コンピュータ内部に装着された装置や、外部に接続した機器などのハードウェアを制御・操作するためのソフトウェア。 単にドライバとも呼ばれる。 5)特定の用途や目的のために作られた、コンピューターのソフトウエア。 ワープロソフト、表計算ソフト、メールソフト、ブラウザーなどが含まれる。 オペレーティングシステム上で動作し、コンピューターの基本的な利用環境を共有する。 Written by idashin"},{"year":"2019","category":"情報処理技術系","question_number":13,"question_text":"コンピュータの処理手順を、記号を用いて図で表現したのはどれか。","choice1":"ガントチャート","choice2":"フローチャート","choice3":"クリティカルパス","choice4":"レーダーチャート","choice5":"アローダイアグラム","correct_answer":2,"correct_answers":[2],"explanation":"1)ガントチャート（英: Gantt chart）とは、プロジェクト管理や生産管理などで工程管理に用いられる表の一種で、作業計画を視覚的に表現するために用いられる。 棒グラフの一種でもあり、横棒によって作業の進捗状況を表す。 2)フローチャートとは、業務やシステムにおける工程やプロセスの各ステップやアルゴリズムなどの流れを、長方形・ひし形・楕円形などの記号で表示し、流れの方向を矢印でつなげて視覚的に表した図の事です。 3)クリティカルパスとは、プロジェクトの各工程を、プロジェクト開始から終了まで「前の工程が終わらないと次の工程が始まらない」という依存関係に従って結んでいったときに、所要時間が最長となるような経路のこと。 4)レーダーチャート（英: radar chart）は、複数の項目がある変量を構成比に直すことなく正多角形上に表現したグラフ。 5)アローダイアグラムとは、複数の独立した作業や工程が連続して実施される際に、作業の日程計画を図形と数字で表現するためのフローチャート図です。 海外では一般的に「PERT（Program Evaluation and Review Technique）図」と呼ばれます。 Written by idashin"},{"year":"2019","category":"情報処理技術系","question_number":14,"question_text":"スタックに「A→B→C」の順で入力されたデータの出力の順序はどれか。","choice1":"A→B→C","choice2":"A→C→B","choice3":"B→A→C","choice4":"C→A→B","choice5":"C→B→A","correct_answer":5,"correct_answers":[5],"explanation":"スタックは、コンピュータで用いられる基本的なデータ構造の1つで、データを後入れ先出し（LIFO: Last In First Out; FILO: First In Last Out）の構造で保持するもの 1) 2) 3) 4) 5) Written by idashin"},{"year":"2019","category":"情報処理技術系","question_number":15,"question_text":"デジタルハイビジョン対応の動画コーデックはどれか。","choice1":"MP3","choice2":"JPEG","choice3":"H.263","choice4":"H.264","choice5":"MPEG-1","correct_answer":4,"correct_answers":[4],"explanation":"1)MP3（エムピースリー、英: MPEG-1 Audio Layer-3）は、音響データを圧縮する技術の1つであり、それから作られる音声ファイルフォーマットでもある。 2)JPEGとは、静止画像のデータ圧縮形式の一つ。 フルカラーの画像を多少の劣化を伴いながら高い圧縮率で符号化できるのが特徴で、写真など自然画像の記録に向いている。 3)ITU-Tにおいて規格化された動画圧縮方式の一つである。 1996年3月に承認された。 MPEG-4と同様超低ビットレート向けに開発されたものであり、テレビ電話に利用されている。 4)H. 264とは、ITU-TとISO/IECが2003年5月に共同で策定した動画圧縮規格の一つです。 ITU-Tでは「H. 264」として勧告され、ISO/IECでは「MPEG-4 Part10：Advanced Video Coding」として規定されています。 5)MPEG1はビデオCDで採用されている規格で、再生品質は家庭用ビデオ程度。 MPEG2はDVD-Videoで採用されている規格で、MPEG1よりデータ量は大きくなるがより高画質となる。 MPEG形式で保存されたファイルをMPEGファイルという。 Written by idashin"},{"year":"2019","category":"情報処理技術系","question_number":16,"question_text":"アナログ情報を一定間隔で区切り、区切ったところの値を拾い上げる処理はどれか。","choice1":"近似化","choice2":"標本化","choice3":"符号化","choice4":"分子化","choice5":"量子化","correct_answer":2,"correct_answers":[2],"explanation":"人間の発する声のアナログ信号をデジタル形式に変換するために、次の3つの処理を行う必要があります。 ①信号のサンプリング（標本化） ②信号の量子化 ③信号の符号化 です。 ① 標本化（サンプリング） 連続したデータであるアナログデータを一定の時間単位で区切り、その時間ごとの信号レベルを標本として抽出する処理が標本化（サンプリング）です。 まずは時間軸を「段階のない連続したアナログデータ」から「段階のあるディジタルデータ」にします。 ②量子化 信号レベルを何段階で表現するかを定め、サンプリングしたデータをその階段数に当てはめて整数値に置き換える処理が量子化です。 次に，縦軸の信号レベルを「区切りのない連続したアナログデータ」から、「区切りのあるディジタルデータ」にしてあげるわけです。 ③符号化 ②の量子化で当てはめた整数値を符号化によって、0と1の2進数（ディジタルデータ）に変換します。 符号化の方法には主に２種類に分類できます。また、符号化によって音声をデジタルに変換することをコーデックといいます。 1) 2) 3) 4) 5) Written by idashin"},{"year":"2019","category":"情報処理技術系","question_number":17,"question_text":"関係データベースで、2つの集合の要素を1つずつ取り出し、すべての組み合わせを作る演算はどれか。","choice1":"積","ch
