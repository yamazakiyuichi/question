が制定した臨床検査項目分類コードのこと。 JLAC１０コードは１７桁で、分析物５桁、識別４桁、材料３桁、測定法３桁、結果識別２桁から成る。 分析物コード 生化学的検査、内分泌学的検査など９つある。 中分類は、一般検査では、尿一般検査、糞便検査、髄液検査など。 5)NANDA（なんだ）とは、北米看護診断協会（North American Nursing Diagnosis Association）のことである。 2002年以降はNANDA-International（NANDA-I）へ改名されている。 看護診断を研究し、診断レベル、定義、診断指標、関連因子などの項目について、看護診断ごとに詳細な取り決めを行い、看護における定義の統一化を目的としている。 NANDA-Iによって定められた看護診断のことを、NANDA-I看護診断という。"},{"year":"2019","category":"医療情報システム系","question_number":55,"question_text":"HOTコードについて誤っているのはどれか。","choice1":"医療用医薬品につけられた13桁のコードである。","choice2":"JANコードとは原則として1対1対応している。","choice3":"使用中止されたコードは再利用されることがある。","choice4":"レセプト電算処理システム用コードと対応づけられている。","choice5":"コード管理は一般財団法人医療情報システム開発センター（MEDIS-DC）が","correct_answer":3,"correct_answers":[3],"explanation":"HOTコードとは、処方用＋会社判別用＋調剤用＋物流用で構成される13桁の数字列である。それぞれの要素によって、医薬品目の販売会社、包装形態・包装単位、包装送料を表現している。 永久欠番制であり、使用番号の再使用は禁止されている。 1) 2) 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":56,"question_text":"JLAC10について誤っているのはどれか。","choice1":"同じ検査項目でも材料によりコードが異なる。","choice2":"同じ検査項目でも測定法によりコードが異なる。","choice3":"レセプトに記載される検査項目のコードである。","choice4":"一般社団法人日本臨床検査医学会が作成している。","choice5":"分析物コードなど５つの要素区分から構成される。","correct_answer":3,"correct_answers":[3],"explanation":"JLAC10は、日本臨床検査医学会が制定した臨床検査の標準コード 1) 2) 3)レセプトに使用する際は、臨床検査マスターによりJLAC10コードを請求用のコードと対応付ける必要がある 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":57,"question_text":"SS-MIX2について誤っているのはどれか。","choice1":"各種文書や画像情報は拡張ストレージに格納される。","choice2":"ファイルシステムのディレクトリ構造を利用している。","choice3":"処方、検体検査結果は、標準化ストレージに格納される。","choice4":"フリーソフトのデータベースエンジンが前提となっている。","choice5":"患者ID、日付、種別の階層構造は標準化ストレージと拡張ストレージで","correct_answer":4,"correct_answers":[4],"explanation":"平成18年度、厚生労働省は、さまざまなインフラから配信される情報を蓄積するとともに標準的な診療情報提供書が編集できる「標準化ストレージ」という概念に着目し、すべての医療機関を対象とした医療情報の交換・共有による医療の質の向上を目的とした「厚生労働省電子的診療情報交換推進事業」（SS-MIX：Standardized Structured Medical Information eXchange）を開始しました。 1) 2) 3) 4)データベースは使用しない 5)"},{"year":"2019","category":"医療情報システム系","question_number":58,"question_text":"「患者紹介等に付随する医用画像についての合意事項」に含まれないのはどれか。","choice1":"1)１枚のCD-Rに書き込む患者は１名１IDとすること。","choice2":"2)医療施設間で受け渡しするDICOMファイルは、DICOM規格に違反しないこと。","choice3":"3)事前協議に基づき双方がその内容について承知している場合は、本合意事項の対象としない。","choice4":"4)自動的にCD-Rに同梱されているViewerアプリケーションを使って画像を表示させること。","choice5":"5)患者氏名、提供元医療施設名および問い合わせ先などをCD-R表面にレーベル印刷として","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2019","category":"医療情報システム系","question_number":59,"question_text":"次世代医療基盤法で定めている認定匿名加工医療情報作成事業者について誤っているのはどれか","choice1":"従事者に罰則付きの守秘義務を課す。","choice2":"医療情報等の漏えい等の防止のための安全管理措置を講ずる。","choice3":"医療情報の取り扱いを事業の目的達成に必要な範囲に制限する。","choice4":"医療情報等の取り扱いを委託されるには、主務大臣の認定を受ける必要がある。","choice5":"医療機関等から医療情報の提供を受けるには、あらかじめ患者の明示的な","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)オプトアウト型の同意でよいとされている"},{"year":"2019","category":"医療情報システム系","question_number":60,"question_text":"厚生労働省の通知「人工知能（AI）を用いた診断、治療等の支援を行うプログラムの利用と","choice1":"開発者","choice2":"認可者","choice3":"販売者","choice4":"使用した医師","choice5":"利用を同意した患者","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"情報処理技術系","question_number":1,"question_text":"データ量が最も小さいのはどれか。","choice1":"4GByte","choice2":"4TByte","choice3":"0.4EByte","choice4":"0.8PByte","choice5":"800MByte","correct_answer":5,"correct_answers":[5],"explanation":"全てをMByteに直すと 1) 4,000MByte 2) 4,000,000MByte 3) 400,000,000,000MByte 4) 800,000,000MByte 5) 800MByte となるため、5が最も小さいです。"},{"year":"2021","category":"情報処理技術系","question_number":2,"question_text":"16進数「F8」を10進数で表したのはどれか。","choice1":"120","choice2":"128","choice3":"150","choice4":"248","choice5":"254","correct_answer":4,"correct_answers":[4],"explanation":"Fは10進数でいうと15にあたるため、 15 * 16 + 8 * 1 = 248 となり、答えは4です。"},{"year":"2021","category":"情報処理技術系","question_number":3,"question_text":"2進数の「10010」と「1010」の和を16進数で表したのはどれか。","choice1":"1A","choice2":"B1","choice3":"1C","choice4":"1F","choice5":"AB","correct_answer":3,"correct_answers":[3],"explanation":"やり方はいくつかありますが、2進数→10進数→16進数の順に導くと、 ・2進数 10010 + 1010 = 11100 ※論理和ではなく、足し算の「和」です ・10進数 1*16 + 1*8 + 1*4 + 0*2 + 0*1 = 28 ・16進数 28 / 16 = 1 余り 12 12 = C のため、1C となり、答えは3です。 別解） 2進数から16進数への変換は4桁で区切ればよい 1 1100 1100(2)＝12(10)＝C(16) よって1100(2)＝1C(16)"},{"year":"2021","category":"情報処理技術系","question_number":4,"question_text":"ベン図の網掛け部分が得られる演算はどれか。(画像あり)","choice1":"A OR B","choice2":"A AND B","choice3":"NOT (A OR B)","choice4":"NOT (A AND B)","choice5":"(NOT A) AND B","correct_answer":3,"correct_answers":[3],"explanation":"1)ベン図のAとB部分（白抜き） 2)ベン図のAとBの間の部分 3) 4)2以外の部分 5)ベン図のBの部分（A以外）"},{"year":"2021","category":"情報処理技術系","question_number":5,"question_text":"画素数が1,600×1,200で、24ビットカラー、非圧縮形式の画像8枚を保存できる最小の容量はどれか。","choice1":"50MByte","choice2":"5MByte","choice3":"0.5MByte","choice4":"0.5GByte","choice5":"500KByte","correct_answer":1,"correct_answers":[1],"explanation":"24ビットをByteに変換すると、 24 / 8 = 3Byte よって必要な容量は、 1600 * 1200 * 3 * 8 = 46,080,000Byte = 46.08MByte < 50MByte となり、答えは1です。"},{"year":"2021","category":"情報処理技術系","question_number":6,"question_text":"VDIが指すのはどれか。","choice1":"仮想メモリ","choice2":"仮想現実感","choice3":"サーバ仮想化","choice4":"デスクトップ仮想化","choice5":"アプリケーション仮想化","correct_answer":4,"correct_answers":[4],"explanation":"仮想デスクトップインフラストラクチャー (VDI; virtual desktop infrastructure もしくは virtual desktop interface) とは、仮想環境のためのハードウェアとソフトウェアを含むデスクトップ仮想化のためのサーバーシステムを指す。 VDIとは、Virtual Desktop Infrastructureの略で、デスクトップ仮想化と呼ばれ、サーバ上にあるデスクトップ環境を遠隔地にある端末に転送して利用することです。 仮想化とは、ソフトウェアを用いてハードウェアを仮想環境で動作させることです。ハードウェアとは、サーバ・CPU・メモリ・HDD・SSDなどを指します。これがデスクトップになるとデスクトップ仮想化という概念になります。 端末で最小限の処理を行い、ほとんどの処理をサーバ側で行うシステム構成をシンクライアントといい、実現するのがVDIです。ちなみに、シンクライアントの実行方法はネットワークブート型と画像転送型があり、VDIは画像転送型の一種です。 利用者の作業は、自身の端末ではなくサーバ上で実行され、データもサーバに保存されます。そのため、利用者の端末には、データが保存されないため情報漏えいのリスクがありません。 =========== サーバ仮想化とは、1台のサーバ（物理サーバ）を複数台の仮想的なサーバ（仮想サーバ）に分割して利用する仕組みです。 物理サーバにハイパーバイザと呼ばれる仮想化ソフトウェアを用いて仮想サーバを動作させる環境を作ります。"},{"year":"2021","category":"情報処理技術系","question_number":7,"question_text":"LTOについて正しいのはどれか。","choice1":"磁気で記録する。","choice2":"赤外線で記録する。","choice3":"レーザー光で記録する。","choice4":"ICチップに記録される。","choice5":"フラッシュメモリである。","correct_answer":1,"correct_answers":[1],"explanation":"Linear Tape-Open（リニア テープ オープン、略称：LTO）は、コンピュータ用の磁気テープ技術。 よって答えは1です。"},{"year":"2021","category":"情報処理技術系","question_number":8,"question_text":"Full-HDディスプレイの解像度はどれか。","choice1":"1,280×1,024","choice2":"1,920×1,080","choice3":"1,920×1,200","choice4":"4,096×2,160","choice5":"7,680×4,320","correct_answer":2,"correct_answers":[2],"explanation":"1) SXGAディスプレイ 2) Full-HDディスプレイ 3) WUXGAディスプレイ 4) 4Kディスプレイ 5) 8Kディスプレイ"},{"year":"2021","category":"情報処理技術系","question_number":9,"question_text":"「ABCDERGHI」というデータを図に示すように6台のハードディスクに記録する方式はどれか。(図あり)","choice1":"RAID0","choice2":"RAID1","choice3":"RAID5","choice4":"RAID6","choice5":"RAID10","correct_answer":5,"correct_answers":[5],"explanation":"1)ストライピング 2)ミラーリング 3)パリティ1台 4)パリティ2台 5)RAID 10とは、複数のストレージ（外部記憶装置）をまとめて一台の装置として管理するRAID技術の方式の一つで、同じデータを同時に記録するドライブのセット（RAID 1）を複数用意して、それらの間で並列に分散記録（RAID 0）する方式。"},{"year":"2021","category":"情報処理技術系","question_number":10,"question_text":"CPUの基本動作を表す図の①～④に入る正しい組み合わせはどれか。(図あり)","choice1":"①解読-②実行-③読込-④出力","choice2":"①解読-②読込-③出力-④実行","choice3":"①読込-②解読-③実行-④出力","choice4":"①読込-②解読-③出力-④実行","choice5":"①実行-②読込-③解読-④出力","correct_answer":3,"correct_answers":[3],"explanation":"CPUの基本動作は、フェッチ（読込）、デコード（解読）、エグゼキュート（実行）、ストア（出力）の順で行われます。 よって答えは3です。"},{"year":"2021","category":"情報処理技術系","question_number":11,"question_text":"LANポートのコネクタはどれか。(図あり)","choice1":"","choice2":"","choice3":"","choice4":"","choice5":"","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5) それぞれ以下の用語の略称です。 1) Digital Rights Management （デジタル著作権管理） 2) Mobile Device Management （携帯端末管理） MDM（モバイルデバイス管理）とは、企業などで利用されるモバイル端末を一元的に監視・管理するためのサービスやソフトウェアのことをいいます。MDMで実現できる機能は多岐にわたりますが、ビジネス分野で有効的な機能として大きく次の３つに分けることができます。 モバイル端末の紛失・盗難時のリモート制御 デバイス機能の一元的な管理 各種ポリシー、アプリの一斉配布による管理効率化 3) Bring Your Own Device （自分のデバイスを持ち込む） 4) Multiple-Input and Multiple-Output （通信品質を向上させるスマートアンテナ技術） 5) Mobile Virtual Network Operator （仮想移動体通信事業者）"},{"year":"2021","category":"情報処理技術系","question_number":13,"question_text":"オペレーティングシステムはどれか。","choice1":"FHIR","choice2":"Java","choice3":"Ruby","choice4":"Apache","choice5":"Android","correct_answer":5,"correct_answers":[5],"explanation":"それぞれ以下の通りに分類されます。 1) API 2) プログラム言語 3) スクリプト言語 4) ソフトウェア 5) オペレーティングシステム"},{"year":"2021","category":"情報処理技術系","question_number":14,"question_text":"プログラムで扱う変数の型のうち、論理型に必要な情報量はどれか。","choice1":"1bit","choice2":"2bit","choice3":"4bit","choice4":"8bit","choice5":"16bit","correct_answer":1,"correct_answers":[1],"explanation":"論理型（boolean）は、論理演算の真偽（TRUE, FALSE）に対応します。 この2種類の値に対応できれば良く、これは0か1の値を持てれば表現できます。 よって情報量は1bitで済み、答えは1です。"},{"year":"2021","category":"情報処理技術系","question_number":15,"question_text":"図に示すデータ構造はどれか。(図あり)","choice1":"キュー","choice2":"ツリー","choice3":"リスト","choice4":"スタック","choice5":"ネットワーク","correct_answer":2,"correct_answers":[2],"explanation":"データ構造の種類 最も基本的なデータ構造には、要素を一列に並べた「配列」（array）、要素を格納した順に取り出すことができる「キュー」（queue）、格納したのとは逆順に取り出すことができる「スタック」（stack）などがある。 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":16,"question_text":"アナログ信号をデジタル信号へ変換する処理順序はどれか。","choice1":"標本化→量子化→符号化","choice2":"符号化→量子化→標本化","choice3":"量子化→標本化→符号化","choice4":"量子化→符号化→標本化","choice5":"符号化→標本化→量子化","correct_answer":1,"correct_answers":[1],"explanation":"A/D変換 ① 標本化（サンプリング） 連続したデータであるアナログデータを一定の時間単位で区切り、その時間ごとの信号レベルを標本として抽出する処理が標本化（サンプリング）です。 まずは時間軸を「段階のない連続したアナログデータ」から「段階のあるディジタルデータ」にします。 ②量子化 信号レベルを何段階で表現するかを定め、サンプリングしたデータをその階段数に当てはめて整数値に置き換える処理が量子化です。 次に，縦軸の信号レベルを「区切りのない連続したアナログデータ」から、「区切りのあるディジタルデータ」にしてあげるわけです。 ③符号化 ②の量子化で当てはめた整数値を符号化によって、0と1の2進数（ディジタルデータ）に変換します。 符号化の方法には主に２種類に分類できます。また、符号化によって音声をデジタルに変換することをコーデックといいます。 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":17,"question_text":"1から20の整数の和を求めるフローチャートの(①)に入るのはどれか。(図あり)","choice1":"i ← i+1","choice2":"i ← i+x","choice3":"i ← i-1","choice4":"x ← x+1","choice5":"x ← x/i","correct_answer":1,"correct_answers":[1],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":18,"question_text":"次のSQL文を実行したとき、得られるデータの行数はどれか。","choice1":"0","choice2":"1","choice3":"2","choice4":"3","choice5":"4","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5) 解答では本問を例にしたSQLの基本を解説する。 ※「SELECT *」の「*」は全ての項目を選択するという意味である (1)「検査結果」表より、検査1 が 8.0 超えのレコードを抽出するSQLは以下の通りである。 -> SELECT * FROM 検査結果 WHERE 検査1>8.0 (2)「検査結果」表より、検査2 が 70 超えのレコードを抽出するSQLは以下の通りである。 -> SELECT * FROM 検査結果 WHERE 検査2>70 (3)「検査結果」表より、検査1 が 8.0 超えかつ(AND)、検査2 が 70 超えのレコードを抽出するSQLは以下の通りである。 -> SELECT * FROM 検査結果 WHERE 検査1>8.0 AND 検査2>70 (4)少し脱線するが、「検査結果」表より、全てのレコードを抽出するSQLは以下の通りである。(ただし、項目は患者番号、氏名のみ) -> SELECT 患者番号, 氏名 FROM 検査結果 (5)「検査結果」表より、患者番号と氏名でグルーピング((4)から重複行が見た目上削除)されたレコードを抽出するSQLは以下の通りである。 -> SELECT 患者番号, 氏名 FROM 検査結果 GROUP BY 患者番号, 氏名 (6) (1)-(5)を踏まえ、「検査結果」表より、検査1 が 8.0 超えかつ(AND)、検査2 が 70 超えのレコードかつ、患者番号と氏名でグルーピングされたレコードを抽出するSQLは以下の通りである。(本問のSQL) -> SELECT 患者番号,氏名 FROM 検査結果 WHERE 検査1>8.0 AND 検査2>70 GROUP BY 患者番号, 氏名 よって、解答は「3)」である。 ORDER BYで昇順に並ぶ 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":20,"question_text":"トランザクション処理が「すべて実行される」か「1つも実行されない」のどちらかの状態を表す特性はどれか。","choice1":"一貫性","choice2":"機密性","choice3":"原子性","choice4":"持続性","choice5":"独立性","correct_answer":3,"correct_answers":[3],"explanation":"ACID特性とは、トランザクション処理において必要とされる4つの要素、Atomicity（原子性）、Consistency（一貫性）、Isolation（独立性）、Durability（永続性）を頭字語で表したものである。 「A」はAtomicity（原子性）である。 これは、一連の処理は、全体として実行されるか、実行されないか、どちらかであることが保証されることを指す。 「C」はConsistency（一貫性）である。 これは、処理結果がある条件や整合性を保つことが保証されるという意味である。 「I」はIsolation（独立性）である。 これは、その処理について、結果だけが他から見ることができ、実行中の途中状態が他へ影響することが無いということである。 「D」はDurability（永続性）である。 これは、その処理が完了したという結果を受けた段階で、結果は失われることの無い永続的なものとしてデータベースに記録されている、ということを指している。 トランザクション処理では、データベースにおけるデータの一貫性を保証するため、一連の処理全体を一個の処理単位として管理している。 このとき、ACID特性が遵守されていることが、データの一貫性を保証するためには不可欠とされている。 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":21,"question_text":"関係データベースで、表から特定の列を取り出す操作はどれか。","choice1":"差","choice2":"結合","choice3":"射影","choice4":"選択","choice5":"直積","correct_answer":3,"correct_answers":[3],"explanation":"選択(selection) → 行の抽出 射影(projection) → 指定した列を抽出 結合(join) → 複数の表を結合して1つの表にする 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":22,"question_text":"データベース処理において、図のように2つのトランザクション更新要求の処理が進まなくなる状態はどれか。(図あり)","choice1":"アボート","choice2":"コミット","choice3":"デッドロック","choice4":"ロールバック","choice5":"ロールフォワード","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)デッドロックとは、行き詰まり、手詰まり、膠着状態などの意味を持つ英単語。 ITの分野では、複数の実行中のプログラムなどが互いに他のプログラムの結果待ちとなり、待機状態に入ったまま動かなくなる現象を指す。 4)ロールバックとは、後退、巻き戻し、撤退、引き下げ、巻き返し、反撃などの意味を持つ英単語。 情報システムの分野では、システム障害やデータの喪失、破損などが起きた際に、以前に正常に稼働していたある時点の状態に戻して復旧を試みることを指す。 5)ロールフォワードとは、データベースシステムなどに障害が発生したときの回復手法の一つで、ある時点（チェックポイント）で複製したバックアップデータを書き戻し、その後の更新データ（ジャーナル）を反映していって障害発生直前の状態に戻すこと。 主に装置の破損など物理的な障害の際に用いられる。"},{"year":"2021","category":"情報処理技術系","question_number":23,"question_text":"IPv6の説明として適切なのはどれか。","choice1":"無線LANでは使えない。","choice2":"IPv4とは直接通信できない。","choice3":"アドレス長は32ビットである。","choice4":"暗号化はサポートされていない。","choice5":"IPパケットのヘッダは可変長である。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)概念的にはIPv4とIPv6はほぼ同等と言えるが、実際のパケットフォーマットは完全に異なる上、IPアドレス空間の大きさも違うため、1対1対応はできない。そのため、IPv6ノードとIPv4ノードが互いに直接通信することはできない。 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":24,"question_text":"192.168.32.0/22のネットワークが持つホスト部のアドレス数はどれか。","choice1":"128","choice2":"256","choice3":"512","choice4":"1024","choice5":"2048","correct_answer":4,"correct_answers":[4],"explanation":"IPアドレスは、ネットワーク部とホスト部という二つの部分から成り立っています。 ネットワーク部は、そのIPアドレスが属しているネットワークを識別するための部分です。そのIPアドレスが、どのネットワークで使われているのかがわかります。 ホスト部は、ネットワーク内のコンピュータを識別するための部分です。そのIPアドレスが、ネットワーク内のどのコンピュータに割り当てられているかがわかります。 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":25,"question_text":"プライベートIPアドレスの複数の端末が、1つのグローバルIPアドレスを用いたインターネット接続を可能にする仕組みはどれか。","choice1":"CIDR","choice2":"ICMP","choice3":"NAPT","choice4":"SNMP","choice5":"RADIUS","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)NAPTとは「Network Address Port Translation」の略であり、TCP（UDP）/IPパケットに含まれるIPアドレスとポート番号を、別のIPアドレスとポート番号に変換する技術です。 IPマスカレードと呼ぶこともあります。 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":26,"question_text":"LAN内でループ構成を回避するためのデータリンク層の通信プロトコルを表すのはどれか。","choice1":"トークンリング","choice2":"フレームリレー","choice3":"スパニングツリー","choice4":"マルチホーミング","choice5":"リンクアグリゲーション","correct_answer":3,"correct_answers":[3],"explanation":"1)複数の端末が同時に送信を試みて信号が衝突（コリジョン）するのを防ぐアクセス制御の仕組みとして、「トークンパッシング」（token passing）と呼ばれる方式を用いるのが大きな特徴である。データの送信権を表すトークンと呼ばれる信号がリング上を高速で周回しており、送信したい端末はこれを取得して送信を開始する。送信が終わるとトークンを再び放流し、別の端末が送信できるようにする。 2)フレームリレーとは、信頼性の高い物理回線を前提として、パケット単位で、簡素化された、コネクションレスのデータ交換を行う通信方式のことである。 パケット交換を行う通信方式には、ネットワーク層で動作するX. 25がある。 これは、誤り制御やフロー制御を行うことにより、高い信頼性を確保するものである。 3)STP（Spanning Tree Protocol）は、円環上（ループ状）に形成されたレイヤー2ネットワークにおいて データトラフィックが永続的に流れ続けることを防止するプロトコルです。信頼性の高いネットワークを 構築するためには、ネットワーク機器に障害が発生しても迂回路で通信できるように、複数のスイッチを 使用したNW構成にしますが、そのような冗長化をした場合にSTPを有効にしなければ問題が発生します。 4)マルチホーミングは、同一宛先に対する複数の経路で負荷を分散させることができる機能です。 例えば複数のISPに同時に接続して通信することが可能となり、各ISPへの回線速度に応じてパケットを振り分けることができます。 また、 回線ダウン時にも別ISP経由でパケットを送出することができます。 5)リンクアグリゲーション（ポートトランキング）は、複数の物理ポートを束ねてスイッチ間の帯域幅を拡大するとともに、リンクの冗長性を高める機能です。 束ねたポートはリンクアグリゲーショングループ（LAG）またはチャンネルグループ、トランクグループなどと呼ばれ、論理的に1本のポートとして扱われます。"},{"year":"2021","category":"情報処理技術系","question_number":27,"question_text":"IPアドレスなどのネットワーク情報を提供するプロトコルはどれか。","choice1":"FTP","choice2":"DHCP","choice3":"HTTP","choice4":"POP3","choice5":"SMTP","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)DHCP（Dynamic Host Configuration Protocol）は、クライアントに対して動的にIP設定パラメーターを提供する機能です。 DHCPサーバーは、クライアントの要求に対して、あらかじめプールされたIPアドレスの中から使用されていないアドレスを選び、一定期間クライアントに割り当てます。 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":28,"question_text":"送信相手までの経路が不明な場合のデータ送信先として設定されるのはどれか。","choice1":"DNSサーバ","choice2":"LDAPサーバ","choice3":"WINSサーバ","choice4":"デフォルトゲートウェイ","choice5":"リンクローカルアドレス","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)デフォルトゲートウェイとは、所属するネットワーク内のコンピュータから外部のネットワーク上にあるコンピュータにアクセスする際に、出入り口の役割を果たす機器のことです。 一般的には、ルーターがデフォルトゲートウェイとなっており、「192.××××. ×. ×」などの数字で設定されています。 5)"},{"year":"2021","category":"情報処理技術系","question_number":29,"question_text":"インターネット上に構築された、あたかも専用線のように使うことができる仮想的なネットワークはどれか。","choice1":"VDT","choice2":"VOD","choice3":"VPN","choice4":"VLAN","choice5":"VoIP","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)VPNとは「Virtual Private Network （仮想プライベートネットワーク）」の頭文字をとった略語で、インターネット接続とオンラインのプライバシーを保護する仕組みです。 VPN接続は、仮想的な専用線（トンネル）を構築することで確立されます。 4)VLANは「Virtual Local Area Network」の略で、「仮想LAN」「バーチャルLAN」とも呼ばれます。 コンピュータネットワークにおいて、物理的な接続形態とは別に仮想的（バーチャル）なLANセグメント（個々のネットワーク環境のこと）を作る技術のことをいいます。 5)"},{"year":"2021","category":"情報処理技術系","question_number":30,"question_text":"理論上の伝送速度が最大の無線LANの規格はどれか。","choice1":"IEEE802.11a","choice2":"IEEE802.11b","choice3":"IEEE802.11ac","choice4":"IEEE802.11n","choice5":"IEEE802.11g","correct_answer":3,"correct_answers":[3],"explanation":"1)IEEE802.11a    54Mbps    5GHz帯 2)IEEE802.11b    11Mbps    2.4GHz帯 3)（Wi-Fi 5）IEEE802.11ac    6.9Gbps    5GHz帯 4)（Wi-Fi 4）IEEE802.11n    300Mbps    2.4G帯/5GHz帯 5)IEEE802.11g    54Mbps    2.4GHz帯 （Wi-Fi 6）IEEE802.11ax    9.6Gbps    2.4GHz/5GHz帯"},{"year":"2021","category":"情報処理技術系","question_number":31,"question_text":"1GByteのファイルを1Gbpsの回線でダウンロードするのに要する時間はどれか。ただし、伝送効率を50%とする。","choice1":"1秒","choice2":"4秒","choice3":"8秒","choice4":"16秒","choice5":"32秒","correct_answer":4,"correct_answers":[4],"explanation":"1000*8/（1000*0.5）＝16 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":32,"question_text":"図に示すネットワーク接続形態はどれか。(図あり)","choice1":"バス型ネットワーク","choice2":"スター型ネットワーク","choice3":"リング型ネットワーク","choice4":"メッシュ型ネットワーク","choice5":"パーシャルメッシュ型ネットワーク","correct_answer":2,"correct_answers":[2],"explanation":"1)バス型ネットワークとは、通信ネットワークの配線・接続形態（ネットワークトポロジー）の一つで、すべての端末が一つの共通の通信路に接続し、これを通じて相互に通信を行う方式。 コンピュータ内部の機器間の配線や、電子基板内部の伝送路などで用いられることが多い。 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":33,"question_text":"WebサーバーとWebブラウザとの間でユーザーのログイン状態などを管理する情報を保持する仕組みはどれか。","choice1":"CGI","choice2":"CSS","choice3":"URL","choice4":"HTML","choice5":"Cookie","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":34,"question_text":"ゼロデイアタックについて正しいのはどれか。","choice1":"大量の迷惑メールの送信を行う。","choice2":"多数の端末から同時に大量のデータを送信する。","choice3":"実在する企業や個人を装った電子メールを送信する。","choice4":"大量のデータを間断なく送り続けサーバーを過負荷状態に追い込む。","choice5":"セキュリティパッチが公開される前のセキュリティホールを利用する。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":35,"question_text":"本人を詐称した電話によるパスワードの不正入手などの行為を指すのはどれか。","choice1":"DoS攻撃","choice2":"フィッシング","choice3":"ポートスキャン","choice4":"ソーシャルエンジニアリング","choice5":"クロスサイトスクリプティング","correct_answer":4,"correct_answers":[4],"explanation":"1)DoS攻撃（ドスこうげき、英: denial-of-service attack）は、情報セキュリティにおける可用性を侵害する攻撃手法のひとつ。 ウェブサービスを稼働しているサーバやネットワークなどのリソース（資源）に意図的に過剰な負荷をかけたり脆弱性をついたりすることでサービスを妨害する。 2)フィッシング (Phishing) とは実在する組織を騙って、ユーザネーム、パスワード、アカウントID、ATMの暗証番号、クレジットカード番号といった個人情報を詐取することです。 電子メールのリンクから偽サイト (フィッシングサイト) に誘導し、そこで個人情報を入力させる手口が一般的に使われています。 3)「ポートスキャン」とは、攻撃者がスキャン対象の稼働サービス、あるいは、そのサービスのバージョンやOSなどを特定する目的で行う調査手法のことである。 一方でシステム管理者も、不要なサービスが外部からスキャン可能になってしまっていないか確認するためにポートスキャンを行う。 4) 5)クロスサイトスクリプティング（XSS）とは、攻撃対象のWebサイトの脆弱性を突き、攻撃者がそこに悪質なサイトへ誘導するスクリプトを仕掛けることで、サイトに訪れるユーザーの個人情報などを詐取する攻撃のことを指します。"},{"year":"2021","category":"情報処理技術系","question_number":36,"question_text":"ハードディスクを廃棄する際に破壊を求める情報セキュリティ対策はどれか。","choice1":"人的対策","choice2":"環境的対策","choice3":"技術的対策","choice4":"組織的対策","choice5":"物理的対策","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":37,"question_text":"通信を監視して、不正アクセスを検知、遮断するシステムはどれか。","choice1":"DMA","choice2":"DMZ","choice3":"IDS","choice4":"IPS","choice5":"WPA","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)IPSは、Intrusion Prevention Systemの頭文字をとった用語で、不正侵入防止システムと訳される。ネットワークやサーバーを監視し、不正なアクセスを検知して管理者に通知する役割を担うシステムとしてIDS（Intrusion Detection System：不正侵入検知システム）が知られている。IPSはIDSと同様に不正なアクセスを検知するが、検知した通信を遮断する役割を担う点で異なる。IDSは不正な通信を検知しても通信自体は許可するため、IPSはIDSよりセキュリティレベルが高い。 5)WPAとはWi-Fi Protected Accessの略で、 Wi-Fi Alliance(*)が発表した、 無線LANの暗号化方式です。 従来より幅広く使われているWEP(Wired Equivalent Privacy)は、 暗号化プロトコルが単純なことから、容易に暗号を解読されやすいなどの、 脆弱性の問題点が指摘されていました。 WPAは、WEPの欠点を改善するために、 一定時間ごとに暗号鍵を変更することにより暗号の解読をより困難にした、 TKIP(Temporal Key Integrity Protocol)などを新たに取り入れて制定されました。 また、WPAを基に、 さらに強力な暗号方式であるAES(Advanced Encryption Standard)を扱えるように改良した、 WPA2(Wi-Fi Protected Access 2)が用意されています。 なお、脆弱性への対策という観点からは、 WEPは容易に暗号解読が可能なことから使用を避けることが望ましく、 また、WPAにおいても限定的に解読できることが発表されており、万全とは言えません。 そのため現状では、 暗号方式として脆弱性が指摘されていないWPA2を使用することが最も安全とされています。"},{"year":"2021","category":"情報処理技術系","question_number":38,"question_text":"本人確認のための認証技術でないのはどれか。","choice1":"生体認証","choice2":"電子署名","choice3":"多要素認証","choice4":"IDとパスワード","choice5":"ワンタイムパスワード","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":39,"question_text":"公開鍵暗号を用いた暗号化通信で必要となる鍵の組み合わせはどれか。","choice1":"送信者の公開鍵と受信者の秘密鍵","choice2":"送信者の公開鍵と送信者の秘密鍵","choice3":"送信者の公開鍵と受信者の公開鍵","choice4":"受信者の公開鍵と受信者の秘密鍵","choice5":"受信者の公開鍵と送信者の秘密鍵","correct_answer":4,"correct_answers":[4],"explanation":"1.　受信者が秘密鍵を使って公開鍵を作成する 2.　送信者は受信者の公開鍵を取得する 3.　平文(暗号化したい文)を送信者が公開鍵を使い暗号化し送付する 4.　受信者が暗号文を受け取る。 5.　受信者は暗号文を秘密鍵で平文に復号化する 1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":40,"question_text":"Webアプリケーション上で悪意のあるデータを入力し、データベースのデータを改ざんしたり、データを不正に取得したりする攻撃はどれか。","choice1":"水飲み場攻撃","choice2":"SQLインジェクション攻撃","choice3":"バッファオーバーフロー攻撃","choice4":"クロスサイトスクリプティング攻撃","choice5":"DNSキャッシュポイズニング攻撃","correct_answer":2,"correct_answers":[2],"explanation":"1)水飲み場型攻撃とは 特定の企業の機密情報を狙い、窃取（せっしゅ）する標的型攻撃の1つ。 攻撃対象のユーザーが普段アクセスするWebサイトを改ざんし、閲覧するだけでウイルスに感染させる手法。 2)SQLインジェクションとは、アプリケーションの脆弱性により本来の意図ではない不当な「SQL」文が作成されてしまい、「注入(injection)」されることによって、データベースのデータを不正に操作される攻撃 のことです。 3)プログラム実行時にデータを一時的に格納するメモリ領域内の場所（バッファ）を溢れさせることにより、実行中のアプリケーションを強制停止させたり、悪意のあるコードが実行されてしまう 4)クロスサイトスクリプティング（XSS）とは、攻撃対象のWebサイトの脆弱性を突き、攻撃者がそこに悪質なサイトへ誘導するスクリプトを仕掛けることで、サイトに訪れるユーザーの個人情報などを詐取する攻撃のことを指します。 5)偽のDNS応答をフルサービスリゾルバー（キャッシュDNSサーバー）にキャッシュさせることで、利用者のアクセスを攻撃者が用意したサーバーに誘導し、フィッシングや送信された電子メールの窃盗などを図る攻撃手法です。"},{"year":"2021","category":"情報処理技術系","question_number":41,"question_text":"外部からの簡単な指示に対して、ある程度自律的に動作するマルウェアはどれか。","choice1":"ボット","choice2":"アドウェア","choice3":"スパイウェア","choice4":"エクスプロイト","choice5":"ランサムウェア","correct_answer":1,"correct_answers":[1],"explanation":"1) 2)アドウェアとは、通常、利用料が無料であるかわりに商品の広告を勝手に表示するソフトウェアを指します。 執拗に広告が表示されるだけで危険性は低いですが、ユーザーの許可なく情報を収集するアドウェアも一部存在するため、注意が必要です。 3)スパイウェアとは、コンピュータ内部からインターネットに対して情報を送り出すソフトウェアの総称です。 一般的には、そのようなソフトウェアがインストールされていることや動作していることにユーザーが気付いていない状態で、自動的に情報を送信するソフトウェアをスパイウェアと呼んでいます。 4)エクスプロイトとは、アプリケーション、ネットワークやハードウェアの脆弱性を悪用する非倫理的または違法な攻撃です。 攻撃は通常、コンピュータ システムを意のままにコントロールすることまたはネットワーク上に保存されているデータを盗むことを目的としたソフトウェアまたはコードの形態を取ります。 5)ランサムウェアとは、感染したコンピュータをロックしたり、ファイルを暗号化したりすることによって使用不能にしたのち、元に戻すことと引き換えに「身代金」を要求するマルウェアです。なお、ランサムウェアという言葉はRansom（身代金）とSoftware（ソフトウェア）を組み合わせた造語です。"},{"year":"2021","category":"情報処理技術系","question_number":42,"question_text":"レスポンスタイムが要求仕様通りであるかを確認するのはどれか。","choice1":"機能テスト","choice2":"性能テスト","choice3":"耐久テスト","choice4":"負荷テスト","choice5":"操作性テスト","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":43,"question_text":"工程管理で用いられる下の図の名称はどれか。(図あり)","choice1":"E-R図","choice2":"ガントチャート","choice3":"ネットワーク図","choice4":"クリティカルパス","choice5":"レーダーチャート","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":44,"question_text":"ホスト名からIPアドレスを確認する際に利用するコマンドはどれか。","choice1":"ping","choice2":"netstat","choice3":"tracert","choice4":"ipconfig","choice5":"nslookup","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)nslookupは、多くのオペレーティングシステムで使用できるネットワーク管理のためのコマンドラインツールで、ドメイン名とIPアドレスの対応付け、その他のDNSレコードを取得するためにDomain Name System に問い合わせを行う。"},{"year":"2021","category":"情報処理技術系","question_number":45,"question_text":"ソフトウェアのライセンス形態の1つであるサブスクリプションについて正しいのはどれか。","choice1":"無料で利用できる。","choice2":"購入料金を分割して支払う。","choice3":"購入金額によらず毎月定額を支払う。","choice4":"支払い後に無期限の利用権が付与される。","choice5":"料金支払いによって利用権が一定期間付与される。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":46,"question_text":"安定して稼働できる期間を評価する指標(信頼性)はどれか。","choice1":"MTBF","choice2":"MTBR","choice3":"MTTA","choice4":"MTTF","choice5":"MTTR","correct_answer":1,"correct_answers":[1],"explanation":"1)MTBFは、Mean Time Between Failuresの略。平均故障間隔のことを指します。 何時間に何回の割合で故障しているのかを知るため、計算は故障が起こるまでの稼働時間が対象です。 たとえば、500時間に1回、600時間に1回、400時間に1回故障が起きた場合、3つの故障の平均である500時間がMTBFになるということです。 値は故障までの稼働時間を示すことから、値が高いほどシステムの信頼性があると判断できます。 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":47,"question_text":"プログラムの無断複製を制限する法律はどれか。","choice1":"意匠法","choice2":"商標法","choice3":"著作権法","choice4":"個人情報保護法","choice5":"不正競争防止法","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"情報処理技術系","question_number":48,"question_text":"完全にシステムを二重化し、通常時は2つのシステムを並列に用いてあたかも1つのシステムのように運用するのはどれか。","choice1":"デュアルシステム","choice2":"フェールオーバー","choice3":"ホットスタンバイ","choice4":"コールドスタンバイ","choice5":"デュプレックスシステム","correct_answer":1,"correct_answers":[1],"explanation":"1) 2)フェイルオーバーとは、稼働中のシステムで問題が生じてシステムやサーバーが停止してしまった際に、自動的に待機システムに切り替える仕組みをいいます。 HA機能ともいわれ、システムの可用性を高めるための冗長化の一つです。 フェイルオーバーとは反対に、手動でシステム切り替えする方法はスイッチオーバーと呼ばれています。 3)「ホットスペア」ともいう。 複数の同じ構成のサーバーやネットワーク機器を用意しておき、システムの障害発生時に、本番系（稼動系、プライマリーサーバー）から、同期する待機系（予備系、セカンダリーサーバー）へ瞬時に切り替える方式のこと。 4)コールドスタンバイとは、機器やシステムを冗長化して信頼性を向上させる手法の一つで、稼働中の系統と同じ構成の予備の機材などを用意しておくが普段は停止させておく方式。 5)デュプレックスシステムとは、1つの処理に対して2組のシステムを用意しておき、一方は障害が発生した際の予備機として待機させておく手法です。 通常は主システム側で処理を実行し、障害によるシステム停止や結果の誤りが検出されたときに、待機させておいた予備システムに切り替えて処理を続行させます。"},{"year":"2021","category":"情報処理技術系","question_number":49,"question_text":"自施設の構内に機器を設置してシステムを導入・運用するのはどれか。","choice1":"クラウド","choice2":"ハウジング","choice3":"オンプレミス","choice4":"ホスティング","choice5":"データセンター","correct_answer":3,"correct_answers":[3],"explanation":"1) 2)データセンターの設備を提供するサービスのことで、サーバを設置する場所（ラックスペース）や電源、通信回線などが提供される。 ホスティングとは異なり、ユーザはサーバなどの必要な機器を用意して設置し、基本的に遠隔で利用する。 保守や運用監視などの代行サービスが併せて提供されることもある。 3)オンプレミスとは、サーバーやソフトウェアなどの情報システムを、使用者が管理している施設の構内に機器を設置して運用することをいう。 4)ホスティングとは、プロバイダや通信事業者が保有するサーバを、ネットワーク経由で顧客に貸し出すサービスのことです。 データセンターの利用形態の一つであり、一般的に「レンタルサーバ」とも呼ばれます。 ホスティングには、1台のサーバを複数ユーザーで共有する共用ホスティングと、1台を1社だけで使う専用ホスティングがあります。 5)"},{"year":"2021","category":"情報処理技術系","question_number":50,"question_text":"故障機器をメーカーに送り、代替品と交換または修理する保守サービスはどれか。","choice1":"定期保守","choice2":"予防保守","choice3":"リモート保守","choice4":"オンサイト保守","choice5":"センドバック保守","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4)オンサイト保守はメーカーや業者の担当者が当該ハードウェアの設置場所に出向き、その場で修理や復旧を行うサービスを指します。 5)センドバック保守は、故障したハードウェアを業者やメーカーに送ることで修理を受けることができるサービスです。"},{"year":"2021","category":"医学・医療系","question_number":1,"question_text":"予防医学について正しい組み合わせはどれか。","choice1":"健康増進　　ー　二次予防","choice2":"事故予防　　ー　二次予防","choice3":"疾病予防　　ー　一次予防","choice4":"早期発見　　ー　一次予防","choice5":"合併症対策　ー　一次予防","correct_answer":3,"correct_answers":[3],"explanation":"1) 一次予防 2) 一次予防 3) 一次予防 4) 二次予防 5) 二次予防 一次予防……健康増進 一次予防は、健康な時期に病気の予防を意識することです。例えば、健康診断や予防接種を受けることは、健康的な体を維持することにつながります。食事の内容に気を遣い、メタボリックシンドロームを予防することも大切です。生活に適度な運動を取り入れることも、病気や怪我を予防する有効な方法といえます。一次予防では、運動指導者が活躍します。 二次予防……早期発見・早期治療 二次予防は、病気を早期発見して適切な治療を受け、重篤化を防ぐことです。 現在では医療が進歩し、早期発見ができれば大抵の病気を治すことができるようになりました。早い段階で病気の芽を摘んでおくことで、患者の負担はもちろん、医療費や人件費の削減にもつながります。 三次予防……リハビリ 三次予防は、既に発症した病気の再発を防ぐことをいいます。具体的には、保健指導やリハビリテーションが挙げられます。体調のサポートだけでなく、生活習慣へのアドバイスや心のケアをしてあげることも必要です。この三次予防では、理学療法士と作業療法士が活躍します。"},{"year":"2021","category":"医学・医療系","question_number":2,"question_text":"医の倫理について誤っている組み合わせはどれか。","choice1":"リスボン宣言　　　　ー　尊厳性の尊重","choice2":"リスボン宣言　　　　ー　自己決定権の尊重","choice3":"ジュネーブ宣言　　　ー　医師の倫理規範","choice4":"ヘルシンキ宣言　　　ー　被験者の権利の尊重","choice5":"ストックホルム宣言　ー　患者の権利章典","correct_answer":5,"correct_answers":[5],"explanation":"「人間環境宣言」のこと。医の倫理と関連なし。 1)１．良質の医療を受ける権利 全ての人は差別されることなく良質な医療を受ける権利があります 優れた医師から医療を受ける権利があります 一般的に認められた医療を受ける権利があります ２．選択の自由の権利 病院や医師などを自由に選択し、また変更できる権利があります 他の医師に相談し意見を求める権利があります ３．自己決定の権利 病気の十分な説明を受け、自分で治療方針を決定する権利があります 医学研究、教育に利用される事を拒否する権利があります 患者さまが、拒否された医療行為は決して致しません 自己決定出来ない患者さまについては、親族、関係諸機関と相談して治療方針を決定致します ４．情報を得る権利 患者さまが知りたい全ての医療情報を知る権利があります ５．プライバシーを守られる権利 患者さまは自分の医療情報を伝える人を選択出来る権利があります 当院は患者さまの医学的データの保護に努めます ６．人間としての尊厳を得る権利 宗教的、文化的価値観が尊重される権利があります 苦痛の除去を受ける権利があります 人間的な終末期ケアを受ける権利があります 3)医師の一人として、 私は、人類への奉仕に自分の人生を捧げることを厳粛に誓う。 私の患者の健康と安寧を私の第一の関心事とする。 私は、私の患者のオートノミーと尊厳を尊重する。 私は、人命を最大限に尊重し続ける。 私は、私の医師としての職責と患者との間に、年齢、疾病もしくは障害、信条、民族的起源、ジェンダー、国籍、所属政治団体、人種、性的志向、社会的地位あるいはその他いかなる要因でも、そのようなことに対する配慮が介在することを容認しない。 私は、私への信頼のゆえに知り得た患者の秘密を、たとえその死後においても尊重する。 私は、良心と尊厳をもって、そしてgood medical practiceに従って、私の専門職を実践する。 私は、医師の名誉と高貴なる伝統を育む。 私は、私の教師、同僚、および学生に、当然受けるべきである尊敬と感謝の念を捧げる。 私は、患者の利益と医療の進歩のため私の医学的知識を共有する。 私は、最高水準の医療を提供するために、私自身の健康、安寧および能力に専心する。 私は、たとえ脅迫の下であっても、人権や国民の自由を犯すために、自分の医学的知識を利用することはしない。 私は、自由と名誉にかけてこれらのことを厳粛に誓う。 4)1964年，世界医師会総会で採択された「ヒトを対象とする生物医学的研究に携わる医師のための勧告」をいう． 生物医学的研究は，最終的にヒトを対象とした試験によらなければ，実際の医療に寄与するものにならない． 現在の臨床試験は，1964年のヘルシンキ宣言を倫理的基盤としている．"},{"year":"2021","category":"医学・医療系","question_number":3,"question_text":"ターミナルケアについて正しいのはどれか。","choice1":"ケアチーム内で複数の意見が出た場合には、常に専門医の治療方針を優先する。","choice2":"患者の意思確認はできないが、家族が患者の意思を推定できる場合には、その推定意思を尊重する。","choice3":"患者と医療従事者とか十分な話し合いを行って意思決定した場合には、治療内容を家族に知らせなくてもよい。","choice4":"インフォームドコンセントに基づいて患者が意思決定して文書にまとめられている治療方針は再確認の必要がない。","choice5":"患者の意思確認はできず、家族が患者の意思を推定できない場合は、家族にとって最善の治療方針をとることを基本とする。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)患者の意思を推察できない場合は、患者にとって最善の治療方針を取る。 参考文献サイト】 人生の最終段階における医療の決定プロセスに関するガイドライン"},{"year":"2021","category":"医学・医療系","question_number":4,"question_text":"患者が主治医以外の専門の医師の意見を聞くことを何というか。","choice1":"ケアミックス","choice2":"アドヒアランス","choice3":"セカンドオピニオン","choice4":"インフォームドコンセント","choice5":"インフォームドデシジョン","correct_answer":3,"correct_answers":[3],"explanation":"1)同じ病院の病棟あるいは病室単位に，急性期医療と慢性期医療あるいは介護療養機能を併せもつことの総称 2)患者が治療方針の決定に賛同し積極的に治療を受けること 3) 4)医師による診断・治療に関する十分な説明に基づく患者の同意 5)治療やケアの方法として考えられるすべての選択肢について、そのベネフィットとリスクの情報をすべて得た上で、患者が主体的に意思決定して選択を行うこと"},{"year":"2021","category":"医学・医療系","question_number":5,"question_text":"国民健康保険に加入している30歳本人の自己負担割合はどれか。","choice1":"0割","choice2":"1割","choice3":"2割","choice4":"3割","choice5":"5割","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":6,"question_text":"医科の診療報酬改定は、通常何年毎に実施されるか。","choice1":"1年","choice2":"2年","choice3":"3年","choice4":"5年","choice5":"10年","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":7,"question_text":"保健医療機関が患者自己負担以外の診療報酬を請求する主たる相手方はどれか。","choice1":"厚生労働省","choice2":"健康保険組合","choice3":"審査支払機関","choice4":"保険加入者(被保険者)","choice5":"患者が居住する地方自治体","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)審査支払機関は、保険医療機関から提出されたレセプトの内容をチェックする「審査業務」と、保険医療機関に医療費を入金する「支払業務」の２つの業務を実施する、国によって設立が定められた第三者機関です。 各都道府県に47の支部が設置されています。 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":8,"question_text":"DPCコードを決定する傷病名はどれか。","choice1":"入院時併存傷病名","choice2":"入院後発症傷病名","choice3":"入院の契機となった傷病名","choice4":"医療資源をもっとも投入した傷病名","choice5":"検査費がもっとも投入された傷病名","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":9,"question_text":"保険診療として認められているのはどれか。(2つ選択)","choice1":"禁煙外来","choice2":"健康診断","choice3":"自然分娩","choice4":"帝王切開","choice5":"予防接種","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":10,"question_text":"民間資格はどれか。","choice1":"保健師","choice2":"管理栄養士","choice3":"救急救命士","choice4":"視能訓練士","choice5":"臨床心理士","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5) 日本臨床心理士資格認定協会による認定資格"},{"year":"2021","category":"医学・医療系","question_number":11,"question_text":"メタボリック・シンドロームの診断に用いられないのはどれか。(2つ選択)","choice1":"血圧","choice2":"体重","choice3":"血糖","choice4":"尿酸","choice5":"HDLコレステロール","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　4)尿酸とは，「プリン体」という物質が体内で分解されてできる燃えカスです。プリン体は運動したり臓器を動かしたりするためのエネルギー物質で，常に体内で作られています。また，私たちの細胞には遺伝情報を伝える役割を持つ核酸という物質がありますが，核酸の構成成分もプリン体ですので古くなった細胞を分解する新陳代謝の過程でこの核酸からプリン体が出てきます。プリン体は細胞の中にあるものですから，動物・植物いずれの食品からも体内に入ります。これらのプリン体は主に肝臓で分解され尿酸となり，一時的に体内に溜め込まれた後，尿や便として排泄されます。 補足】 参考文献サイト】 メタボリックシンドロームの診断基準について"},{"year":"2021","category":"医学・医療系","question_number":12,"question_text":"病床機能報告制度における病床機能区分でないのはどれか。","choice1":"回復期","choice2":"急性期","choice3":"慢性期","choice4":"療養期","choice5":"高度急性期","correct_answer":4,"correct_answers":[4],"explanation":"医療機関が報告する医療機能は、次の4区分です。 ●高度急性期 急性期の患者に対し、状態の早期安定化に向けて、診療密度が特に高い医療を提供する機能 ●急性期 急性期の患者に対し、状態の早期安定化に向けて、医療を提供する機能 ●回復期 急性期を経過した患者への在宅復帰に向けた医療やリハビリテーションを提供する機能 特に、急性期を経過した脳血管疾患や大腿骨頚部骨折等の患者に対し、ADLの向上や在宅復帰を目的としたリハビリテーションを集中的に提供する機能（回復期リハビリテーション機能） ●慢性期 長期にわたり療養が必要な患者を入院させる機能 長期にわたり療養が必要な重度の障害者（重度の意識障害者を含む）、筋ジストロフィー患者又は難病患者等を入院させる機能 1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":13,"question_text":"在宅医療・介護連携推進事業を進める機関の組み合わせとして正しいのはどれか。","choice1":"市町村が主体となり国保連等と連携","choice2":"国保連が主体となり都道府県等と連携","choice3":"都道府県が主体となり国保連等と連携","choice4":"市町村が主体となり郡市医師会等と連携","choice5":"厚生労働省が主体となり都道府県医師会等と連携","correct_answer":4,"correct_answers":[4],"explanation":"参考文献サイト】 在宅医療・介護連携推進事業とは"},{"year":"2021","category":"医学・医療系","question_number":14,"question_text":"医療の質評価指標の分類について正しい組み合わせはどれか。(2つ)","choice1":"プロセス　　　　ー　手術後死亡率","choice2":"アウトカム　　　ー　病院標準化死亡比","choice3":"アウトカム　　　ー　早期リハビリテーション実施率","choice4":"ストラクチャー　ー　SCUの有無","choice5":"ストラクチャー　ー　手術後合併症発症率","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1)アウトカム 2)アウトカム 3)プロセス 4)ストラクチャー 5)アウトカム"},{"year":"2021","category":"医学・医療系","question_number":15,"question_text":"医療法および同施行規則において医療安全管理体制として義務付けられていないのはどれか。","choice1":"患者相談窓口の設置","choice2":"感染制御体制の整備","choice3":"臨床倫理委員会の設置","choice4":"医療安全に関する職員研修","choice5":"医療事故等の院内報告体制","correct_answer":3,"correct_answers":[3],"explanation":"補足】過去問-2015年-問16など"},{"year":"2021","category":"医学・医療系","question_number":16,"question_text":"インシデントレポートについて誤っているのはどれか。(2つ)","choice1":"医療事故の報告書である。","choice2":"ヒヤリハットも含まれる。","choice3":"分析は原因の解明に役立つ。","choice4":"当事者による自主的な報告である。","choice5":"患者に不利益が生じなければ提出しなくてよい。","correct_answer":1,"correct_answers":[1,5],"explanation":"正答は1、5。　インシデントレポートとは、インシデントについての情報を把握・分析するための報告書である。 インシデントとは、日常診療の場で誤った医療行為などが患者に実施される前に発見されたもの、あるいは、誤った医療行為などが実施されたが、結果として患者に影響を及ぼすに至らなかったものをいう。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":17,"question_text":"医薬品医療機器等法で高度管理医療機器に分類されるのはどれか。","choice1":"人工呼吸器","choice2":"超音波機器","choice3":"X線撮影装置","choice4":"手術用照明器","choice5":"電子式血圧計","correct_answer":1,"correct_answers":[1],"explanation":"高度管理医療機器は、不具合が生じた場合、人体へのリスクが比較的高いとされるもの(クラスⅢ)、生命の危険に直結するおそれがあるもの(クラスⅣ) 1) 高度管理医療機器 2) 管理医療機器 3) 管理医療機器 4) 一般医療機器 5) 管理医療機器"},{"year":"2021","category":"医学・医療系","question_number":18,"question_text":"標準予防策(スタンダードプリコーション)の具体策として適切でないのはどれか。","choice1":"患者配置","choice2":"手指衛生","choice3":"トリアージ","choice4":"個人防護具の使用","choice5":"リネン類などの洗濯","correct_answer":3,"correct_answers":[3],"explanation":"標準予防策(スタンダードプリコーション)とは、 感染症の有無に関わらずすべての患者のケアに際して普遍的に適用する予防策である。 標準予防策は，患者の血液，体液（唾液，胸水，腹水，心嚢液，脳脊髄液 等すべての体液），分泌物（汗は除く），排泄物，あるいは傷のある皮膚や，粘膜を感染の 可能性のある物質とみなし対応すること 3)重傷度や治療緊急度に応じた「傷病者の振り分け」を意味 参考文献サイト】 標準予防策"},{"year":"2021","category":"医学・医療系","question_number":19,"question_text":"入院診療計画書の交付・説明は入院後何日以内に行わなければならないか。","choice1":"3日","choice2":"5日","choice3":"7日","choice4":"14日","choice5":"30日","correct_answer":3,"correct_answers":[3],"explanation":"補足】過去問-2015年-問34など"},{"year":"2021","category":"医学・医療系","question_number":20,"question_text":"クリニカルパスにおいて、アウトカムが達成されない状態を表すのはどれか。","choice1":"レジメン","choice2":"エビデンス","choice3":"バリアンス","choice4":"ガイドライン","choice5":"ベンチマーク","correct_answer":3,"correct_answers":[3],"explanation":"1)薬物療法を行う上で、薬剤の用量や用法、治療期間を明記した治療計画のこと 2)この治療法がよいといえる証拠 3)バリアンスとは、クリニカルパスから逸脱・変動することである。 バリアンスには正バリアンスと負のバリアンスの2種類がある。 正のバリアンスは回復が早く、予定より早く退院できるといったケースで、負のバリアンスは、術後合併症などが代表的である。 4) 5)比較のために用いる指標あるいは目指すべき目標"},{"year":"2021","category":"医学・医療系","question_number":21,"question_text":"診療ガイドラインについて正しいのはどれか。","choice1":"エビデンスが系統的に評価されている。","choice2":"ガイドラインに従って診療する義務がある。","choice3":"推奨に従わなければ保険診療の対象とならない。","choice4":"国が審査を行った後に正式なガイドラインとする。","choice5":"専門医に対するアンケート調査に基づいて作成される。","correct_answer":1,"correct_answers":[1],"explanation":"過去問-2016年-問19など 必ずしもガイドラインに従う必要はなく、患者と医師がそれ以外の保険診療を選択しても 保険が認められないことはない。"},{"year":"2021","category":"医学・医療系","question_number":22,"question_text":"関連がない組み合わせはどれか。","choice1":"痛風　　　　　ー　尿酸","choice2":"狭心症　　　　ー　動脈硬化","choice3":"尿崩症　　　　ー　膀胱","choice4":"脳出血　　　　ー　高血圧","choice5":"起立性低血圧　ー　自立神経","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 膀胱は生成された尿を貯める臓器であり、腎性尿崩症、中枢性尿崩症ともに発症に関連がない。 腎性尿崩症はADHに対する腎臓の 反応性 が低下するために尿を濃縮することができず、希釈された尿が出て、尿の量が増加する疾患です。 尿量が増加して水分が失われるため、のどが渇き、大量の水分を摂取するようになります。 腎性尿崩症は 遺伝子の変異 による先天性とその他の原因で発症する後天性に分けることができます。 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":23,"question_text":"膵臓で分泌されるホルモンはどれか。","choice1":"グルカゴン","choice2":"オキシトシン","choice3":"カルシトニン","choice4":"成長ホルモン","choice5":"アルドステロン","correct_answer":1,"correct_answers":[1],"explanation":"1) 膵臓α細胞から分泌 グルカゴンとは ヒトの体の中で作られる、血糖値を上げる強力なホルモンです。 グルカゴンは膵臓のα細胞で作られます。 肝臓で貯蔵してあるブドウ糖を分解し、血糖値を上げる効果があります。 2) 下垂体後葉 3) 甲状腺傍濾胞細胞 4) 下垂体前葉 5) 副腎皮質"},{"year":"2021","category":"医学・医療系","question_number":24,"question_text":"次のうちアレルギー反応が原因の疾患はどれか。","choice1":"日本脳炎","choice2":"腹部大動脈瘤","choice3":"再生不良性貧血","choice4":"胆のうポリープ","choice5":"アナフィラキシー","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医学・医療系","question_number":25,"question_text":"後発医薬品に関する記述で正しいのはどれか。","choice1":"開発に10年以上かかる。","choice2":"先発医薬品より薬価が高い。","choice3":"成分の探索を行って開発を進める。","choice4":"薬価の算出時に新規性の評価が行われる。","choice5":"治療学的に先発医薬品と同等であるかの評価が行われる。","correct_answer":5,"correct_answers":[5],"explanation":"1) 多くは開発期間2～3年。 2) 薬価は先発医薬品の0.5倍が基本。 3) 開発のための成分探索は行わない。 4) 新規性の評価は行われない。 5)"},{"year":"2021","category":"医学・医療系","question_number":26,"question_text":"特定生物由来製品の使用記録の保管期間は何年か。","choice1":"5年","choice2":"10年","choice3":"15年","choice4":"20年","choice5":"30年","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医学・医療系","question_number":27,"question_text":"麻薬処方箋を発行することができる麻薬施用者免許を交付するのは誰か。","choice1":"市町村長","choice2":"法務大臣","choice3":"厚生労働大臣","choice4":"都道府県知事","choice5":"内閣総理大臣","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医学・医療系","question_number":28,"question_text":"処方箋(麻薬を含まない)への記載が必要な項目はどれか。","choice1":"病名","choice2":"患者住所","choice3":"使用期間","choice4":"薬剤師名","choice5":"臨床検査値","correct_answer":3,"correct_answers":[3],"explanation":"処方箋の交付等に関連する法令の規定にて、 『医師は、患者に交付する処方せんに、患者の氏名、年齢、薬名、分量、用法、 用量、発行の年月日、使用期間及び病院若しくは診療所の名称及び所在地又は 医師の住所を記載し、記名押印又は署名しなければならない。』と定められています。 1)記載不要 2)記載不要(麻薬処方箋の場合は必要) 3)上記により記載が必要 4)記載不要　※薬剤師名ではなく、処方した医師名が必要 5)記載不要　※院外処方箋に記載する場合があるが必須ではない 補足】 参考文献サイト】 処方箋の交付等に関連する法令の規定"},{"year":"2021","category":"医学・医療系","question_number":29,"question_text":"看護実践用語標準マスターが取り扱っているのはどれか。(2つ)","choice1":"看護観察","choice2":"看護管理","choice3":"看護研究","choice4":"看護行為","choice5":"看護診断","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。"},{"year":"2021","category":"医学・医療系","question_number":30,"question_text":"誤っている組み合わせはどれか。","choice1":"細胞診　　　　ー　病理検査","choice2":"血糖検査　　　ー　検体検査","choice3":"炎症反応検査　ー　検体検査","choice4":"血液ガス分析　ー　生理機能検査","choice5":"12誘導心電図　ー　生理機能検査","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 検体検査 血液ガス分析とは、血液中に含まれる酸素や二酸化炭素の量、あるいは pH を測定する検査。通常は動脈血を測定する。 大腿動脈（鼠径部）、上腕動脈（肘）もしくは橈骨動脈（手首）などから採血する。通常の採血（静脈）と違い動脈を穿刺するので、看護師ではなく医師が行う。採血管（シリンジ）には抗凝固薬が添加されており、採った血液の凝固を防ぐ。 5)"},{"year":"2021","category":"医学・医療系","question_number":31,"question_text":"肝機能に関する検査項目はどれか。","choice1":"血糖","choice2":"尿素窒素","choice3":"AST(GOT)","choice4":"クレアチニンキナーゼ(CK)","choice5":"グリコヘモグロビン(HbA1c)","correct_answer":3,"correct_answers":[3],"explanation":"1) 糖尿病の診断 2) 腎機能低下の診断 3) 肝細胞、筋肉、赤血球からの逸脱酵素 4) 筋細胞の障害(心筋梗塞など)の診断 5) 糖尿病の診断"},{"year":"2021","category":"医学・医療系","question_number":32,"question_text":"腫瘍マーカーはどれか。","choice1":"T3","choice2":"GFR","choice3":"PSA","choice4":"C-反応性蛋白(CRP)","choice5":"グリコヘモグロビン(HbA1c)","correct_answer":3,"correct_answers":[3],"explanation":"1) 甲状腺ホルモン 2) 糸球体ろ過量 3) 前立腺がんの腫瘍マーカー 4) 炎症、組織崩壊などで増加するタンパク質 5) 糖化ヘモグロビン"},{"year":"2021","category":"医学・医療系","question_number":33,"question_text":"細胞内液に含まれる電解質の中で最も多いのはどれか。","choice1":"K+","choice2":"Cl-","choice3":"Na+","choice4":"Ca2+","choice5":"Mg2+","correct_answer":1,"correct_answers":[1],"explanation":"細胞内液に含まれる電解質 K^+ > HPO4^2- > Mg^2+ > SO4^2- > Na^+ > Ca^2+ 1) 2) 3) 4) 5)"},{"year":"2021","category":"医学・医療系","question_number":34,"question_text":"生理機能検査はどれか。","choice1":"髄液検査","choice2":"骨密度検査","choice3":"心臓エコー検査","choice4":"腫瘍マーカー検査","choice5":"骨シンチグラフィ検査","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医学・医療系","question_number":35,"question_text":"眼科検査のうち、明室(明るい部屋)で行う検査はどれか。(2つ)","choice1":"眼底検査","choice2":"色覚検査","choice3":"視野検査","choice4":"視力検査","choice5":"細隙灯検査","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1) 暗室で行う 2) 3) 暗室で行う 4) 5) 暗室で行う"},{"year":"2021","category":"医学・医療系","question_number":36,"question_text":"体内から放出される放射線を検出し画像化する検査はどれか。","choice1":"CT","choice2":"MRI","choice3":"PET","choice4":"骨密度検査","choice5":"血管造影検査","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医学・医療系","question_number":37,"question_text":"診断に内視鏡検査の必要が低いのはどれか。","choice1":"胃がん","choice2":"肝臓がん","choice3":"大腸がん","choice4":"胆管がん","choice5":"膀胱がん","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2021","category":"医学・医療系","question_number":38,"question_text":"姑息的治療と対極にある治療はどれか。","choice1":"観血的治療","choice2":"外科的治療","choice3":"根治的治療","choice4":"侵襲的治療","choice5":"非観血的治療","correct_answer":3,"correct_answers":[3],"explanation":"姑息的治療とは、主に患者の苦痛の軽減や一時的な症状改善の目的で行われる治療 1)医療行為のうち、出血を伴う処置のこと 2)がんの3大治療法の1つ、がんや、がんのある臓器を切り取る 3)病気を完全に治すことを期待して行う手術のこと 4)侵襲とは、生体を傷つけることを意味している。 手術による切除や、皮膚・身体の開口部に器具を挿入するなど、身体に負担を与える治療法のこと 5)生体を切開せずに行う処置のことをいい、内科的治療や保存的治療などがこれに該当"},{"year":"2021","category":"医学・医療系","question_number":39,"question_text":"患者による確認が必要なのはどれか。(2つ)","choice1":"看護サマリ","choice2":"退院サマリ","choice3":"手術説明同意書","choice4":"診療情報提供書","choice5":"入院診療計画書","correct_answer":3,"correct_answers":[3,5],"explanation":"正答は3、5。　1)患者の病歴や治療・看護等の情報を要約した書類である。看護要約、退院時サマリー、退院時要約とも呼ばれている 2)入院患者の病歴や、入院時の身体所見、検査所見、入院中に受けた医療内容についてまとめた記録（要約書） 3)医療機関が医療行為を行う前に説明義務を果たし同意を求めるもの 4)医師が他の医師、あるいは医療機関へ患者を紹介する場合に発行する書類 5)医師、看護師、その他必要に応じて関係職種が共同して総合的な診療計画を策定するとともに、 個々の患者の症状に応じた計画を記載すること"},{"year":"2021","category":"医学・医療系","question_number":40,"question_text":"医療法に基づく診療に関する諸記録の法定保存期間はどれか。","choice1":"2年","choice2":"3年","choice3":"5年","choice4":"10年","choice5":"20年","correct_answer":1,"correct_answers":[1],"explanation":"法律により保存年数に違いがあるため注意が必要です。 今回の問題の場合は「医療法」での保存年数のため答えは「2年」となります。 診療に関する諸記録を2年間備えておく必要があります。(医療法21条①九) 諸記録とは具体的には、医療法施行規則20条十において、 「診療に関する諸記録は、過去二年間の病院日誌、各科診療日誌、処方せん、手術記録、看護記録、検査所見記録、エックス線写真、入院患者及び外来患者の数を明らかにする帳簿並びに入院診療計画書とする。」と記載されています。 その他、保存年数に関しては、保険医療養担当規則9条において、 「保険医療機関は、療養の給付の担当に関する帳簿及び書類その他の記録をその完結の日から三年間保存しなければならない。ただし、患者の診療録にあつては、その完結の日から五年間とする。」と記載されています。 参考文献サイト】 法令上作成保存が求められている書類"},{"year":"2021","category":"医学・医療系","question_number":41,"question_text":"下表の検査における感度と特異度の組み合わせで正しいのはどれか。","choice1":"感度67%、特異度60%","choice2":"感度60%、特異度67%","choice3":"感度65%、特異度35%","choice4":"感度38%、特異度17%","choice5":"感度38%、特異度60%","correct_answer":2,"correct_answers":[2],"explanation":"感度…真陽性／（真陽性＋偽陰性） 特異度…真陰性／（偽陽性＋真陰性）"},{"year":"2021","category":"医学・医療系","question_number":42,"question_text":"システマティック・レビューの説明として誤っているのはどれか。","choice1":"診療ガイドラインにしばしば反映される。","choice2":"公開されている文献を対象に行われる。","choice3":"得られた結果のエビデンスレベルはもっとも高い。","choice4":"出版バイアスを排除するためになるべく広く文献を調査する。","choice5":"ランダム化比較試験(RCT)の研究のみを対象として分析を行う。","correct_answer":5,"correct_answers":[5],"explanation":"過去問-2018-問45など システマティック・レビューとは、 バイアスによるデータの偏りを避けるため広く文献を調べて、質の高い研究データを抽出し、分析を行うことである。 導かれた結果はエビデンスレベルがもっとも高く、しばしば診療ガイドラインに反映される。"},{"year":"2021","category":"医学・医療系","question_number":43,"question_text":"臨床試験の過程において、少人数の患者を対象として行うのはどれか。(2つ)","choice1":"検証試験","choice2":"臨床薬理試験","choice3":"探索試験(前期)","choice4":"探索試験(後期)","choice5":"製造販売後臨床試験","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　1)第Ⅲ相試験…多数の患者が対象 2)第Ⅰ相試験…少数の健康成人が対象 3)第Ⅱ相試験…少数の患者が対象　※第Ⅰ相試験で行われる場合もある 4)第Ⅱ相試験…少数の患者が対象 5)第Ⅳ相試験…医薬品の市販後調査"},{"year":"2021","category":"医学・医療系","question_number":44,"question_text":"箱ひげ図では表現できない統計量はどれか。","choice1":"最小値","choice2":"中央値","choice3":"標準偏差","choice4":"四分位範囲","choice5":"第3四分位数","correct_answer":3,"correct_answers":[3],"explanation":"2)中央値とはデータを小さい順に並べたデータのちょうど中央にあるデータのことです。 3) 参考文献サイト】 箱ひげ図とは"},{"year":"2021","category":"医学・医療系","question_number":45,"question_text":"データのばらつきを示す指標はどれか。(2つ)","choice1":"最頻値","choice2":"中央値","choice3":"平均値","choice4":"標準偏差","choice5":"四分位範囲","correct_answer":4,"correct_answers":[4,5],"explanation":"正答は4、5。　補足】 参考文献サイト】 四分位範囲によるデータの散らばりと分散・標準偏差によるデータの散らばり"},{"year":"2021","category":"医学・医療系","question_number":46,"question_text":"母集団の分布を仮定せずに行える検定はどれか。(2つ)","choice1":"F検定","choice2":"符号検定","choice3":"分散分析","choice4":"カイ二乗検定","choice5":"Wilcoxonの順位和検定","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。　過去問-2015-問47など 2)･5)は、元の分布を仮定せずに、各群の観測地の順位分布や大小関係を用いて ２群の差を検定する手法である。"},{"year":"2021","category":"医学・医療系","question_number":47,"question_text":"仮説検定について誤っているのはどれか。","choice1":"有意水準を設定する。","choice2":"対立仮説と帰無仮説を立てる。","choice3":"検定のために使う統計量を決める。","choice4":"観測したデータから検定統計量の値を計算する。","choice5":"検定統計量の値が棄却域に含まれれば対立仮説を棄却する。","correct_answer":5,"correct_answers":[5],"explanation":"「とある仮説に対して、それが正しいのか否かを統計学的に検証する」という推計統計学の手法の一つです。 1) 2) 3) 4) 5)検定統計量の値が棄却域に含まれれば帰無仮説を棄却する。"},{"year":"2021","category":"医学・医療系","question_number":48,"question_text":"DPC対象病院にのみ提出が求められているのはどれか。","choice1":"様式1","choice2":"Dファイル","choice3":"Hファイル","choice4":"外来EF統合ファイル","choice5":"入院EF統合ファイル","correct_answer":2,"correct_answers":[2],"explanation":"1) DPC準備病院を含む調査参加病院が提出。 2) 包括レセプト情報で、DPC対象病院のみが提出する。 3) 対象入院料を算定している病院が提出。 4) DPC対象病院およびデータ提出加算2を算定している病院が提出。 5) 入院医科保険を利用する全患者が提出。"},{"year":"2021","category":"医学・医療系","question_number":49,"question_text":"NDBに格納されているデータはどれか。(2つ)","choice1":"特定健診データ","choice2":"DPC調査データ","choice3":"全国がん登録データ","choice4":"医療保険レセプトデータ","choice5":"介護保険レセプトデータ","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　NDB(National Data Base):レセプト情報・特定検診等情報データベース 1）特定健診とは. 生活習慣病の予防のために、対象者（40歳～74歳）の方にメタボリックシンドロームに着目した健診を行います。"},{"year":"2021","category":"医学・医療系","question_number":50,"question_text":"全国がん登録において、医療機関が患者のがんに関する情報を届け出る先はどこか。","choice1":"厚生労働省","choice2":"日本医師会","choice3":"日本医学連合会","choice4":"国立がん研究センター","choice5":"都道府県に設置されたがん登録室","correct_answer":5,"correct_answers":[5],"explanation":"がん登録等の推進に関する法律に基づき、当該病院等の所在地の都道府県知事に届け出る。 都道府県によって提出する施設は異なるが、都道府県ごとに窓口が設置されている。 全国がん登録届出マニュアル 2016 2019 改訂版 ダウンロード版"},{"year":"2021","category":"医療情報システム系","question_number":1,"question_text":"電子的に作成された文書を印刷して原本とすることができる条件はどれか。","choice1":"そのまま印刷する。","choice2":"印刷して押印する。","choice3":"印刷して電子的文書を削除する。","choice4":"印刷して日付とサインを記載する。","choice5":"印刷して電子的文書に印刷記録を追加する。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":2,"question_text":"診療情報の1次利用にあたるのはどれか。(2つ)","choice1":"裁判所の命令による情報提供","choice2":"経営のための統計資料の作成","choice3":"法令で定められた感染症の保健所への報告","choice4":"検査部門で発生した検査データの診断への活用","choice5":"審査支払機関への診療報酬明細書のよる医療費請求","correct_answer":4,"correct_answers":[4,5],"explanation":"正答は4、5。"},{"year":"2021","category":"医療情報システム系","question_number":3,"question_text":"医療情報倫理について誤っているのはどれか。","choice1":"臨床実習を行う学生にも適用される。","choice2":"人そのものに対する倫理規範と同質である。","choice3":"医療倫理に情報倫理を付加したものである。","choice4":"電子カルテにより行いうる意思決定に関連する。","choice5":"患者個人を記述する情報の集合に対する規範である。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":4,"question_text":"医療情報システム利用者の責務で誤っているのはどれか。","choice1":"必ず自身のIDでログインする。","choice2":"作業を終了する場合や離席する場合は必ずログアウトする。","choice3":"自身でパスワードを管理し、他者に利用されないようにする。","choice4":"電子保存システムに入力した際は確定操作を行い、責任を明示する。","choice5":"利用者が個人的に使用しているソフトウェアを端末にインストールする。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":5,"question_text":"医療情報担当者倫理綱領(Code of Ethics for Health Informatics Professionals)について誤っているのはどれか。","choice1":"医療情報担当者は医療従事者にかかわる責務を負う。","choice2":"医療情報担当者は施設及び雇用者に対する責務を負う。","choice3":"目的の1つは倫理的見識を一般人に明示することである。","choice4":"目的の1つは施設を評価する際の基準として用いることである。","choice5":"医療情報担当者は患者などの記録の対象者に対する責務を負う。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":6,"question_text":"オンライン診療の適切な実施に関する指針(令和元年7月一部改訂)に関して誤っているのはどれか。","choice1":"医師の研修が義務化された。","choice2":"オンライン受診勧奨はオンライン診療に含まれない。","choice3":"急変に対応できる医療機関に当該患者の医療情報が事前に伝達される体制を用意する。","choice4":"視覚及び聴覚を用いる情報通信機器のシステムを使用する汎用サービスの利用は禁止されている。","choice5":"オンライン診療前に作成する診療計画に、自らが対応できない疾患等の場合は対応できる医療機関を明示する。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":7,"question_text":"診療所で利用される医療情報システムについて正しいのはどれか。","choice1":"クラウド型のシステムを利用できる。","choice2":"電子カルテシステムとしてORCAが普及している。","choice3":"レセプト電算処理に対応したシステムは不要である。","choice4":"自作したシステムを利用することは認められていない。","choice5":"多くの診療所で大規模病院と同じシステムが利用されている。","correct_answer":1,"correct_answers":[1],"explanation":"1) 2)日医標準レセプトソフト「ORCA（オルカ）」は、日本医師会が提供する 日本の医療現場のためのレセプトコンピュータ（以下レセコン）です。 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":8,"question_text":"「電子処方箋の運用ガイドライン 第2版」に照らして誤っているのはどれか。","choice1":"患者は薬局にアクセスコードと確認番号を持参する。","choice2":"医療機関は患者にアクセスコードと確認番号を伝える。","choice3":"医療機関は薬局に電子処方箋を電子メールで送信する。","choice4":"医療機関は電子処方箋に電子署名とタイムスタンプ付与を行う。","choice5":"薬局の薬剤師は調剤結果を作成し、電子署名とタイムスタンプ付与を行う。","correct_answer":3,"correct_answers":[3],"explanation":""},{" :""},{"year":"2021","category":"医療情報システム系","question_number":15,"question_text":"医療安全への配慮として適切でないのはどれか。","choice1":"ある患者のカルテを記載中は、別の患者のカルテは参照モードで開く。","choice2":"医師は個々の代行入力内容を確認せずに一覧画面から一括承認できる。","choice3":"血液型は、異なるタイミングで採血した結果が一致してはじめて確定される。","choice4":"電子カルテの画面を閉じると同一患者のPACSの表示画面も連動して閉じる。","choice5":"電子カルテシステムにログインしたまま一定時間操作が行われない場合は、強制的にログオフする。","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":17,"question_text":"注射実施時の3点確認の対象でないのはどれか。(2つ)","choice1":"患者","choice2":"薬剤","choice3":"実施者","choice4":"主治医","choice5":"実施場所","correct_answer":4,"correct_answers":[4,5],"explanation":"正答は4、5。"},{"year":"2021","category":"医療情報システム系","question_number":18,"question_text":"JAHISの基本データセットで、薬剤アレルギー情報に含まれないのはどれか。","choice1":"症状","choice2":"病名","choice3":"発現日","choice4":"情報提供者","choice5":"アレルゲン名称","correct_answer":2,"correct_answers":[2],"explanation":"一般社団法人保健医療福祉情報システム工業会（ＪＡＨＩＳ）は、1994年に設立され、これまで保健医療福祉情報システムに関する標準化を推進し、その普及啓発に努め、技術の向上、品質及び安全性の確保を図ることにより、保健医療福祉情報システム産業の健全な発展と健康で豊かな国民生活の維持向上に貢献できるよう活動しております。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":19,"question_text":"医師事務作業補助者の代行入力について誤っているのはどれか。(2つ)","choice1":"医師事務作業補助者は医師の権限でログインする。","choice2":"代行入力の範囲や運用に関する規定を定めなければならない。","choice3":"医師事務作業補助者の記録を承認することをカウンターサインという。","choice4":"リスクの高いオーダーは代行入力の対象外にすることで安全性を確保できる。","choice5":"医師事務作業補助者が代行で記載した記録を医師は承認しなければならない。","correct_answer":1,"correct_answers":[1,3],"explanation":"正答は1、3。　1) 2) 3)何らかの書類にすでに一方のサインがある場合に、相手にサインを求めるようなとき、相手のサインを「カウンターサイン」と呼びます。 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":20,"question_text":"オーダーエントリシステムについて誤っているのはどれか。","choice1":"利用者認証の機能が実装されている。","choice2":"診療報酬明細書を発行するシステムである。","choice3":"医師は行為の承認、結果の確認などを行う。","choice4":"医師の指示を医療スタッフに伝えるシステムである。","choice5":"入力される情報は診療報酬請求に必要な内容を含んでいる。","correct_answer":2,"correct_answers":[2],"explanation":"オーダーエントリーシステムとは，医療者がその職務に応じた業務をコンピュータ端末で処理することで，正確かつ迅速に画像検査や処方・注射薬などのオーダーデータを伝達し，受け取った部門では遅滞なく業務を開始することで転記作業を減らし，業務遂行時間を短縮することを目標としている．その際に，データベースやネットワークを通して様々な診療情報をリアルタイムに得ることによって診療計画や業務計画に応じたオーダーが行われている．診療科や部門の壁を除き，データの共有化を図ることによって有機的に部門間を結合し，待ち時間の短縮，医療の質の向上など患者サービスの向上を図ることを目的としている 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":21,"question_text":"予約機能が必要なシステムはどれか。(2つ)","choice1":"外来受付システム","choice2":"病名登録システム","choice3":"病理検査システム","choice4":"処方オーダシステム","choice5":"放射線検査システム","correct_answer":1,"correct_answers":[1,5],"explanation":"正答は1、5。"},{"year":"2021","category":"医療情報システム系","question_number":22,"question_text":"病棟指示について誤っているのはどれか。","choice1":"病棟処置オーダは医事会計システムとの連携が不要である。","choice2":"看護師が互いに日常ケアの内容や方法を伝達するために行う。","choice3":"予測指示(条件付き指示)にもとづき看護師は薬剤を投与できる。","choice4":"1回で終了する指示と中止・修正するまで継続する指示が混在する。","choice5":"病棟指示システムでは正確な進捗状況が把握できることが望ましい。","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":23,"question_text":"歯科医療に関するシステムの機能として正しいのはどれか。(2つ)","choice1":"処置の履歴は歯単位で保持する。","choice2":"医科と同じ書式のレセプトを用いる。","choice3":"部位が異なれば病名の重複を認める。","choice4":"部位を選択するとき、複数歯を同時に選べないようにする。","choice5":"歯がない状態(喪失歯)では、病名部位を選択できないようマスタ設定する。","correct_answer":1,"correct_answers":[1,3],"explanation":"正答は1、3。"},{"year":"2021","category":"医療情報システム系","question_number":24,"question_text":"ゼネラルリスクマネージャーが中心となって使用するシステムはどれか。","choice1":"SPDシステム","choice2":"病床管理システム","choice3":"オーダエントリシステム","choice4":"レセプトチェックシステム","choice5":"インシデントレポートシステム","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":25,"question_text":"処方オーダシステムの仕様として適切でないのはどれか。","choice1":"調剤開始後であっても、医師は処方を修正できる。","choice2":"内服薬は、1回量と1日服用回数での表記を標準とする。","choice3":"特別な理由があれば、定められた日数以上の処方ができる。","choice4":"患者の状態に応じて調剤形態(一包化など)の指示ができる。","choice5":"原薬量指示の場合には、それが原薬量であることを明確に伝達できる。","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":26,"question_text":"注射薬の払い出し方法について適切でないのはどれか。","choice1":"払い出しは実施単位で行うことが推奨される。","choice2":"払い出しと実施のタイミングは近いことが望ましい。","choice3":"緊急で使用する定数配置されていない医薬品は、1本渡し方式となる。","choice4":"定数配置されている医薬品を使用する場合は、週末に1週間分まとめてオーダする。","choice5":"締め切り時間内になされたオーダについては、部署ごとに定時に一括で払い出す方式が効率的である。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":27,"question_text":"検体部門検査システムについて正しいのはどれか。","choice1":"検体採取時刻による管理が行われる。","choice2":"検査結果はすべてテキストデータである。","choice3":"検体到着処理を行ってから検査を実施する。","choice4":"同時に依頼された検査はまとめて報告される。","choice5":"同一医療機関の同一検査項目の基準範囲は一定である。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":28,"question_text":"業務フローが他と異なる検体検査オーダはどれか。","choice1":"生化学検査","choice2":"血液凝固検査","choice3":"赤血球沈降速度","choice4":"細菌培養同定検査","choice5":"細菌薬剤感受性検査","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)薬剤感受性検査は，検出された病原菌に対する抗菌薬の効能を定量的に調べる検査である。 具体的には，抗菌薬を培養液で希釈系列を作り，そこに細菌を添加して培養し，菌の発育状況を観察して，一定濃度以下で効果があれば「感受性」，なければ非感受性（耐性）と判別する。"},{"year":"2021","category":"医療情報システム系","question_number":29,"question_text":"臨床検査部門システムについて正しいのはどれか。","choice1":"単一の検査オーダから複数の検査実施結果が出る場合がある。","choice2":"検査情報システムと自動分析機との接続にはDICOMが用いられる。","choice3":"外来迅速検査のオーダ情報は医事会計システムへ連携する必要がない。","choice4":"臨床現場即時検査(POCT; Point of Care Testing)機器はオーダ情報を受け取る。","choice5":"採取管準備システムは、採取管に付けられた番号を読み取り、それを患者IDと関連付ける。","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":30,"question_text":"内視鏡システムについて誤っているのはどれか。","choice1":"洗浄・消毒の履歴管理を行う。","choice2":"病理検査との連携が必要である。","choice3":"放射線画像との連携が必要である。","choice4":"レポートに使用する画像の編集機能が必要である。","choice5":"予約時点で検査か治療かを確定する機能が必要である。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":31,"question_text":"令和2年4月から施行された医療法施行規則の被曝線量管理について誤っているのはどれか。","choice1":"透視装置では線量計の情報を用いることもある。","choice2":"CTの場合、DICOM-RDSRに患者被曝線量が記載されている。","choice3":"DICOM-RDSRに対応していない場合にはDICOM-MPPSを用いる。","choice4":"患者毎の被曝線量を管理し、患者個人の被曝線量を減らすことが目的である。","choice5":"患者毎の被曝線量を管理し、プロトコール毎の被曝線量を減らすことが目的である。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":32,"question_text":"SPDシステムの導入目的でないのはどれか。","choice1":"在庫スペースの削減","choice2":"定数管理に基づく安定した供給","choice3":"余剰在庫、デッドストックの解消","choice4":"発注・検品にかかわる業務の効率化","choice5":"物品の統合・整理による品目の多様化","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":33,"question_text":"診療情報管理部門システムに求められる機能でないのはどれか。","choice1":"がん登録支援","choice2":"DPCコーディング支援","choice3":"診療報酬明細書作成支援","choice4":"紙の診療録のアリバイ管理・貸出管理","choice5":"患者基本情報と退院時要約情報の収集、点検","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":34,"question_text":"医療機関におけるDWHの機能はどれか。(2つ)","choice1":"データの漏洩を防止する。","choice2":"入力データを自動的に標準化できる。","choice3":"研究対象となる症例候補を検索できる。","choice4":"入力途中のデータを判別して自動で抽出できる。","choice5":"症例の基本データセットを統計解析用に出力できる。","correct_answer":3,"correct_answers":[3,5],"explanation":"正答は3、5。　DWH（Data Ware House:データウェアハウス）とは、様々なシステムからデータを集めて整理する、データの「倉庫」です。 DWHではデータが時系列で保存されるため過去のデータ履歴を確認できると同時に、システムごとのデータを集約して全体のデータとして活用でき、より優れた企業の意思決定につながります。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":35,"question_text":"ベンダとの保守契約の締結で誤っているのはどれか。","choice1":"SLAの内容が契約書に組み込まれていることを確認する。","choice2":"保守契約はサーバ系のみとし、端末はスポット対応とする。","choice3":"リモート監視ツールを導入して、一次切り分けをベンダに依頼する。","choice4":"インフラや部門システムの優先度に応じた保守体制のSLAを締結する。","choice5":"ベンダとの対応が可能な各部門の担当者、病棟責任者などで構成される緊急連絡網を構築する。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":36,"question_text":"業務委託と人材派遣に関する記述で正しいのはどれか。","choice1":"人材派遣では派遣先に労働者の雇用責任がある。","choice2":"人材派遣では労働者は派遣元から指揮命令を受ける。","choice3":"業務委託では委託会社が労働者の労務管理責任を負う。","choice4":"業務委託では労働者は委託会社から指揮命令を受ける。","choice5":"業務委託では受託会社が作業の完成についてのすべての責任を負う。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":37,"question_text":"新システム導入時の利用者向け教育について適切でないのはどれか。","choice1":"利用者向け教育は、新システム用各種マスタの作成前に行う。","choice2":"操作研修は日時を決めて行う他、空き時間に各自自習できる環境を準備する。","choice3":"各部署の代表者の出席を必須とし、出席できない利用者への周知を依頼する。","choice4":"システム全般に係る教育と職種毎の内容に特化した教育を分けてスケジュールする。","choice5":"利用者向けの操作研修時に使用する患者として、実在しない研修用のダミーを準備する。","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":38,"question_text":"医療情報システムの利用者教育について適切でないのはどれか。","choice1":"個人情報保護に関する教育を定期的に実施する。","choice2":"教育訓練の周知体制について運用管理規定に記載する。","choice3":"真正性を担保するための運用ルールについて教育する。","choice4":"病院が作成した運用マニュアルを用いて、操作訓練を実施する。","choice5":"ベンダが作成した操作マニュアルの自習のみで業務に就かせる。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":39,"question_text":"機能設計(Function Design: FD)フェーズが完了し、プログラム製造に入るところで、病院内で重要な機能修正の要望があった。病院側の医療情報技師の対応として適切なのはどれか。","choice1":"既にFDが終了しているため、対応はできないことを院内に周知する。","choice2":"ベンダの担当SEに仕様追加を増額なしで対応してもらうように依頼する。","choice3":"既にFDが終了しているため対応は困難であり、当面誰にも言わないでおく。","choice4":"院内で変更管理委員会にはかった上で、ベンダの担当営業に見積もりを依頼する。","choice5":"ベンダの対応営業に見積もりを依頼し、提示された金額に基づいて変更作業を進める。","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":40,"question_text":"WTO政府調達協定に基づいた病院情報システムの調達において、通常調達仕様書に含まれないのはどれか。","choice1":"仕様書概要","choice2":"接続機器一式","choice3":"調達予定金額","choice4":"ハードウェアの技術要件","choice5":"ソフトウェアの技術要件","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":41,"question_text":"情報システムの運用管理に関わる人とその役割について誤っている組み合わせはどれか。","choice1":"システムエンジニア　　ー　消耗品の補給","choice2":"カスタマーエンジニア　ー　システムの保守","choice3":"利用者　　　　　　　　ー　運用管理規定の順守","choice4":"ヘルプデスク　　　　　ー　システム操作のトラブル対応","choice5":"CIO　　　　　　　　　 ー　組織全体の情報管理業務に関する運用に関与","correct_answer":1,"correct_answers":[1],"explanation":"システムエンジニアはシステム設計を行う。必要に応じて機器の設置場所や使用状況の調査を行うこともあるが、消耗品の補給は行わない。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":42,"question_text":"病院情報システム運用管理規定への記載が必須ではないのはどれか。","choice1":"患者や利用者からの苦情に対する受付体制","choice2":"システムを構成する具体的な機器名やソフトウェア名","choice3":"監査計画立案、実施、報告書作成と運営責任者への報告","choice4":"運用上必要な作業手順書の整備と利用者の教育・訓練の実施","choice5":"システム管理者や監査責任者からの問題点の報告に対する対応","correct_answer":2,"correct_answers":[2],"explanation":"具体的な機器名やソフトウェア名は求められていない。"},{"year":"2021","category":"医療情報システム系","question_number":43,"question_text":"病院情報システムの導入効果を測る評価項目の組み合わせのうち適切でないのはどれか。","choice1":"患者満足度　ー　診察待ち時間","choice2":"経営状況　　ー　看護師の勤務時間","choice3":"業務効率　　ー　記録作成に要する時間","choice4":"作業確実性　ー　診療報酬請求の査定・返戻の件数","choice5":"医療安全　　ー　インシデント・アクシデントの発生件数","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":44,"question_text":"病院情報システムの改修について正しいのはどれか。","choice1":"システム改修による運用の変更は生じない。","choice2":"運用の変更でシステム改修を回避することがある。","choice3":"費用対効果の低いものからシステム改修を実施する。","choice4":"要求仕様書を満たすシステムであればシステム改修の必要は生じない。","choice5":"診療報酬改定に伴うシステム改修は医事会計システムのみに発生する。","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":45,"question_text":"部門のシステムを変更した場合、本番系へのリリースを最終的に承認するのは誰か。","choice1":"部門の申請者自身","choice2":"部門の管理責任者","choice3":"プロジェクトマネージャ","choice4":"医療情報システム管理部門の職員","choice5":"医療情報システム管理部門の管理責任者","correct_answer":5,"correct_answers":[5],"explanation":"部門のシステムの変更であるが本番系の最終リリースの承認者は医療情報システム管理部門の管理責任者である。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":46,"question_text":"情報機器作業のための環境として適切なのはどれか。","choice1":"一連続作業時間を2時間に設定する。","choice2":"画面との視距離を15cmに設定する。","choice3":"キーボードにパームレスト、リストレストを用意する。","choice4":"パソコンのディスプレイの中心を目の高さに設定する。","choice5":"書類上の照度がディスプレイの照度の2倍になるように設定する。","correct_answer":3,"correct_answers":[3],"explanation":"1)一連続作業時間は１時間を超えない。 2)ディスプレイはおおむね、40cm以上の視距離が確保できるようにする。 3) 4)ディスプレイはその画面の上端が目の高さとほぼ同じか、やや下になる高さにすることが望ましい。 5)書類上の照度がディスプレイの照度と大きく異なることは適切でない。"},{"year":"2021","category":"医療情報システム系","question_number":47,"question_text":"システム障害発生時、病院のシステム担当が最初に行うべきことはどれか。","choice1":"ベンダの営業担当者に連絡する。","choice2":"マスコミ向けの報告文書を作成する。","choice3":"各部署から情報を収集し、状況把握を行う。","choice4":"影響範囲、復旧見込みなどを病院内にアナウンスする。","choice5":"システムを所管する責任者に状況を報告し、指示を仰ぐ。","correct_answer":3,"correct_answers":[3],"explanation":"システム障害発生時は、影響範囲がどの程度かを確認しなければ対策を講じることが不可能であるため、3）を実施する。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":48,"question_text":"IHEについて誤っているのはどれか。","choice1":"統合プロファイル内の各機能を提供する「アクタ」同士の通信をトランザクションと呼ぶ。","choice2":"地域医療連携における情報連携基盤技術仕様はさまざまな統合プロファイルを含んでいる。","choice3":"システム導入時にIHEを参考にすることで、システム構成の選択肢が増えることが期待できる。","choice4":"システム連携を実現するための標準規格の使い方を示したガイドラインを統合プロファイルと呼ぶ。","choice5":"システムや機器同士の接続試験を行うコネクタソンを開催し、接続性のとれたシステムや機器を認定する。","correct_answer":4,"correct_answers":[4],"explanation":"IHEとは Integrating the Healthcare Enterprise の略で医療情報システムの相互接続性を推進する国際的なプロジェクトです。 IHE という言葉を初めて聞く方にとっては、これだけで何であるかを理解することは困難でしょう。そもそも医療情報システムは医療を支える裏方のような存在であり、医療行為を行う直接的なツールではないため、医療現場で働く医療従事者にとっては関心の希薄な分野ではないでしょうか。しかし、施設の規模や場所を問わず、医療情報システムはライフラインのように医療を行う上で欠かせないシステムのひとつなのです。 近年、医療の IT 化が進み、専門分野ごとのIT 化だけではなく施設全体のIT 化という視点からのシステム連携や、他施設とのシステム連携に対するニーズが高まっています。これらを実現する場合も標準規格を円滑に利用することが可能であれば、打ち合わせやカスタマイズの省略が可能となり、導入費用の抑制や将来的な汎用性に期待を持つことが出来るのです。IHE では、これらの標準規格の使い方が定まっていないことに起因する問題を解決するために、あらかじめ標準規格の使い方の「ガイドライン」を提案しています。IHE の示したガイドラインを利用することで、施設やシステムごとに細かな設定やカスタマイズを行うことなく、機器やシステムメーカーを問わずに連携できるシステム（マルチベンダシステムという）の構築が可能となり、開発期間や開発費用の抑制が可能となります。 1) 2) 3) 4)医療現場での一般的なワークフロー分析の結果である業務シナリオを「統合プロファイル」と呼び、その統合プロファイルに沿ったシステム連携を実現するための標準規格の使い方を示したガイドラインのことを「テクニカルフレームワーク」と呼んでいます。 プロファイルとは、輪郭、横顔、分析結果、略歴などの意味を持つ英単語。 一般の外来語としては「プロフィール」（またはプロフィル）と表記するのが一般的だが、これは英語の “profile” に対応するフランス語 “profil” が由来で、人物紹介などの意味で用いられる。 5)"},{"year":"2021","category":"医療情報システム系","question_number":49,"question_text":"他院から提供された画像CDのデータを取り込みできない場合、原因から除外できるのはどれか。","choice1":"提供された媒体に傷がある。","choice2":"患者IDが自院のIDと異なっている。","choice3":"過去に取り込み済みの画像が含まれている。","choice4":"IHE-PDI規格以外の形式で保存されている。","choice5":"DICOMに含まれない特殊なファイル形式の画像が含まれている。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)患者IDが自院のIDと異なっている場合でも画像データの参照、取り込みは可能である。 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":50,"question_text":"電子レセプト(医科)で使用される基本マスタでないのはどれか。","choice1":"医薬品マスタ","choice2":"修飾語マスタ","choice3":"傷病名マスタ","choice4":"特定機材マスタ","choice5":"看護実践用語標準マスタ","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)看護実践用語標準マスタは、MEDIS-DCが提供提供しているが、電子レセプトの基本マスタではない。"},{"year":"2021","category":"医療情報システム系","question_number":51,"question_text":"医薬品でJANコードに含まれず、GS1-128コードに含まれている項目はどれか。","choice1":"価格","choice2":"製造者","choice3":"製品名","choice4":"使用期限","choice5":"包装単位","correct_answer":4,"correct_answers":[4],"explanation":"JANコードには、有効期限、数量、製造番号がないため、選択肢にある使用期限が正解 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":52,"question_text":"放射線部門システムについて誤っているのはどれか。","choice1":"放射線画像検査種のコードにJJ1017がある。","choice2":"モダリティに患者情報をJLAC10で伝達する。","choice3":"モダリティから検査進捗情報をDICOMで受け取る。","choice4":"検査ごとの照射線量をDICOMでPACSに保存可能である。","choice5":"オーダエントリシステムからオーダ情報をHL7で受け取る。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)JLAC10とは、臨床検査項目分類コードのことである ｢JLAC10コードは5つの要素区分よりなり，それぞれ、(1)分析物コード5桁，(2)識別コード4桁，(3)材料コード3桁， (4)測定法コード3桁，(5)結果識別コード2桁の17桁にて生成される。 基本的に“分析物コード”により整理分類され，検査材料あるいは測定法等の別を所定の付加コードとの組み合わせにお いて認識する。 3)DICOMはDigital Imaging and Communications in Medicineの頭文字で、「ダイコム」と読みます。CT・MRI・内視鏡・超音波などの医用画像診断装置、医用画像プリンタ、医用画像システム、医療情報システムなどの間でデジタル画像データや関連する診療データを通信したり、保存したりする方法を定めた国際標準規格です。 4) 5)HL7（HealthLevelSeven）とは、1987年に米国で規格化された保健医療情報交換の標準規格、HL7標準(HL7Standard)データ形式である。HL7の名称の意味は、医療情報システム間のISO-OSI第7層上でのメッセージトランザクションに由来する。"},{"year":"2021","category":"医療情報システム系","question_number":53,"question_text":"標準規格とその内容の説明の組み合わせのうち正しいのはどれか。","choice1":"SNOMED-CT　ー　国際的な医療用語集","choice2":"CDA　　　　ー　臨床試験データの標準規格","choice3":"CDISC　　　ー　臨床文書の構造に関する規格","choice4":"LOINC　　　ー　看護実践を記述する標準用語集","choice5":"ICNP　　　 ー　検体検査や生理機能検査を表現するコードセット","correct_answer":1,"correct_answers":[1],"explanation":"1) 2)診療文書標準HL7 CDA(Clinical Document Architecture) 3)CDISC（国際的臨床試験データ標準を作成するコンソーシアム） 4)LOINCとは、Logical Observation Identifier Names and Codesの略で、Regenstrief Instituteが開発・管理する検査、診察等で得られる情報の項目名とそのコードの規格です。 5)ICNPとは，看護実践国際分類（International Classification for Nursing Practice）の略であり，国際看護師協会（ICN）が1989年から始めたプロジェクトである．ICNPは，看護現象と看護行為の2つからなる用語集であり，それぞれの8つの軸から単語を選ぶことによって，多くの概念を表現できる特徴がある．ICNPは，そこに掲載されている用語を使うためにつくられたのではなく，さまざまな用語集の用語を互いに関連づけるために作成された用語集である．"},{"year":"2021","category":"医療情報システム系","question_number":54,"question_text":"患者本人の同意がなくともオプトアウトにより情報提供が可能となるのはどれか。","choice1":"裁判所の令状によるカルテ開示","choice2":"児童虐待疑い所見の児童相談所への通告","choice3":"大規模災害時における家族への存否情報の提供","choice4":"指定感染症患者の診断の都道府県知事への届け出","choice5":"認定匿名加工医療情報作成事業者への患者情報の提供","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":55,"question_text":"医療情報システムの安全管理に関するガイドライン(第5.1版)について誤っているのはどれか。","choice1":"医療情報システムがサイバー攻撃を受けたときは厚生労働省へ報告する義務がある。","choice2":"秘密鍵の管理は認証局が定める証明書ポリシー等に基づく鍵管理の要件を満たす必要がある。","choice3":"外部保存受託事業者が取得したサービス利用者のCookie情報は第三者提供することができる。","choice4":"令和9年時点で稼働が想定されるシステムを今後導入する際に、二要素認証対応システムの採用を求めている。","choice5":"英数字、記号を混在させた13文字以上の推定困難な文字列をパスワードにしている場合は定期的な変更を求めていない。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":56,"question_text":"医療情報システムの整備・運用管理における「組織的安全管理対策」に該当するのはどれか。","choice1":"利用者への教育","choice2":"サーバ室入退室の管理","choice3":"利用者のアクセスログの監視","choice4":"機器や装置等の物理的な盗難対策の実施","choice5":"医療情報システム運用管理規定の整備及び適切な運用","correct_answer":5,"correct_answers":[5],"explanation":"1)人的安全対策 2)物理的安全対策 3)技術的安全対策 4)物理的安全対策 5)"},{"year":"2021","category":"医療情報システム系","question_number":57,"question_text":"医療情報システムの安全管理に関するガイドラインの非常時の対応についてのチェックリストについて誤っているのはどれか。","choice1":"正常復帰時に代替手段で運用した間のデータ整合性を図る規約がある。","choice2":"非常時用ユーザアカウントはいつでもだれでも使えるように常に掲示している。","choice3":"BCPの一環として「非常時」と判断する仕組み、正常復帰時の手順を設けている。","choice4":"サイバー攻撃等で医療サービス提供体制に支障が発生する場合の措置を規定している。","choice5":"組織全体のBCPと整合のとれた医療情報システムの非常時における事業継続計画を策定している。","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2021","category":"医療情報システム系","question_number":58,"question_text":"病院情報システムの「真正性」確保に直接関連するのはどれか。(2つ)","choice1":"IDと指紋で利用者認証を行う。","choice2":"外部保存の管理を第三者に委ねる。","choice3":"いつでも診療データが確認できるようにする。","choice4":"データの自動バックアップシステムを用意する。","choice5":"データ保存時に自動的にタイムスタンプを付ける。","correct_answer":1,"correct_answers":[1,5],"explanation":"正答は1、5。　電磁保存の３基準である「真正性」とは、正当な権限で作成された記録に対し、虚偽入力、書き換え、消去及び混同が防止されており、かつ、第三者から見て作成の責任が明確であることである。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":59,"question_text":"HPKIで確認できるのはどれか。","choice1":"患者属性","choice2":"保険者の種類","choice3":"医療機関の種別","choice4":"医療従事者の資格","choice5":"所属医療機関の名称","correct_answer":4,"correct_answers":[4],"explanation":"HPKIとは、保健医療福祉分野の公開鍵基盤（ Healthcare Public Key Infrastructure ）の略称で、医療現場において、公的資格の確認機能を有する電子署名や電子認証を行う基盤です。厚生労働省において基盤の設置要件等を策定しており、現在は日本医師会、日本薬剤師会、医療情報システム開発センターにおいて、医師等の資格確認を行うためのHPKIカードを発行しています。 1) 2) 3) 4) 5)"},{"year":"2021","category":"医療情報システム系","question_number":60,"question_text":"医療機器に該当するのはどれか。","choice1":"健診結果管理プログラム","choice2":"糖尿病の発症予測ツール","choice3":"療養指導用のプログラム","choice4":"診療記録の保存・管理プログラム","choice5":"治療計画方法の決定を支援するプログラム","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2022","category":"情報処理技術系","question_number":1,"question_text":"10進数の101を2進数で表したのはどれか。","choice1":"1100101","choice2":"1100011","choice3":"1111001","choice4":"1111101","choice5":"1111110","correct_answer":1,"correct_answers":[1],"explanation":"2進数"},{"year":"2022","category":"情報処理技術系","question_number":2,"question_text":"読取りに青色半導体レーザを用いなければならないのはどれか。","choice1":"CD","choice2":"DVD","choice3":"ICカード","choice4":"SDメモリカード","choice5":"Blu-ray Disc","correct_answer":5,"correct_answers":[5],"explanation":"外部記憶装置"},{"year":"2022","category":"情報処理技術系","question_number":3,"question_text":"フラッシュメモリについて正しいのはどれか。","choice1":"揮発性である。","choice2":"高速回転する。","choice3":"書き換えできる。","choice4":"磁気で読み出す。","choice5":"ランダムアクセスができない。","correct_answer":3,"correct_answers":[3],"explanation":"フラッシュメモリ"},{"year":"2022","category":"情報処理技術系","question_number":4,"question_text":"10進表記の倍数と情報の単位の接 }

function saveQuestions() {
  localStorage.setItem(QUESTIONS_KEY, JSON.stringify(questions));
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function qId(q) {
  return `${q.year}_${q.question_number}_${q.category}`;
}

// ========== SCREENS ==========
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');
  currentScreen = name;
  const titles = { home: '医療情報技師 過去問', quiz: 'クイズ', result: '結果', review: '間違えた問題', import: '問題インポート' };
  document.getElementById('pageTitle').textContent = titles[name] || '医療情報技師 過去問';
  if (name === 'home') updateHomeStats();
  if (name === 'review') renderReview();
}

// ========== HOME ==========
function updateHomeStats() {
  const total = questions.length;
  const studied = Object.keys(progress).length;
  const correct = Object.values(progress).filter(p => p && p.lastCorrect).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statStudied').textContent = studied;
  document.getElementById('statCorrect').textContent = correct;
  renderFilters();
}

function renderFilters() {
  const years = [...new Set(questions.map(q => q.year).filter(Boolean))].sort((a,b) => b-a);
  const cats = [...new Set(questions.map(q => q.category).filter(Boolean))].sort();

  const yf = document.getElementById('yearFilter');
  yf.innerHTML = '<button class="filter-chip '+(selectedYear===''?'active':'')+'" onclick="setYear(\'\')">全年度</button>';
  years.forEach(y => {
    yf.innerHTML += `<button class="filter-chip ${selectedYear===y?'active':''}" onclick="setYear('${y}')">${y}年</button>`;
  });

  const cf = document.getElementById('catFilter');
  cf.innerHTML = '<button class="filter-chip '+(selectedCat===''?'active':'')+'" onclick="setCat(\'\')">全カテゴリ</button>';
  cats.forEach(c => {
    cf.innerHTML += `<button class="filter-chip ${selectedCat===c?'active':''}" onclick="setCat('${encodeURIComponent(c)}')">${c}</button>`;
  });
}

function setYear(y) { selectedYear = y; renderFilters(); }
function setCat(c) { selectedCat = decodeURIComponent(c); renderFilters(); }

// ========== QUIZ ==========
function startQuiz(mode) {
  let pool;
  if (mode === 'wrong') {
    pool = questions.filter(q => {
      const p = progress[qId(q)];
      return p && !p.lastCorrect;
    });
    if (pool.length === 0) {
      showToast('間違えた問題はありません！');
      return;
    }
  } else {
    pool = questions.filter(q => {
      if (selectedYear && q.year !== selectedYear) return false;
      if (selectedCat && q.category !== selectedCat) return false;
      return true;
    });
    if (pool.length === 0) {
      showToast('問題がありません。フィルタを変更してください。');
      return;
    }
    // Shuffle
    pool = [...pool].sort(() => Math.random() - 0.5);
  }

  currentQuiz = pool;
  currentIdx = 0;
  quizCorrect = 0;
  document.getElementById('quizMode').textContent = mode === 'wrong' ? '苦手問題' : '通常モード';
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = currentQuiz[currentIdx];
  if (!q) { showResult(); return; }
  const total = currentQuiz.length;

  document.getElementById('progressText').textContent = `${currentIdx+1} / ${total}`;
  document.getElementById('progressFill').style.width = `${(currentIdx+1)/total*100}%`;
  document.getElementById('questionMeta').textContent = `${q.year}年 ${q.category} 第${q.question_number}問`;
  document.getElementById('questionText').textContent = q.question_text;

  const choices = [q.choice1, q.choice2, q.choice3, q.choice4, q.choice5].filter(c => c && c.trim());
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${i+1}. ${c}`;
    btn.onclick = () => selectAnswer(i+1, q);
    choicesEl.appendChild(btn);
  });

  document.getElementById('resultBadge').style.display = 'none';
  document.getElementById('explanationBox').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
}

function selectAnswer(selected, q) {
  const correct = q.correct_answer;
  const isCorrect = selected === correct;
  if (isCorrect) quizCorrect++;

  // Update progress
  const id = qId(q);
  if (!progress[id]) progress[id] = { attempts: 0, correct: 0, lastCorrect: false };
  progress[id].attempts++;
  if (isCorrect) progress[id].correct++;
  progress[id].lastCorrect = isCorrect;
  saveProgress();

  // Color choices
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i+1 === correct) btn.classList.add('correct');
    else if (i+1 === selected && !isCorrect) btn.classList.add('wrong');
  });

  // Result badge
  const badge = document.getElementById('resultBadge');
  badge.style.display = 'block';
  badge.className = 'result-badge ' + (isCorrect ? 'correct' : 'wrong');
  badge.textContent = isCorrect ? '✓ 正解！' : '✗ 不正解';

  // Explanation
  if (q.explanation) {
    document.getElementById('explanationText').textContent = q.explanation;
    document.getElementById('explanationBox').style.display = 'block';
  }

  // Next button
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIdx+1 < currentQuiz.length ? '次の問題へ →' : '結果を見る';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= currentQuiz.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  showScreen('result');
  const total = currentQuiz.length;
  const pct = Math.round(quizCorrect / total * 100);
  document.getElementById('resultScore').textContent = `${quizCorrect}/${total}`;
  document.getElementById('resultPct').textContent = `正答率 ${pct}%`;
  const msgs = [
    [90, '素晴らしい！ほぼ完璧です！🎉'],
    [70, 'よくできました！引き続き頑張りましょう。'],
    [50, 'もう少し。苦手問題を復習しましょう。'],
    [0,  '基礎から復習しましょう。']
  ];
  document.getElementById('resultMsg').textContent = (msgs.find(([t]) => pct >= t) || msgs[msgs.length-1])[1];
}

// ========== REVIEW ==========
function renderReview() {
  const wrong = questions.filter(q => {
    const p = progress[qId(q)];
    return p && !p.lastCorrect;
  });
  const el = document.getElementById('reviewList');
  if (wrong.length === 0) {
    el.innerHTML = '<div class="empty-msg">まだ間違えた問題はありません。<br>クイズを解いて学習を始めましょう！</div>';
    return;
  }
  el.innerHTML = wrong.map(q => {
    const choices = [q.choice1, q.choice2, q.choice3, q.choice4, q.choice5].filter(c=>c&&c.trim());
    const ans = choices[q.correct_answer-1] || '';
    const p = progress[qId(q)];
    return `<div class="review-item">
      <div class="review-meta">
        <span>${q.year}年 ${q.category} 第${q.question_number}問</span>
        <span>${p ? p.attempts+'回中'+p.correct+'回正解' : ''}</span>
      </div>
      <div class="review-q">${q.question_text}</div>
      <div class="review-ans">正解: ${q.correct_answer}. ${ans}</div>
      ${q.explanation ? `<div class="review-exp">${q.explanation}</div>` : ''}
    </div>`;
  }).join('');
}

// ========== IMPORT ==========
function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('配列形式のJSONが必要です');
      questions = data;
      saveQuestions();
      showToast(`${data.length} 問をインポートしました！`);
      showScreen('home');
    } catch(err) {
      showToast('エラー: ' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  event.target.value = '';
}

// ========== UTILS ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function confirmReset() {
  if (confirm('学習履歴を全てリセットしますか？')) {
    progress = {};
    saveProgress();
    showToast('進捗をリセットしました');
    updateHomeStats();
  }
}

// ========== INIT ==========
loadData();
updateHomeStats();
</script>
