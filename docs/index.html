<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1565C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>医療情報技師 過去問</title>
<style>
  :root {
    --primary: #1565C0;
    --primary-light: #D6E4FF;
    --primary-dark: #003c8f;
    --correct: #2E7D32;
    --correct-bg: #E8F5E9;
    --wrong: #C62828;
    --wrong-bg: #FFEBEE;
    --surface: #F5F7FF;
    --card: #FFFFFF;
    --text: #1C1B1F;
    --text-sub: #6B7280;
    --border: #E0E0E0;
    --radius: 14px;
    --shadow: 0 2px 8px rgba(0,0,0,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { background: var(--primary); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .header h1 { font-size: 17px; font-weight: 700; flex: 1; }
  .header-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }

  /* Bottom Nav */
  .bottom-nav { display: flex; background: #fff; border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px 14px; border: none; background: none; cursor: pointer; color: var(--text-sub); font-size: 10px; transition: color 0.2s; }
  .nav-btn.active { color: var(--primary); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* Main */
  main { flex: 1; padding: 16px; padding-bottom: 80px; max-width: 600px; margin: 0 auto; width: 100%; }

  /* Screen management */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Cards */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--card); border-radius: 12px; padding: 14px 8px; text-align: center; box-shadow: var(--shadow); }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

  /* Filters */
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; color: var(--text); transition: all 0.15s; white-space: nowrap; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Buttons */
  .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
  .btn-outline:active { background: var(--primary-light); }
  .btn-tonal { background: var(--primary-light); color: var(--primary-dark); }
  .btn-sm { padding: 10px; font-size: 14px; }
  .btn + .btn { margin-top: 8px; }

  /* Quiz */
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .progress-text { font-size: 13px; color: var(--text-sub); font-weight: 600; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }

  .question-card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); min-height: 100px; }
  .question-meta { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }
  .question-text { font-size: 16px; line-height: 1.7; font-weight: 500; }

  .choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .choice-btn { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--border); background: #fff; font-size: 15px; text-align: left; cursor: pointer; line-height: 1.5; transition: all 0.15s; color: var(--text); }
  .choice-btn:active:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
  .choice-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); font-weight: 600; }
  .choice-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .choice-btn:disabled { cursor: default; }

  .result-badge { text-align: center; font-size: 22px; font-weight: 800; padding: 8px; margin-bottom: 12px; border-radius: 10px; }
  .result-badge.correct { background: var(--correct-bg); color: var(--correct); }
  .result-badge.wrong { background: var(--wrong-bg); color: var(--wrong); }

  .explanation { background: #F8F9FA; border-left: 4px solid var(--primary); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; line-height: 1.7; color: var(--text); margin-bottom: 12px; }
  .explanation-label { font-weight: 700; color: var(--primary); margin-bottom: 6px; font-size: 13px; }

  /* Result screen */
  .result-screen { text-align: center; padding: 20px 0; }
  .score-circle { width: 140px; height: 140px; border-radius: 50%; background: var(--primary-light); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 20px; border: 4px solid var(--primary); }
  .score-num { font-size: 38px; font-weight: 800; color: var(--primary); }
  .score-label { font-size: 13px; color: var(--text-sub); }
  .score-pct { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .score-msg { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; }

  /* Review */
  .review-item { background: var(--card); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .review-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .review-q { font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
  .review-ans { font-size: 13px; color: var(--correct); font-weight: 600; }
  .review-exp { font-size: 13px; color: var(--text-sub); margin-top: 6px; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 8px; }
  .empty-msg { text-align: center; color: var(--text-sub); padding: 60px 20px; font-size: 15px; line-height: 1.8; }

  /* Import */
  .import-area { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s; }
  .import-area:hover { border-color: var(--primary); }
  .import-area input { display: none; }
  .import-icon { font-size: 36px; margin-bottom: 8px; }
  .import-text { font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
  .import-sub { font-size: 13px; color: var(--text-sub); }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }

  @media (max-width: 360px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .stat-num { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="pageTitle">医療情報技師 過去問</h1>
</div>

<main>
  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">総問題数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statStudied">0</div>
        <div class="stat-label">学習済み</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statCorrect">0</div>
        <div class="stat-label">正解済み</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;">年度</div>
      <div class="filter-row" id="yearFilter"></div>
      <div style="font-size:14px;font-weight:700;margin:12px 0 10px;">カテゴリ</div>
      <div class="filter-row" id="catFilter"></div>
    </div>

    <button class="btn btn-primary" onclick="startQuiz('all')">クイズを開始</button>
    <button class="btn btn-outline" onclick="startQuiz('wrong')">苦手問題を復習</button>
    <button class="btn btn-tonal" onclick="showScreen('import')" style="margin-top:8px;">問題をインポート (JSON)</button>
    <button class="btn" style="background:none;color:var(--text-sub);font-size:13px;padding:10px;" onclick="confirmReset()">進捗をリセット</button>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz" class="screen">
    <div class="progress-row">
      <span class="progress-text" id="progressText">1 / 10</span>
      <span style="font-size:12px;color:var(--text-sub);" id="quizMode"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>

    <div class="question-card">
      <div class="question-meta" id="questionMeta"></div>
      <div class="question-text" id="questionText"></div>
    </div>

    <div id="resultBadge" style="display:none;" class="result-badge"></div>

    <div class="choices" id="choices"></div>

    <div id="explanationBox" style="display:none;">
      <div class="explanation">
        <div class="explanation-label">【解説】</div>
        <div id="explanationText"></div>
      </div>
    </div>

    <button class="btn btn-primary" id="nextBtn" style="display:none;" onclick="nextQuestion()">次の問題へ →</button>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="result-screen">
      <div class="score-circle">
        <div class="score-num" id="resultScore">0/0</div>
        <div class="score-label">問正解</div>
      </div>
      <div class="score-pct" id="resultPct">正答率 0%</div>
      <div class="score-msg" id="resultMsg"></div>
      <button class="btn btn-primary" onclick="startQuiz('wrong')" style="margin-bottom:8px;">苦手問題を復習</button>
      <button class="btn btn-outline" onclick="showScreen('home')">ホームに戻る</button>
    </div>
  </div>

  <!-- REVIEW -->
  <div id="screen-review" class="screen">
    <div id="reviewList"></div>
  </div>

  <!-- IMPORT -->
  <div id="screen-import" class="screen">
    <div class="card">
      <label class="import-area" id="importArea">
        <input type="file" accept=".json,application/json" id="fileInput" onchange="handleFileImport(event)">
        <div class="import-icon">📂</div>
        <div class="import-text">JSONファイルを選択</div>
        <div class="import-sub">スクレイパーで生成した questions.json</div>
      </label>
      <div style="font-size:13px;color:var(--text-sub);line-height:1.8;">
        <b>JSONフォーマット:</b><br>
        <code style="font-size:12px;background:#f5f5f5;padding:2px 6px;border-radius:4px;">year, category, question_number,<br>question_text, choice1〜4, correct_answer, explanation</code>
      </div>
    </div>

    <div class="card" style="background:#FFF9C4;">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px;">スクレイパーの実行方法</div>
      <div style="font-size:13px;line-height:1.8;color:#555;">
        1. PCで <code>scraper/scraper.py</code> を実行<br>
        2. 生成された <code>questions.json</code> をこの画面でインポート<br>
        3. 問題が自動保存されます
      </div>
    </div>

    <button class="btn btn-outline btn-sm" onclick="showScreen('home')">← 戻る</button>
  </div>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="showScreen('home')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    ホーム
  </button>
  <button class="nav-btn" id="nav-review" onclick="showScreen('review')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    復習
  </button>
  <button class="nav-btn" id="nav-import" onclick="showScreen('import')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    インポート
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ========== DATA ==========
const STORAGE_KEY = 'medquiz_v1';
const QUESTIONS_KEY = 'medquiz_questions_v1';

// 内蔵サンプル問題
const BUILTIN_QUESTIONS = [{"year":"2016","category":"情報処理技術系","question_number":1,"question_text":"画像データの解像度を表す単位はどれか。","choice1":"avi","choice2":"bps","choice3":"pixel","choice4":"ppm","choice5":"rpm","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　1)動画ファイルの形式 2)通信回線などのデータ伝送速度の単位 3)コンピュータで画像を扱うときの最小単位 4)プリンターの印刷速度を表す単位 5)回転する物体などが1分間に何回転するかを表す単位 『ピクセルズ・パー・メートル(ppm)』というのがあるので、４も正解。 この問題は「正解肢が1つでない」という理由で削除問題になった(全員正解)。"},{"year":"2016","category":"情報処理技術系","question_number":2,"question_text":"16進数の「36」と「25」の足し算の結果を2進数で表したのはどれか。","choice1":"00111101","choice2":"01011011","choice3":"01101011","choice4":"10101001","choice5":"10110110","correct_answer":2,"correct_answers":[2],"explanation":"16進数の「36」と「25」の足し算の結果は、桁ごとの和で「5B」。 「5」は2進数で0101、「B」は2進数で1011と表記でき、結合すると01011011となります。"},{"year":"2016","category":"情報処理技術系","question_number":3,"question_text":"AとBの論理演算について正しいのはどれか。","choice1":"A=0, B=1の場合、NANDの結果は0","choice2":"A=0, B=1の場合、XORの結果は0","choice3":"A=1, B=0の場合、ORの結果は0","choice4":"A=1, B=0の場合、XORの結果は0","choice5":"A=1, B=1の場合、NANDの結果は0","correct_answer":5,"correct_answers":[5],"explanation":"OR:論理和 NOR：否定論理和 AND：論理積 NAND：否定論理積 XOR：排他的論理和 初級シスアド講座 論理演算"},{"year":"2016","category":"情報処理技術系","question_number":4,"question_text":"単一の文字コード体系で多言語文字を取り扱うための規格はどれか。","choice1":"EUC","choice2":"ASCII","choice3":"Unicode","choice4":"JIS2004","choice5":"Shift-JIS","correct_answer":3,"correct_answers":[3],"explanation":"1)UNIX系OSで標準的に使われる文字コード規格の一つ。 国内では、日本語を扱う”日本語EUC”あるいは”EUC-JP”を指すことが多い。 2)7bitの文字コードで、アルファベットの大文字小文字・数字・記号などの 印字可能文字とコンピュータ制御文字の128種類の文字が定義されている。 3)多言語の文字を単一の文字コードで取り扱う 4)JIS漢字コード（日本工業規格の、漢字などの文字コード）規格の一つ。 5)日本語を含む文字列を表現するために用いられる文字コードの一つ。"},{"year":"2016","category":"情報処理技術系","question_number":5,"question_text":"複数台のハードディスクを組み合わせ、図のようなデータの記録を行う方式はどれか。","choice1":"RAID 0","choice2":"RAID 1","choice3":"RAID 5","choice4":"RAID 6","choice5":"RAID 10","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":6,"question_text":"補助記憶装置について正しいのはどれか。","choice1":"DVD-ROM：ディスク表面の磁性体に情報を記録する。","choice2":"HDD：ディスクに刻んだ凹凸で情報を記録する。","choice3":"SDメモリーカード：赤外線を使って情報を記録する。","choice4":"SSD：レーザ光を使って記録する。","choice5":"USBメモリ：ROM型の半導体メモリに記録する。","correct_answer":5,"correct_answers":[5],"explanation":"1)ディスクに刻んだ凹凸で情報を表現する 2)ディスク表面の磁性体に情報を記録する 3)フラッシュメモリと一緒。半導体素子に情報を記録する。赤外線は使用しない。 4) 5)ROM型の半導体メモリが使われている 補足】 『USBってROM（Read Only）じゃないじゃん！』と思って調べてみたのですが、 USBはがんばって書き込みをしているROMであって、いわゆる「RAM」ではないとのことです。"},{"year":"2016","category":"情報処理技術系","question_number":7,"question_text":"中央処理装置に含まれるのはどれか。","choice1":"出力装置","choice2":"制御装置","choice3":"通信装置","choice4":"入力装置","choice5":"主記憶装置","correct_answer":2,"correct_answers":[2],"explanation":"中央処理装置（CPU）に含まれるのは演算装置と制御装置なので、2)制御装置が正しい。"},{"year":"2016","category":"情報処理技術系","question_number":8,"question_text":"紙に印刷された文字などを認識し、コンピュータ上の文字データへ変換する装置はどれか。","choice1":"OCR","choice2":"OMR","choice3":"キーボード","choice4":"タッチパネル","choice5":"ドットインパクトプリンタ","correct_answer":1,"correct_answers":[1],"explanation":"1)光学式文字読取装置(Optical Charaacter Reader)は手書きもしくは印刷された文字などを読み取る装置なので正しい。 2)光学式マーク読取装置(Optical Mark Reader)はマークシートを読み取る装置。"},{"year":"2016","category":"情報処理技術系","question_number":9,"question_text":"プロジェクターとノートパソコンをアナログ接続するために用いるコネクタはどれか。","choice1":"Display port","choice2":"D-Sub15","choice3":"HDMI","choice4":"RJ-45","choice5":"USB","correct_answer":2,"correct_answers":[2],"explanation":"1)DVI端子の後継を狙った規格で、1本のケーブルから映像・音声・制御信号のデジタル出力が可能。 3)デジタル家電向けのインターフェース。1本のケーブルから映像・音声・制御信号のデジタル出力が可能。 4)EthernetやISDNなどの通信ケーブルを繋ぐコネクタ形状の一つ。 5)コンピュータと周辺機器を接続するためのシリアルバス規格の一つ。"},{"year":"2016","category":"情報処理技術系","question_number":10,"question_text":"RAID1について正しいのはどれか。","choice1":"構成に必要な最低台数は３台である。","choice2":"データを分割して複数のハードディスクに書き込む。","choice3":"同じ内容のデータを複数のハードディスクに書き込む。","choice4":"使用可能容量は構成台数から２台分ひいたものになる。","choice5":"同時に２台以上のハードディスクが故障するとデータを回復できない。","correct_answer":3,"correct_answers":[3],"explanation":"構成に必要な最低台数は2台のため、1は誤り。 RAID 1では構成するすべてのディスクに同一のデータを書き込むため、2、4は誤り。 読み込みは１台のディスクから行なうので１台残っていれば復元は可能。よって5は誤り。 1)→RAID５の説明 2)→RAID０の説明 3) 4)→RAID６の説明 5)→RAID５の説明"},{"year":"2016","category":"情報処理技術系","question_number":11,"question_text":"PC(パーソナルコンピュータ)のファームウェアに相当するのはどれか。","choice1":"BIOS","choice2":"Webサーバ","choice3":"ワープロソフト","choice4":"デバイスドライバ","choice5":"リカバリーソフト","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":12,"question_text":"仮想記憶について正しいのはどれか。","choice1":"不揮発性である。","choice2":"処理速度が改善する。","choice3":"専用の補助記憶装置を使用する。","choice4":"物理的な主記憶装置が不要になる。","choice5":"主記憶装置の容量の不足時に使う。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":13,"question_text":"図のフローチャートの実行結果はどれか。","choice1":"i = 2, A = 3","choice2":"i = 2, A = 4","choice3":"i = 3, A = 3","choice4":"i = 3, A = 4","choice5":"i = 4, A = 4","correct_answer":4,"correct_answers":[4],"explanation":"＜それぞれの処理の意味＞ h: 開始 n: それぞれの変数(iとかAとかB)に値を入れる（代入）。 この問題では矢印(←)をつかって「 i ← 0 」などと書かれているが、イコール(＝)をつかって「i＝0」と書かれた場合も意味は一緒。 l: 菱形の中に書かれた条件を満たす場合（=真）と、満たさない場合（=偽）で別々の出口に出る。 o: A-Bの計算結果をAに入れる。 p: i+1の計算結果をiに入れる。 q: i,Aの値を出力する r: 終了 ＜処理の流れ＞ [h]開始 ↓ [n]代入処理を実行。このとき各変数の値は以下のとおり。 i:0 A:55 B:17 ↓ [l]分岐処理。 A:55, B:17より条件「A≧B」を満たす（真）。 真のときの出口が「下側」か「右側」か示されていないが、右側だとした場合は次の処理はq出力となり、i:0 A:55が出力される。 これは解答の選択肢にないので、真の場合は下側の出口に進むことがわかる。 ↓ [o] A:55, B:17より、 55-17=38をAに入れる。 この結果、 i:0 A:38 B:17 ↓ [p] i:0 より、 0+1=1をiに入れる。 この結果、 i:1 A:38 B:17 ↓ [l（2度目）] A:38, B:17より、条件「A≧B」を満たす（真）。下の出口に進む。 ↓ [o（2度目）] A:38, B,17より、38-17=21をAに入れる。 この結果、 i:1 A:21 B:17 ↓ [p（2度目）] i:1 より、 1+1=2をiに入れる。 この結果、 i:2 A:21 B:17 ↓ [l（3度目）] A:21, B:17より、条件「A≧B」を満たす（真）。下の出口に進む。 ↓ [o（3度目）] A:21, B,17より、21-17=4をAに入れる。 この結果、 i:2 A:4 B:17 ↓ [p（3度目）] i:2 より、 2+1=3をiに入れる。 この結果、 i:3 A:4 B:17 ↓ [l（4度目）] A:4, B:17より、条件「A≧B」を満たさない（偽）。右の出口に進む。 ↓ [q] i:3 A:4 B:17 より、「i:3, A:4」を出力する。 ↓ [r]終了"},{"year":"2016","category":"情報処理技術系","question_number":14,"question_text":"コンパイラ方式の言語に分類されるのはどれか。","choice1":"C++","choice2":"SQL","choice3":"XML" Pの違いはコネクションレスかどうかという点。"},{"year":"2016","category":"情報処理技術系","question_number":26,"question_text":"サブネットマスクが26ビットのIPv4のネットワークで接続可能な最大ホスト数はどれか。","choice1":"14","choice2":"30","choice3":"62","choice4":"126","choice5":"254","correct_answer":3,"correct_answers":[3],"explanation":"IPv4のIPアドレスは32ビット↓ 11111111.11111111.11111111.11111111 ←(10進数表記）255.255.255.255 26ビットのサブネットマスク↓ 11111111.11111111.11111111.11000000 ←”1″がマスクされているところ。”0″はマスクされてないところ。左から26ビット(26個)がマスクされている。 ネットワークで使えるアドレスの個数は、マスクされてない下6桁（32ビット-26ビット=6）で表現できる分の個数。 具体的には、 ________.________.________.__000000 ←(10進数で「0」) ________.________.________.__000001 ←(10進数で「1」) ________.________.________.__000010 ←(10進数で「2」) ________.________.________.__000011 ←(10進数で「3」) ･･･ ________.________.________.__111111 ←(10進数で「63」) なので、0 から 63 の 64個 この中から、「ネットワークアドレス」と「ブロードキャストアドレス」をそれぞれ１つずつ割り当てる必要があるので、 実際に使えるアドレスは2を引いた数。 64 – 2 ⇒ 62個"},{"year":"2016","category":"情報処理技術系","question_number":27,"question_text":"以下の出力を得られるネットワーク管理コマンドはどれか。","choice1":"ftp","choice2":"ipconfig","choice3":"ping","choice4":"telnet","choice5":"tracert","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":28,"question_text":"ネットワーク内のクライアントに通信を行うための設定情報を提供するプロトコルはどれか。","choice1":"DHCP","choice2":"HTTP","choice3":"NTP","choice4":"PPP","choice5":"SNMP","correct_answer":1,"correct_answers":[1],"explanation":"『通信を行うための設定情報』がIPアドレスのことならDHCPだと思うが、自信なし。"},{"year":"2016","category":"情報処理技術系","question_number":29,"question_text":"IPアドレスからMACアドレスを求めるプロトコルはどれか。","choice1":"ARP","choice2":"HTTP","choice3":"SIP","choice4":"SNMP","choice5":"TCP","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":30,"question_text":"UTPケーブルについて正しいのはどれか。","choice1":"光を用いて通信する。","choice2":"終端装置が必要である。","choice3":"電磁シールドされている。","choice4":"同軸ケーブルの一つである。","choice5":"2本の銅線を撚りあわせている。","correct_answer":5,"correct_answers":[5],"explanation":"UTPケーブル＝いわゆる普通のLANケーブル ＜物理層の伝送媒体＞ A.電気を伝える金属線 －同軸ケーブル　←(4) －ツイストペアケーブル　←(5) －－UTP (Unshielded Twisted Pair) －－STP（Shielded Twisted Pair）　←(3) B.光を伝える光ファイバ ←(1)(2) C.物体を用いない電波や赤外線 以上より該当するのは(5)"},{"year":"2016","category":"情報処理技術系","question_number":31,"question_text":"プライベートIPアドレスを持つ端末からインターネット接続するために必要な技術はどれか。","choice1":"CIDR","choice2":"ICMP","choice3":"IMAP","choice4":"NAPT","choice5":"POP","correct_answer":4,"correct_answers":[4],"explanation":"NAPT(Network Address Port Translation) インターネット接続をするためには、プライベートIPアドレスをグローバルIPアドレスに紐づけする必要がある。"},{"year":"2016","category":"情報処理技術系","question_number":32,"question_text":"10MBのデータを10Mbpsの回線で転送するための最短所要時間はどれか。","choice1":"1秒","choice2":"4秒","choice3":"8秒","choice4":"16秒","choice5":"32秒","correct_answer":3,"correct_answers":[3],"explanation":"1Byte=8bit なので、 10MB は 80Mbit。 10Mbps は、1秒あたり10Mbit のこと。 = 10Mbit/秒 以上より、 80Mbit ÷ 10Mbps(10Mbit/秒) = 8秒"},{"year":"2016","category":"情報処理技術系","question_number":33,"question_text":"DNSについて正しいのはどれか。","choice1":"ポートを変換する。","choice2":"ホスト名を解析する。","choice3":"通信の経路制御を行う。","choice4":"電子メールを配送する。","choice5":"正確な時刻情報を提供する","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2016","category":"情報処理技術系","question_number":34,"question_text":"無線LANで用いられるローミングについて正しいのはどれか。","choice1":"気象レーダー等の影響を受けること","choice2":"アクセスポイント間の電波干渉を防ぐこと","choice3":"接続先のアクセスポイントを識別すること","choice4":"接続先のアクセスポイントを切り替えること","choice5":"アクセスポイントが接続の可否を判断すること","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2016","category":"情報処理技術系","question_number":35,"question_text":"伝送速度(理論値)が最大の無線LANの規格はどれか。","choice1":"IEEE802.11a","choice2":"IEEE802.11b","choice3":"IEEE802.11g","choice4":"IEEE802.11n","choice5":"IEEE802.11ac","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5) フレッツ「Q. IEEE802.「11a」・「11b」・「11g」・「11n」・「11ac」って何？ 」"},{"year":"2016","category":"情報処理技術系","question_number":36,"question_text":"情報セキュリティの3要素(CIA)に含まれるのはどれか。","choice1":"可用性","choice2":"真正性","choice3":"信頼性","choice4":"脆弱性","choice5":"責任追跡性","correct_answer":1,"correct_answers":[1],"explanation":"情報セキュリティの3要素(CIA)は、 機密性（Confidentiality） 完全性（Integrity） 可用性（Availability）"},{"year":"2016","category":"情報処理技術系","question_number":37,"question_text":"標的型攻撃メールへの対策として適切なのはどれか。","choice1":"不審メールの添付ファイルは開かない。","choice2":"メールの添付ファイルを実行して確認する。","choice3":"メール中に記載されたリンクをクリックする。","choice4":"メール受信時のウイルスチェックを行わない。","choice5":"不審なメールは周知のためにそのまま転送する","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":38,"question_text":"拠点間を接続したネットワークにおいて、ネットワーク層でデータを保護している技術はどれか。","choice1":"IPsec","choice2":"LAN","choice3":"L2TP","choice4":"SSL","choice5":"WAL","correct_answer":1,"correct_answers":[1],"explanation":"＜セキュリティ関連の技術とOSI参照モデルの対応＞ アプリケーション層 ＜SSH プレゼンテーション層 セッション層 (セッション層とトランスポート層の間） ＜SSL/TLS トランスポート層 ネットワーク層 ＜IPsec:Security Architecture for Internet Protocol データリンク層 ＜（L2TP:Layer 2 Tunneling Protocol:L2TP自体は暗号化を提供しておらず、IPsec等と組み合わせて使用される） 物理層"},{"year":"2016","category":"情報処理技術系","question_number":39,"question_text":"大量のリクエストによりサーバーのサービスや機能を低下、停止させる攻撃はどれか。","choice1":"辞書攻撃","choice2":"DDoS攻撃","choice3":"ポートスキャン攻撃","choice4":"ブルートフォース攻撃","choice5":"SQLインジェクション攻撃","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4)総当たり攻撃:暗号やパスワードの解読のために手当たり次第に繰り返す攻撃 5)"},{"year":"2016","category":"情報処理技術系","question_number":40,"question_text":"ファイアウォールにより、外部ネットワークと内部ネットワークのどちらからも隔離された区域はどれか。","choice1":"DMA","choice2":"DMZ","choice3":"IDS","choice4":"IPS","choice5":"WAF","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":41,"question_text":"ランサムウェアについて正しいのはどれか。","choice1":"ウイルスの発見と駆除を行う。","choice2":"データを暗号化しアクセスを制限する。","choice3":"キーボードから入力された文字を記録する。","choice4":"SNSへ勝手に不適切な内容の記事を投稿する。","choice5":"複数のサービス利用IDとパスワードを管理する。","correct_answer":2,"correct_answers":[2],"explanation":"ransom = 身代金"},{"year":"2016","category":"情報処理技術系","question_number":42,"question_text":"公開鍵暗号方式について誤っているのはどれか。","choice1":"電子署名に利用される。","choice2":"暗号化と復号で鍵が異なる。","choice3":"送信者が受信者の公開鍵で暗号化する。","choice4":"共通鍵方式よりアルゴリズムが複雑である。","choice5":"送信者と受信者の組み合わせの数だけ鍵が必要である。","correct_answer":5,"correct_answers":[5],"explanation":"5)→共通鍵方式の説明"},{"year":"2016","category":"情報処理技術系","question_number":43,"question_text":"ウォーターフォールモデルの工程でないのはどれか。","choice1":"外部設計","choice2":"内部設計","choice3":"テスト","choice4":"プログラミング","choice5":"プロトタイピング","correct_answer":5,"correct_answers":[5],"explanation":"ウォーターフォール＝滝。 滝が落ちるように、工程は戻ることなく次へ次へと進んでいく開発モデル。 要件定義→外部設計→内部設計→プログラミング→単体テスト→結合テスト→システムテスト"},{"year":"2016","category":"情報処理技術系","question_number":44,"question_text":"プログラム中のすべての命令や分岐を網羅的にチェックするテスト手法はどれか。","choice1":"ストレステスト","choice2":"トップダウンテスト","choice3":"ブラックボックステスト","choice4":"ボトムアップテスト","choice5":"ホワイトボックステスト","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":45,"question_text":"工程ごとの日程を管理する手法はどれか。","choice1":"DFD","choice2":"E-R図","choice3":"PERT図","choice4":"ガントチャート","choice5":"ユースケース図","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":46,"question_text":"次のネットワーク図のクリティカルパスの所要日数は何日か。","choice1":"6日","choice2":"10日","choice3":"13日","choice4":"14日","choice5":"15日","correct_answer":4,"correct_answers":[4],"explanation":""},{"year":"2016","category":"情報処理技術系","question_number":47,"question_text":"システム障害時に停止することなく継続運用可能なシステム構成はどれか。","choice1":"ウォームスタンバイ","choice2":"コールドスタンバイ","choice3":"シンプレックスシステム","choice4":"デュアルシステム","choice5":"ホットスタンバイ","correct_answer":4,"correct_answers":[4],"explanation":"4) デュアルシステム システムを完全に二重化。両方が本番機として稼働しているので、どちらかに障害が起きても継続運用可能。→〇 デュプレックスシステム システムを二重化するが、本番系と待機系を分ける。 5) ホットスタンバイ …待機系を、いつでも切り替えられる状態で待機させておく。→これも不正解とは言えないのでは・・・？ →システムによっては差し支えない程度の切り替え時間が発生する場合があるので、厳密にいえば不正解かな。 2) コールドスタンバイ …待機系を用意しておくが、稼働はさせていない状態で待機する。切り替えには時間がかかる。 1) ウォームスタンバイ …ホットとコールドの間。（定義があいまいなので、これも不正解とは言えないのでは・・・？） →本番環境と同期をとっていないので瞬時には切り替われない。"},{"year":"2016","category":"情報処理技術系","question_number":48,"question_text":"あるシステムが2,000時間の運用時間中に4回のシステム停止が発生し、システム復旧に平均30分を要した。システム稼働率はどれか。","choice1":"0.94","choice2":"0.989","choice3":"0.994","choice4":"0.998","choice5":"0.999","correct_answer":5,"correct_answers":[5],"explanation":"稼働率 = 「システムが動いていた時間」 ÷ 「全体の運用時間(システムが動いていた時間＋システムが止まっていた時間)」 システムが止まっていた時間は、 平均30分 × 4回 ＝ 120分 ＝ 2時間 システムが動いていた時間は、 2,000時間 － 2時間 ＝ 1,998時間 稼働率 ＝ 「システムが動いていた時間」 ÷ 「全体の運用時間」 ＝　1,998時間 ÷ 2,000時間 ＝　0.999 これをパーセントに直すと、99.9％"},{"year":"2016","category":"情報処理技術系","question_number":49,"question_text":"システムの信頼性評価指標(RASIS)のうち、平均故障間隔(MTBF)が評価指標となるのはどれか。","choice1":"Reliability（信頼性）","choice2":"Availability（可用性）","choice3":"Serviceability（保守性）","choice4":"Integrity（完全性）","choice5":"Security（安全性）","correct_answer":1,"correct_answers":[1],"explanation":"1) Reliability（信頼性）→評価指標は 平均故障間隔(MTBF) 2) Availability（可用性）→評価指標は 稼働率 3) Serviceability（保守性）→評価指標は 平均修復時間(MTTR)"},{"year":"2016","category":"情報処理技術系","question_number":50,"question_text":"クラウドの基本的な特性として誤っているのはどれか。","choice1":"様々な端末からアクセスできる。","choice2":"複数利用者でリソースを共有できる。","choice3":"リソースの使用量が管理されている。","choice4":"ネットワーク状況に関係なく利用できる。","choice5":"要求に応じて動的にリソースが割り当てられる。","correct_answer":4,"correct_answers":[4],"explanation":"クラウド＝ネットワーク上のリソースを活用すること（ざっくり）なので、 ネットワーク状況が悪い場合、最悪ネットワークが止まってしまった場合は利用できない。"},{"year":"2016","category":"医学・医療系","question_number":1,"question_text":"インフォームドコンセントについて正しいのはどれか。","choice1":"知的障害者には必要ない。","choice2":"緊急時でも省略することはできない。","choice3":"幼児の場合は代理人の同意が必要である。","choice4":"患者を不安にさせる事項の説明は省略する。","choice5":"診療の目的や内容を説明するが患者の同意は必要ない。","correct_answer":3,"correct_answers":[3],"explanation":"医療従事者は、あらゆる医療行為について患者からインフォームドコンセントを得る必要があると考えるのが一般的である。 1)障害者であってもインフォームドコンセントは必要である。 2)生命の危機に瀕した緊急時の場合、事前の説明を省略し、一般的な治療を優先させてから事後の説明を行うことはやむを得ないとされる。 3)自己決定の判断能力が十分でないと考えられる幼児の場合は、子供の自己決定権を代理人（保護者）が代替するので、代理人の同意が必要である。 4)インフォームドコンセントに際しては、十分、かつ正確な説明を行う必要がある。 5)患者の同意は必須である。"},{"year":"2016","category":"医学・医療系","question_number":2,"question_text":"ターミナルケアについて誤っているのはどれか。","choice1":"ホスピスのみで行う。","choice2":"宗教家や家族、友人等も関わる。","choice3":"終末期の死に至る過程を支える。","choice4":"心理的な苦悩の緩和の支援も含まれる。","choice5":"その人らしさを全うすることを支援する。","correct_answer":1,"correct_answers":[1],"explanation":"ターミナルケアとは、3）終末期の死に至る過程を支える医療である。単に身体的な苦痛の除去だけではなく、4）心理上の苦悩を緩和するとともに2）信仰や霊的な情感、不安なども包含する支援行為であり、宗教家や家族、友人等も関わる。すなわち、5）その人らしさを全うすることを支援する。 治療方針を立てるに際しては、専門的な医学的検討のうえ、インフォームドコンセントに基づく医療・ケアチームによる患者あるいは家族の意思の確認が重要である。最終的に、適切な結論が得られな場合は複数の専門家による委員会を設置して検討・助言を行う。 ターミナルケアは居宅などでも行われるので　1)ホスピスのみとは限らない"},{"year":"2016","category":"医学・医療系","question_number":3,"question_text":"保険診療として認められていないのはどれか。","choice1":"健康診断","choice2":"帝王切開","choice3":"いぼ焼灼","choice4":"コンタクトレンズ検査","choice5":"疲労回復のための入院","correct_answer":1,"correct_answers":[1,5],"explanation":"正答は1、5。　保険給付の対象とならない疾患等としては、予防接種、予防医療、自然分娩、美容外科および労災保険対象などがある。 1)健康診断は禁止されている。 2)保険診療で認められている。 3)冷凍凝固法の１番のメリットは、健康保険が適用される 冷凍凝固法はいぼ細胞を液体窒素で凍らせて壊死させる治療法で、焼灼法とはレセプト上でも別扱い。 焼灼法は電気メスで文字通り「焼き殺して」除去する方法。 4)保険診療で認められている。 5)疲労回復のための入院は傷病による入院ではないので、保険診療の対象外である。"},{"year":"2016","category":"医学・医療系","question_number":4,"question_text":"わが国の医療保険制度について誤っているのはどれか。","choice1":"現物給付が原則である。","choice2":"自己負担率は一定である。","choice3":"医療機関を自由に選択できる。","choice4":"すべての国民を対象としている。","choice5":"入院室料差額は給付の対象外である。","correct_answer":2,"correct_answers":[2],"explanation":"わが国の医療保険制度の特徴は、すべての国民を対象とする強制加入の国民皆保険制度、保険医療機関に対して保険証を提示すれば受信が認められる医療機関に対して保険証を提示すれば、受信が認められる医療機関の自由選択、診療サービス提供の給付をする「現物給付」である。 1) 2)就学前 2割, 70歳まで 3割, 70歳以上 2割(所得によっては3割) 3) 4) 5)入院室料差額は、保険給付の対象外であり、選定療養費として認められている。 参考文献サイト】 協会けんぽ"},{"year":"2016","category":"医学・医療系","question_number":5,"question_text":"医療計画における５疾病に含まれないのはどれか。","choice1":"がん","choice2":"肺炎","choice3":"脳卒中","choice4":"精神疾患","choice5":"急性心筋梗塞","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5) 補足】 ５疾病 がん、脳卒中、急性心筋梗塞、糖尿病、精神疾患(認知症を含む) ５事業 災害医療、へき地医療、救急医療、周産期医療、小児医療(小児救急を含む) ＋在宅医療"},{"year":"2016","category":"医学・医療系","question_number":6,"question_text":"ＤＰＣの主病名として正しいのはどれか。","choice1":"もっとも検査費のかかった病名","choice2":"もっとも薬剤費のかかった病名","choice3":"もっとも医療資源が投入された病名","choice4":"もっとも手術・処置料が高かった病名","choice5":"もっとも多くの診療科の医師が介入した病名","correct_answer":3,"correct_answers":[3],"explanation":"DPCの主病名（診断群分類）は、入院中に「もっとも医療資源が投入された傷病名」と実施された診療行為の内容によって決まる。この診断群分類から、包括評価部分が算定される。 1) 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":8,"question_text":"医療法で規定されているのはどれか。","choice1":"応召義務","choice2":"無診察治療の禁止","choice3":"診療内容の守秘義務","choice4":"インフォームドコンセントの努力義務","choice5":"","correct_answer":5,"correct_answers":[5],"explanation":"1)医師法(第十九条) 2)医師法(第二十条) 3)医師法(第二十四条) 4)刑法(第百三十四条) 5)1997年（平成9年）の医療法改正によって、医療者は適切な説明を行って、医療を受ける者の理解を得るよう努力する義務が初めて明記されました。"},{"year":"2016","category":"医学・医療系","question_number":9,"question_text":"職種と守秘義務を定めた法令の組み合わせで正しいのはどれか。","choice1":"医師　　　－　医師法","choice2":"薬剤師　　－　薬剤師法","choice3":"歯科医師　－　歯科医師法","choice4":"看護師　　－　保健師助産師看護師法","choice5":"助産師　　－　保健師助産師看護師法","correct_answer":4,"correct_answers":[4],"explanation":"1)刑法 2)刑法 3)刑法 4) 5)刑法"},{"year":"2016","category":"医学・医療系","question_number":10,"question_text":"業務独占でないのはどれか。","choice1":"看護師","choice2":"助産師","choice3":"保健師","choice4":"薬剤師","choice5":"准看護師","correct_answer":3,"correct_answers":[3],"explanation":"業務独占とは、その業務の遂行に専門的判断や技術を伴う行為が必要であり、一定の教育訓練を受け、所定の資格を持つ者だけが業として行いを得ることをいう。一方、名称独占とは、法令によって一定の職種、施設などのみに特定の名称を独占させることによって、業を行う者、サービスを受ける者が混乱を起こさせないようにするためのものである。保健師は名称独占であるが、業務独占ではない。 1) 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":11,"question_text":"患者からの採血を実施できない職種はどれか。","choice1":"看護師","choice2":"助産師","choice3":"准看護師","choice4":"臨床検査技師","choice5":"臨床工学技士","correct_answer":5,"correct_answers":[5],"explanation":"臨床工学技士は、臨床工学技士基本業務指針2010に「身体に直接針を穿刺して行う血管からの採血及び血管内への輸血等を，臨床工学技士は 行ってはならない」と規定されている。 1) 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":12,"question_text":"国家資格でないのはどれか。","choice1":"義肢装具士","choice2":"言語聴覚士","choice3":"視能訓練士","choice4":"理学療法士","choice5":"臨床心理士","correct_answer":5,"correct_answers":[5],"explanation":"臨床心理士は、公益財団法人日本臨床心理士資格認定協会が認定する民間資格である。臨床心理士固有の専門業務としては、①臨床心理査定、②臨床心理面接、③臨床心理的地域援助、④前記①～③に関する調査・研究の４つが挙げられている。 1) 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":13,"question_text":"特定健康診査の基本的な検査項目でないのはどれか。","choice1":"血圧測定","choice2":"脂質検査","choice3":"腹囲検査","choice4":"肝機能検査","choice5":"心電図検査","correct_answer":5,"correct_answers":[5],"explanation":"特定健康診査や特定保健指導は、健康増進法と高齢者の医療の確保に関する法律に基づいて実施される。特定健康診断対象者全員が受ける基本的な項目は、①既往歴の調査、②理学的検査（身体診察）、③身体測定（身長、体重、腹囲（内臓脂肪面積））、④BMI、⑤血圧測定、⑥肝機能検査（AST（GOT）、ALT（GPT）、γ-GT（γ-GTP））、⑦脂質検査（中性脂肪、HDLコレステロール、LDLコレステロール）、⑧血糖検査（空腹時血糖またはHbA1c）、⑨尿検査（尿糖、尿蛋白）である。 1) 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":14,"question_text":"以下の組み合わせで適切でないのはどれか。","choice1":"臨床検査部門　　　－　脳波検査","choice2":"病理検査部門　　　－　免疫組織染色","choice3":"地域連携室部門　　－　遠隔画像診断","choice4":"輸血部門　　　　　－　血液製剤使用歴管理","choice5":"光学診療部門　　　－　内視鏡的粘膜下層剥離術","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)遠隔画像診断は、放射線科医師が遠隔地の医療機関から伝送されてきた画像に対して、所見を記載し、画像診断を付して返送する診療行為であり、通常、地域医療連携部門は関与しない。 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":15,"question_text":"医療計画においてアウトカムを示す指標でないのはどれか。","choice1":"患者満足度","choice2":"医師１人当たり入院患者数","choice3":"２日以内のＩＣＵへの再入室","choice4":"予定しない再手術（４８時間以内）","choice5":"７５歳以上の入院患者における入院中の骨折率","correct_answer":2,"correct_answers":[2],"explanation":"1)アウトカム 2)ストラクチャー 3)アウトカム 4)アウトカム 5)アウトカム"},{"year":"2016","category":"医学・医療系","question_number":16,"question_text":"逆紹介率の算定式の分母はどれか。","choice1":"退院患者の数","choice2":"初診患者の数","choice3":"紹介患者の数","choice4":"初診患者の数＋再診患者の数","choice5":"紹介患者の数＋初診患者の数","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)(逆紹介患者の数÷初診患者の数)　×　100% 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":17,"question_text":"インシデントレポートについて誤っているのはどれか。","choice1":"人事評価に利用される。","choice2":"教育の効果が期待できる。","choice3":"個人が特定される情報は公表しない。","choice4":"ひやり、またははっとした経験も報告される。","choice5":"医療事故の発生を防止することが目的である。","correct_answer":1,"correct_answers":[1],"explanation":"1)インシデントレポートは、インシデント事例を分析し、類似するインシデントの再発防止や、 医療事故・医療過誤の発生を未然に防止することが主な目的であり、人事評価を目的とするものではない。 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":18,"question_text":"クリニカルパスについて正しいのはどれか。","choice1":"患者に見せてはならない。","choice2":"アウトカム評価は必要ない。","choice3":"時間軸に沿ってケア介入を設定する。","choice4":"診療経過の途中で変更してはならない。","choice5":"バリアンスとは達成目標のことである。","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)クリニカルパスは、各疾患の入院などの一連の診療行為において、時間軸に沿って、それを構成するステップ毎に患者への説明や看護ケア介入、投薬や検査・処置などの実施内容（タスク）と期待される成果（達成目標）を予め設定しておく標準診療計画である。 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":19,"question_text":"診療ガイドラインについて正しいのはどれか。","choice1":"患者には治療法の選択権がない。","choice2":"エビデンスが系統的に評価されている。","choice3":"ガイドラインに従って診療する義務がある。","choice4":"推奨に従わなければ保険診療の対象とならない。","choice5":"専門医に対するアンケート調査に基づいて作成される。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)診療ガイドラインは、各治療法や診断法などを、科学的根拠（エビデンス）に基づいて系統的に評価し、患者と医療者に最適となる意思決定を支援するための推奨を提示するのもであり、医療の質の向上と標準化の推進、患者に対するエビデンスの提供などを目的としている。あくまでも推奨であり、種々の事由により適合しない場合もあり得る。 3) 4) 5) がん情報サービス Minds（マインズ）ガイドラインセンター（厚生労働省委託事業）"},{"year":"2016","category":"医学・医療系","question_number":20,"question_text":"実質臓器はどれか。","choice1":"肝臓","choice2":"結腸","choice3":"心臓","choice4":"膀胱","choice5":"胆のう","correct_answer":1,"correct_answers":[1],"explanation":"1)内部に固有の形態・機能を有する臓器、ひいては内部にも組織が充実している臓器をいいます。肝臓・腎臓・膵臓などがこれにあたります。 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":21,"question_text":"下肢の骨でないのはどれか。","choice1":"脛骨","choice2":"橈骨","choice3":"腓骨","choice4":"膝蓋骨","choice5":"大腿骨","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":22,"question_text":"以下の組み合わせで関連がないのはどれか。","choice1":"痛風　　　　　　－　尿酸","choice2":"肺炎　　　　　　－　細菌","choice3":"脳出血　　　　　－　高血圧","choice4":"狭心症　　　　　－　動脈硬化","choice5":"関節リュウマチ　－　ウイルス","correct_answer":5,"correct_answers":[5],"explanation":"1)痛風は、高尿酸血症による尿酸結晶の沈着によって起こる疾患である。 2)肺炎は、肺の炎症性疾患の総称で、炎症を引き起こす原因は、細菌、ウィルス、マイコプラズマ、クラミジア、真菌、寄生虫などさまざまである。 3)脳出血は高血圧が危険因子となって起こる疾患である。 4)狭心症は、冠動脈の動脈硬化による搾取が主要因となって起こる疾患である。 5)関節リウマチは、ウィルスが原因の疾患ではなく、代表的な膠原病（炎症性自己免疫性疾患）のひとつである。"},{"year":"2016","category":"医学・医療系","question_number":23,"question_text":"静脈血が流れていないのはどれか。","choice1":"腎静脈","choice2":"肺静脈","choice3":"脾静脈","choice4":"膝窩静脈","choice5":"内頸静脈","correct_answer":2,"correct_answers":[2],"explanation":"一般的に静脈とは、臓器から排出された二酸化炭素を多く含む血液を心臓に戻すための血管系のことである。 1) 2)ただし、肺動脈のみ他の静脈と異なり、肺で酸素を補給された血液（動脈血）を左心房に戻す血管となっている。 3) 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":24,"question_text":"冠動脈疾患はどれか。","choice1":"狭心症","choice2":"腎不全","choice3":"脳梗塞","choice4":"急性膵炎","choice5":"肺血栓塞栓症","correct_answer":1,"correct_answers":[1],"explanation":"1)狭心症は、冠動脈の動脈硬化による狭窄が主要因の疾患である。 2)腎不全は、腎機能が正常時の30%以下になった状態である。 3)脳梗塞は、脳動脈の閉塞または狭窄により脳虚血をきたし、脳組織が酸素または栄養の不足によって壊死した状態をいう。 4)急性膵炎は膵液に含まれる消化酵素が膵臓自体を消化し、浮腫、出血、壊死などの急性炎症を呈したものである。 5)肺血栓塞栓症は、肺動脈に血液の塊が詰まり、肺動脈の流れが悪くなったり、閉塞してしまう疾患である。"},{"year":"2016","category":"医学・医療系","question_number":25,"question_text":"以下の組み合わせで誤っているのはどれか。","choice1":"黄疸　　　　　－　肝臓","choice2":"尿崩症　　　　－　膀胱","choice3":"回転性めまい　－　内耳","choice4":"白内障　　　　－　水晶体","choice5":"起立性低血圧　－　自律神経","correct_answer":2,"correct_answers":[2],"explanation":"1)黄疸は、肝臓障害でビリルビン濃度が上昇し、全身の皮膚や粘膜に過剰沈着して生じる。 2)膀胱ではなく腎臓 3)回転性めまいは、内耳で自分の周囲や景色がぐるぐる回るように誤認され生じる。 4)白内障は目の水晶体が白濁して生じる。 5)起立性低血圧は、睡眠不足やストレスなどによる自律神経異常で生じる。"},{"year":"2016","category":"医学・医療系","question_number":26,"question_text":"糖尿病診療として行われないのはどれか。","choice1":"運動療法","choice2":"眼底検査","choice3":"食事指導","choice4":"胃内視鏡検査","choice5":"インスリン療法","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)胃内視鏡検査は、糖尿病の直接的な診療として行われない。 5)"},{"year":"2016","category":"医学・医療系","question_number":27,"question_text":"屈折異常でないのはどれか。","choice1":"遠視","choice2":"近視","choice3":"斜視","choice4":"乱視","choice5":"白内障","correct_answer":3,"correct_answers":[3,5],"explanation":"正答は3、5。　1) 2) 3)斜視は、外眼筋の障害などによる眼位異常であり、屈折異常ではない。 4) 5)白内障は、眼の中のレンズの役割をする水晶体が濁ってしまう病気で、焦点調節機能の異常ではない。なお、水晶体を眼内レンズに置換する白内障治療が行われる。"},{"year":"2016","category":"医学・医療系","question_number":28,"question_text":"感染症はどれか。","choice1":"喘息","choice2":"腎盂腎炎","choice3":"関節リウマチ","choice4":"慢性甲状腺炎","choice5":"全身性エリテマトーデス","correct_answer":2,"correct_answers":[2],"explanation":"1)喘息は、アレルギー的機序が関与した疾患で、気管支の攣縮（狭窄）に伴う呼吸困難や低酸素血症を起こす。 2)腎盂腎炎は、主に大腸菌による下部尿路からの逆行性細菌感染症である。 3)、4)、5)は自己免疫性疾患"},{"year":"2016","category":"医学・医療系","question_number":29,"question_text":"処方する際に医師免許以外の免許が必要なのはどれか。","choice1":"劇薬","choice2":"毒薬","choice3":"麻薬","choice4":"向精神薬","choice5":"生物由来製剤","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)麻薬施用者免許が必要 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":30,"question_text":"内服薬に分類されないのはどれか。","choice1":"液剤","choice2":"散剤","choice3":"錠剤","choice4":"顆粒剤","choice5":"吸入剤","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)吸入剤は、液状または粉末状の薬剤をスプレー方式や専用の機材で口の中に噴霧し、同時に息を吸い込んで、気管支に直接薬剤を散布するもので、気管支喘息などで用いられる。点眼・点鼻薬、軟膏、貼付薬、肛門から挿入する坐剤、トローチなどと同様に外用薬に分類される。"},{"year":"2016","category":"医学・医療系","question_number":31,"question_text":"処方箋の記載事項で必須でないのはどれか。","choice1":"分量","choice2":"用法","choice3":"患者の年齢","choice4":"発行年月日","choice5":"臨床検査値","correct_answer":5,"correct_answers":[5],"explanation":"1)～4)処方箋は、医師法施行規則第21条によって、「患者の氏名、年齢、薬名、分量、用法、用量、発行の年月日、使用期間及び病院若しくは診療所の名称及び所在地又は医師の住所を記載し、記名押印又は医師の住所を記載し、記名押印又は署名しなければならない」とされている。 5)近年、薬剤の適正使用に関して薬剤師の役割が重視されつつあり、副作用防止などのために処方箋に肝機能などの臨床検査値が記載されるケースも出てきているが、これは必須ではない。"},{"year":"2016","category":"医学・医療系","question_number":32,"question_text":"医師の指示に基づいて行われる「診療の補助」に含まれる看護業務はどれか。","choice1":"観察","choice2":"動脈注射","choice3":"安全の確保","choice4":"患者の指導・相談","choice5":"薬剤の投与量の調節","correct_answer":5,"correct_answers":[5],"explanation":"病院における看護業務とは、直接患者のケアを行う「直接看護」と診療の補助にあたる「診療・治療補助業務」、直接患者に看護ケアを実施しない管理的な側面を持つ「間接看護Ⅰ」、「間接看護Ⅱ」、「その他」に分類される。 1)観察、3)安全の確保は「直接看護」に、4)患者の指導・相談は「間接看護Ⅰ」に、5)薬剤の投与量の調節は「診療・治療補助業務」に分類される。2）動脈注射は、静脈注射と比べて患者への危険性が高いので、看護業務には含まれない。"},{"year":"2016","category":"医学・医療系","question_number":33,"question_text":"ある疾患と検査について、真陽性a人、偽陰性b人、偽陽性c人、真陰性d人であるとき正しいのはどれか。","choice1":"感度＝a/（a+b)、特異度＝c/(c+d)","choice2":"感度＝a/（a+b)、特異度＝d/(c+d)","choice3":"感度＝a/（a+c)、特異度＝d/(b+d)","choice4":"感度＝（a+b)/(a+b+c+d)、特異度＝(c+d)/(a+b+c+d)","choice5":"感度＝（a+c)/(a+b+c+d)、特異度＝(b+d)/(a+b+c+d)","correct_answer":2,"correct_answers":[2],"explanation":"病気を持っているか 有 無 検査の結果 陽性 真陽性(a) 偽陽性(c) 陰性 偽陰性(b) 真陰性(d)"},{"year":"2016","category":"医学・医療系","question_number":34,"question_text":"血液学的検査に含まれるのはどれか。","choice1":"ＣＥＡ","choice2":"γ－ＧＴＰ","choice3":"アルブミン","choice4":"クレアチニン","choice5":"ヘマトクリット","correct_answer":5,"correct_answers":[5],"explanation":"1)CEAは腫瘍マーカー 2)γ-GTP（γ-GT）は酵素 3)アルブミンはタンパク質 4)クレアチニンは腎機能の評価のために行われる検査で、いずれも血漿または血清中の濃度が測定されるが血液学的検査ではない。 5)ヘマトクリットは血液の中で赤血球容積の割合（％）を示す基本的な血液学的検査項目である。 補足】 『血液学検査とは抗凝固剤で血液を凝固させずに使用し、赤血球数・白血球数・血小板数の測定や血液細胞の形態観察、凝固・線溶関連（血液の固まり易さ） などをする検査です。 この検査は、貧血・多血症、炎症・腫瘍、出血・血栓症などのスクリーングとして初診時の基本検査や血液疾患の診断や経過観察などに用いられています。』 下記Webページより引用 参考文献サイト】 検査ガイド.com"},{"year":"2016","category":"医学・医療系","question_number":35,"question_text":"肝炎の診断に有用なのはどれか。","choice1":"尿酸","choice2":"ＣＲＰ","choice3":"白血球数","choice4":"アミラーゼ","choice5":"ＡＬＴ（ＧＰＴ）","correct_answer":5,"correct_answers":[5],"explanation":"1)尿酸は高尿酸血症や痛風の診断 2)CRPは各種炎症性疾患の活動性や重症度の判定 3)白血球数は細菌感染症や血液疾患の診断 4)アミラーゼは膵炎唾液腺疾患の診断の目的で測定される 5)ALP（GPT）は主に肝細胞内に存在する酵素で、肝炎により幹細胞の壊死・破壊が起こると血中に溢流し、その程度を反映して血清の活性が上昇するため、肝炎の診断には必須の検査"},{"year":"2016","category":"医学・医療系","question_number":36,"question_text":"食事の影響が大きい検査項目はどれか。","choice1":"ＣＲＰ","choice2":"中性脂肪","choice3":"白血球数","choice4":"ＨbＡ1c","choice5":"ＡＬＴ（ＧＰＴ）","correct_answer":2,"correct_answers":[2],"explanation":"1)CRPや3）白血球数は食事内容だけでは変動しない。 2)中性脂肪は、脂質異常症の有無に拘らず、健常者でも食後に血中濃度が上昇し、長時間その影響が残るため、早朝空腹時の採血が必須となっている。 4)HbA1cは過去1月程度の期間の平均血糖値を反映して変動し、その期間の食事の影響を受け、5)ALT（GPT）はアルコールによる肝障害で上昇することがあるが、健常者では影響は少ない。"},{"year":"2016","category":"医学・医療系","question_number":37,"question_text":"バイタルサインでないのはどれか。","choice1":"血圧","choice2":"体温","choice3":"腹囲","choice4":"呼吸数","choice5":"脈拍数","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)腹囲はバイタルサインには含まれない。 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":38,"question_text":"放射線被ばくのない検査はどれか。","choice1":"ＣＴ検査","choice2":"ＰＥＴ検査","choice3":"核医学検査","choice4":"超音波検査","choice5":"血管造影検査","correct_answer":5,"correct_answers":[5],"explanation":"1)Ｘ線を利用 2)γ線を利用 3)γ線を利用 4)超音波検査は、極短波長の音波を利用する。 5)Ｘ線を利用 1) 2) 3) 4) 5)MRIで広く使われるのはガドリニウム系造影剤。ヨード系造影剤は、主にCTで使われる。"},{"year":"2016","category":"医学・医療系","question_number":41,"question_text":"診療録の１号用紙の記載事項でないのはどれか。","choice1":"傷病名","choice2":"患者住所","choice3":"治療方法","choice4":"患者生年月日","choice5":"被保険者証記号・番号","correct_answer":3,"correct_answers":[3],"explanation":"様式第1号は、(1)の1から(1)の3に分かれている。様式第1号の(1)の1には、受信者の氏名、生年月日、性別、住所、職業、被保険者との続柄、保険者番号、被保険者証および被保険者手帳の記号・番号、有効期限、被保険者氏名などの被保険者に関する情報、傷病名、開始、終了、転帰ならびに期間満了予定日、労務不能に関する意見、および公費負担医療の受給者番号などが記載される。 様式第1号の(1)の2には、既往歴、原因、主要症状、経過、処方、手術、処置等 様式第1号の(1)の3には、診療の種別、月日、点数、負担金徴収額、食事療養算定額、標準負担額等 1) 2) 3)→２号用紙 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":42,"question_text":"以下の組み合わせで誤っているのはどれか。","choice1":"看護経過記録　　　－　叙述型記録","choice2":"看護計画　　　　　－　看護ワークシート","choice3":"看護サマリー　　　－　必要に応じて作成","choice4":"患者基本情報　　　－　退院後の指導の資料","choice5":"熱型表　　　　　　－　看護ケアで得られる情報が多い","correct_answer":2,"correct_answers":[2],"explanation":"1)看護の経過記録には、順を追って経過を記録した叙述型記録と、図や記号などを用いて経過を一覧できる経過一覧表（フローシート、熱型表）とがある。叙述的な記録には、SOAP形式による記録、フォーカスチャーティングによる記録などがある。 2)看護計画は、患者単位に提供する看護ケアの計画を記載したもので、看護ワークシートは、看護師が行う看護業務を病棟やチームごとにあるいは、行為別にまとめたものである。 3)患者の経過を要約したもので、必要に応じて作成する。 4)患者基本情報は、看護を必要とする人の、現在あるいは今後必要な看護ケアの問題を判別するための基本的情報であり、退院指導に必要不可欠である。 5)熱型表（経過一覧表、温度板）は、一定期間のバイタルサイン、水分出納、食事摂取状況等の情報を記載することができる縦と横の表分割になっている。熱型表に記載されている項目は、看護ケアで得られるものが多い。"},{"year":"2016","category":"医学・医療系","question_number":43,"question_text":"病棟日誌の記録項目でないのはどれか。","choice1":"退院患者数","choice2":"入院患者数","choice3":"紹介患者数","choice4":"外出・外泊患者数","choice5":"救護区分別患者数","correct_answer":3,"correct_answers":[3],"explanation":"「基本診療料の施設基準等」では、看護業務に関する記録としては、看護業務の管理に関する記録と看護業務の計画に関する記録の記載が義務づけられている。看護業務の管理に関する記録は、通常、病院（管理）日誌や看護管理日誌と呼ばれており、患者の移動、特別な問題を持つ患者の状態及び特に行われた診療などに関する概要、看護要因の勤務状況並びに勤務交代に際して申し送る必要のある事柄等を記録したもの。 1) 2) 3)紹介患者数は特に記載の必要はない 4) 5)"},{"year":"2016","category":"医学・医療系","question_number":44,"question_text":"保険薬局における保険処方箋の保存義務年数はどれか。","choice1":"２年","choice2":"３年","choice3":"５年","choice4":"１０年","choice5":"２０年","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5) 参考文献サイト】 保険薬局及び保険薬剤師療養担当規則第 6 条 ？"},{"year":"2016","category":"医学・医療系","question_number":45,"question_text":"症例対照研究で得られるのはどれか。","choice1":"発症率","choice2":"有病率","choice3":"オッズ比","choice4":"バイアス","choice5":"相対危険度","correct_answer":3,"correct_answers":[3],"explanation":"症例対照研究では、ある疾病の患者集団と罹患したことない対象集団において、原因であろう要因に暴露された者を、過去にさかのぼり調査する。この場合、両集団の総和はそれらの母集団を反映しないため、1)発症率、2)有病率、4)バイアス、5)相対危険度は得られない。3)しかし、ある事象の起こる確率を起こらない確率で割る値（オッズ）は算出可能なため、患者集団と対象集団それぞれのオッズの比（オッズ比）は計算される。なお、疾患がまれなものであれば、オッズ比は相対危険度の値に近似する。"},{"year":"2016","category":"医学・医療系","question_number":46,"question_text":"治験の過程で行われるのはどれか。","choice1":"横断的研究","choice2":"コホート研究","choice3":"症例対照研究","choice4":"生態学的研究","choice5":"臨床薬理試験","correct_answer":5,"correct_answers":[5],"explanation":"1)横断的研究は、対象集団のある時点の疾病の有病率とリスクの保有状況を調査するものである。 2)コホート研究は要因の暴露群と非暴露群からなる集団を追跡調査し、疾病の罹患率やリスクの相対危険度を求めるものである。 3)症例対照研究は、患者群と対照群の比較によりリスクのオッズ比を求める研究である。 4)生態学的研究は、異なる地域の集団を比較して要因と疾病の関係を検討する研究である。 5)臨床薬理試験は、地検の第Ⅰ相試験として、健常者を対象に薬物動態や安全性の検討のために行われる臨床試験である。"},{"year":"2016","category":"医学・医療系","question_number":47,"question_text":"データのばらつきを示す指標はどれか。","choice1":"最頻値","choice2":"中央値","choice3":"平均値","choice4":"標準偏差","choice5":"変動係数","correct_answer":4,"correct_answers":[4,5],"explanation":"正答は4、5。　1)再頻値は、度数の最も多い階級値である。 2)中央値は、有限個のデータの大きさの順に並べたとき、中央に位置する値である。 3)平均値は、観測地の総和を観測地の個数で割った値である。 4)標準偏差は、平均値と各資料の値の差（偏差）の２乗し、その算術平均地の平方根を取った値であり、ばらつきの指標である。 5)変動係数は、標準偏差を算術平均値で割った値であり、相対的なばらつきの指標でもある。"},{"year":"2016","category":"医学・医療系","question_number":48,"question_text":"特性が類似するものの集団を作ることで対象を分類する分析方法はどれか。","choice1":"判別分析","choice2":"分散分析","choice3":"重回帰分析","choice4":"主成分分析","choice5":"クラスター分析","correct_answer":5,"correct_answers":[5],"explanation":"1)判別分析は、新データが事前に与えられたグループのどれに属すかを知る分析法である。 2)分散分析は、データ変動を誤差変動と各要因およびそれらの交互作用による変動に分け、要因および交互作用の効果を判定する分析法である。 3)重回帰分析は、１つまたは複数の説明変数と１つの目的変数の関係を求め、説明変数から目的変数を推定する分析法である。 4)主成分分析は、多くの変数に重みをつけて少数の合成変数を作る分析法である。 5)クラスター分析は、特製の似た者同士を集めて任意の数のクラスター（群）に分類する分析法である。"},{"year":"2016","category":"医学・医療系","question_number":49,"question_text":"ある事象が発生する確率に対する複数要因の関与を解析する手法はどれか。","choice1":"Ｆ検定","choice2":"分散分析","choice3":"順位和検定","choice4":"χ2（カイ２乗）検定","choice5":"ロジスティック回帰分析","correct_answer":5,"correct_answers":[5],"explanation":"1)Ｆ検定　4)χ2（カイ２乗）検定は、検定統計量がそれぞれＦ分布、χ2分布に従うような場合に用いられる検定法である。 2)分散分析は、３郡以上の平均値の比較を行う検定法。 3)順位和検定は、測定値の大小関係（順位）を用いて２郡の母集団文武の同一性を検定するノンパラメトリックな検定法である。 5)ロジスティック回帰分析は、疾患の発症など、事象の発生確率を複数の要因の有無や程度の関数として表現するモデルを用いた解析手法で、疾患発症の危険因子を探索する疫学研究でしばしば用いられる。"},{"year":"2016","category":"医学・医療系","question_number":50,"question_text":"定量的検査で感度を高くした際に、一般的に高くなるのはどれか。","choice1":"特異度","choice2":"偽陰性率","choice3":"偽陽性率","choice4":"陰性予測値","choice5":"陽性予測値","correct_answer":3,"correct_answers":[3],"explanation":"上図が一般的なイメージなんですが、よりわかりやすくするために次の図のように「インフルエンザ」を当てはめてみました。 分布のグラフとか検査数値はウソです。あくまでもグラフをイメージするために「インフルエンザ」という言葉を借りてきただけです。 さて、上図のようになります。 インフルエンザにかかっている人（赤）の検査結果をみると、検査数値125くらいの人が多いですが、60くらいのかたもいますし、150くらいのかたもいます。このあたりは個人差です。 かかってない人（青）の検査結果をみると、検査数値60くらいの人が多いですが、もっと小さい方もいますし、中には100を超える人もいます。健康なのにもともと数値が高い人っていますよね。これも個人差です。 検査結果によって、陽性と陰性を分ける境界をカットオフ値といいます。 この例ではカットオフ値を 100にしているので、検査結果が100以上の方は「陽性」、100以下の方は「陰性」と判定されます。 病気にかかっているのに、検査結果が100以下＝検査「陰性」となった方を「偽陰性」といいます。 図で言うと、赤い山のうち、カットオフ値の左側に入っている部分が偽陰性です。 また、病気にかかっていない（青い山）のに、検査結果が100以上＝検査「陽性」となった方を「偽陽性」といいます。 図で言うと、青い山のうち、カットオフ値の右側に入っている部分が偽陽性です。 感度＝病気にかかっている人がどれだけ「陽性」と判定されるか＝赤い山がどれだけカットオフ値の右側に入るか ということなので、 カットオフ値が低ければ低いほど（カットオフ値が左に寄れば寄るほど）感度はあがります。 点線のカットオフ値(b)のように、カットオフ値を 60くらいにしてしまえば、 病気にかかっている人たち（赤線の山）はすっぽりと陽性に入り、感度はたかくなります。 その反面、病気でない人たち（青線の山）の半分くらいも陽性となってしまいます。 つまり、偽陽性が増えてしまいます。"},{"year":"2016","category":"医療情報システム系","question_number":1,"question_text":"医療情報とその特性の組み合わせで誤っているのはどれか。","choice1":"心電図　　　　　　　ー　波形情報","choice2":"血液生化学検査　　　ー　数値情報","choice3":"聴診による呼吸音　　ー　音声情報","choice4":"患者ID　　　　　　　ー　コード情報","choice5":"３次元CT　　　　　　ー　動画像情報","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)3次元CTは、CTの複数断層の画像データを基にコンピュータ処理により立体構造として描画したものであり、動画像ではない。"},{"year":"2016","category":"医療情報システム系","question_number":2,"question_text":"以下の検査で得られるデータが画像情報でないのはどれか。","choice1":"眼底検査","choice2":"脳波検査","choice3":"胸部CT検査","choice4":"腹部超音波検査","choice5":"頭部MRI検査","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)脳波検査のデータは、波形データである。 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":3,"question_text":"一般に、１検査・１件あたりのデータサイズが最も大きい画像データはどれか。","choice1":"頭部MRI画像","choice2":"腹部超音波画像","choice3":"胸部単純X線画像","choice4":"同意書スキャン画像","choice5":"病理バーチャルスライド画像","correct_answer":5,"correct_answers":[5],"explanation":"1)頭部MRI画像は１枚0.5MB (画素数:512*512,濃度階調14bitの場合) そのため、１検査当たり150枚撮影した場合、約75MB 2)腹部超音波画像は１枚0.3MB (画素数:640*480,濃度階調8bitの場合) そのため、１検査当たり10枚撮影した場合、約3MB 3)腹部単純X線画像は１枚8MB (画素数:2048*2048,濃度階調10bitの場合) そのため、１検査当たり4枚撮影した場合、約30MB 4)同意書スキャン画像は24bitカラースキャンであっても数MB以下 5)病理バーチャルスライド画像は スライド１枚 1～10GB,圧縮しても1)～4)の画像と比べるとデータサイズは大きい"},{"year":"2016","category":"医療情報システム系","question_number":4,"question_text":"医療情報の一次利用にあたるのはどれか。番","choice1":"教育への利用","choice2":"研究への利用","choice3":"政策の立案・検証への利用","choice4":"診療報酬請求のための利用","choice5":"医薬品・医療機器等の開発","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)診療報酬請求のための利用は、診療情報を医療行為の公的書類作成のために用いることのひとつであり、一時利用である。 5) 1)2)3)5)は患者の診療目的や医療行為の公的書類作成のための利用ではなく、診療情報の二次利用に当たる。"},{"year":"2016","category":"医療情報システム系","question_number":5,"question_text":"診療データの二次利用にあたるのはどれか。","choice1":"治療方針決定のために診療情報を利用した。","choice2":"インシデントレポートの作成に診療情報を利用した。","choice3":"経営上の指標データを得るために、診療情報を用いた。","choice4":"患者とのインフォームドコンセントに検査データを用した。","choice5":"セカンドオピニオンのために、他の病院に検査データを提供した。","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　1) 2)インシデントレポート作成に診療情報を利用することは、患者の診療や医療行為の公的書類作成を目的とした利用ではなく、病院の安全管理のための活動を方向付ける管理資料としての利用であり、二次利用に当たる。 3)経営上の指標データを得るために診療情報を用いることお、病院経営管理のための利用であり、二次利用に当たる。 4) 5) 1)4)5)は患者の診療を目的とした診療情報の利用であり、一時利用に当たる。"},{"year":"2016","category":"医療情報システム系","question_number":6,"question_text":"2015年に改正された「個人情報の保護に関する法律」について誤っているものはどれか。","choice1":"「個人情報」は、生存する個人に関する情報である。","choice2":"「要配慮個人情報」には、本人の信条は含まれない。","choice3":"携帯電話の通信機器IDは、「個人識別符号」に含まれない。","choice4":"体の一部の特徴を変換した符号は、「個人識別符号」に含まれる。","choice5":"「匿名加工情報」は、個人が識別されないようにする必要がある。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 本人の信条も「要配慮個人情報」に含まれる 第二条 3 この法律において「要配慮個人情報」とは、本人の人種、信条、社会的身分、病歴、犯罪 の経歴、犯罪により害を被った事実その他本人に対する不当な差別、偏見その他の不利益が 生じないようにその取扱いに特に配慮を要するものとして政令で定める記述等が含まれる個 人情報をいう。 3) 4) 参考文献サイト】 個人情報保護法の改正概要"},{"year":"2016","category":"医療情報システム系","question_number":7,"question_text":"医療・介護関係事業者における個人情報の取り扱いについて誤っているのはどれか。","choice1":"患者からの要求に従って誤りを修正する必要がある。","choice2":"死亡患者に関する情報もガイドラインの対象となる場合がある。","choice3":"施設の清掃業者も、ガイドラインに十分配慮することが望ましい。","choice4":"氏名、生年月日、住所を削除すれば、本人同意なしで学会発表して良い。","choice5":"前月の患者情報の取扱い件数が５，０００件未満であってもガイドラインの対象となる場合がある。","correct_answer":4,"correct_answers":[4],"explanation":"1)患者には自分に関する情報が正しく記録されていることを確認し、誤りがあれば訂正を求める権利が保証されている。 2) 3) 4)医療関係の個人情報では、希少疾患の症例など、現病歴だけで個人が特定されてしまう場合があるため、診療目的以外の利用には同意が必要 5)医療・介護関係事業者における個人情報の適切な取扱いのためのガイドラインでは取り扱う個人データ数が過去６か月間に一度も５０００件を超えていない小規模事業者であってもガイドラインを遵守する努力を求めている。（２０１５年９月の個人情報保護法の改正により、個人情報取扱件数にかかわらず順守義務が生じることとなった） 個人情報保護についてルールには、個人情報保護法と医療・介護関係事業者における個人情報の適切な取扱いのためのガイドラインの２つがある。医療・介護事業者は法律である個人情報保護法と同様に、医療・介護関係事業者における個人情報の適切な取扱いのためのガイドラインを遵守しなければならない。 参考文献サイト】 【PDF】医療・介護関係事業者における個人情報の適切な取扱いのためのガイドライン"},{"year":"2016","category":"医療情報システム系","question_number":8,"question_text":"次のうち「OECDの８原則」に該当しないのはどれか。","choice1":"責任の原則","choice2":"公平性の原則","choice3":"利用制限の原則","choice4":"個人参加の原則","choice5":"データ整合性の原則","correct_answer":2,"correct_answers":[2],"explanation":"OECD（経済協力開発機構）はヨーロッパ諸国を中心に日・米を含め38ヶ国の先進国が加盟する国際機関です。OECDは国際マクロ経済動向、貿易、開発援助といった分野に加え、最近では持続可能な開発、ガバナンスといった新たな分野についても加盟国間の分析・検討を行っています。 OECD8原則とは、1980年9月にOECD（経済協力開発機構）の理事会で採択された「プライバシー保護と個人データの国際流通についての勧告」にある、「収集制限の原則」、「データ内容の原則」、「目的明確化の原則」、「利用制限の原則」、「安全保護の原則」、「公開の原則」、「個人参加の原則」、「責任の原則」の8項目の原則です ◆OECDの８原則◆ 収集制限の原則 データ内容の原則：収集する個人データは利用目的に適合しているものとし、正確、完全かつ最新のものに保つ。（→データ整合性の原則 と言ってもいい？） 目的明確化の原則 利用制限の原則 安全保護の原則 公開の原則 個人参加の原則 責任の原則"},{"year":"2016","category":"医療情報システム系","question_number":9,"question_text":"個人情報の取り扱いとして正しいのはどれか。","choice1":"病院で亡くなった方に対する親族からの問い合わせに答えた。","choice2":"個人情報を含む作業用データを保存したノートパソコンを院外へ持ち出した。","choice3":"患者に開業案内を送付するために病院情報システムの住所リストを利用した。","choice4":"院内の許可を得た上で、ファイルにパスワードを付け、利用後は速やかに消去した。","choice5":"警察からの電話問い合わせに対して、即座に患者の生年月日、住所、電話番号などを回答した。","correct_answer":4,"correct_answers":[4],"explanation":"1)診療記録の開示を求め得る者の範囲は、患者の配偶者、子、父母およびこれに準ずる者（「診療情報等の提供に関する指針」）とされている。そのため、親族であるからといってもみだりに答えるべきではない。 2)院外へ持ち出すことは避けるべき 3)個人情報の目的外利用 4) 5)警察や検察等捜査機関からの照会や事情聴取に答える際は、問い合わせに対してその目的や情報提供を求めた捜査官の役職、氏名を確認したうえで答えるべきである。そのため、即座に回答することは適切ではない。"},{"year":"2016","category":"医療情報システム系","question_number":10,"question_text":"医療情報システムの利用者の責務として誤っているのはどれか。","choice1":"参照した情報を目的外に利用しない。","choice2":"代行入力の場合、依頼者が確定操作を行う。","choice3":"代行入力者に依頼者のパスワードを知らせておく。","choice4":"作業終了あるいは離席するときはシステムのログアウト操作を行う。","choice5":"システムへの不正アクセスを発見した場合は速やかに運用責任者に連絡する。","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":11,"question_text":"遠隔診療に関する厚生労働省通知※の中で、条件によって認められているのはどれか。","choice1":"遠隔診療での再診","choice2":"遠隔診療での死亡確認","choice3":"カルテの電子データ開示","choice4":"遠隔診療での新規患者の診察","choice5":"医師以外の担当者による遠隔医療行為","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":12,"question_text":"在宅医療介護連携ネットワークシステムの構築に際して、適切でないのはどれか。","choice1":"運営主体を明確にして推進する。","choice2":"利潤を優先してシステムを構築する。","choice3":"まず地域の在宅医療介護連携の在り方の構想を策定する。","choice4":"住民をはじめ地域の関係者間で協議できる環境を設定する。","choice5":"在宅医療介護連携の実態を調査し、解決すべき課題・問題点を明らかにする。","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":13,"question_text":"介護保健関連のシステムについて、誤っているのはどれか。","choice1":"一次判定は高齢者の心身の状況調査及び主治医意見書に基づいて行われる。","choice2":"介護支援事業所では様々なケアマネジメント支援情報システムが用いられる。","choice3":"医療依存度が高い介護サービス利用者のため医療と介護の情報共有が重要である。","choice4":"要介護の一次判定に用いるソフトウェアは都道府県ごとの実情にあわせて定められている。","choice5":"介護事業者がインターネットを使って請求するための電子証明書は国保連合会が発行する。","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)全国一律 5) 参考文献サイト】 厚生労働省サイト"},{"year":"2016","category":"医療情報システム系","question_number":14,"question_text":"事業者が行う定期健康診断等について誤っているのはどれか。","choice1":"事業者は定期健康診断の結果を５年間保管する必要がある。","choice2":"実施機関は定期健康診断の結果を５年間保管する必要がある。","choice3":"事業者はストレスチェックの結果を５年間保管する必要がある。","choice4":"全国健康保険協会は事業者に特定健診データの電子的な提供を求めている。","choice5":"有機溶剤を使用する業務の従事者に対しては一般的な検査項目以外の項目が加えられる。","correct_answer":3,"correct_answers":[3],"explanation":"1) 正しい(労働安全衛生法) 2) 正しい(医師法および歯科医師法) 3) ストレスチェックは、労働者に受検の義務がない。そのため、労働者の同意を得ないで事業者がその結果を得ることは禁じられている。したがって、事業者はストレスチェックの結果のすべてを得ることはできず、3）は適切とはいえない。（よくわからない解説ですが、過去問テキストの説明をそのまま転写しています） 4) 正しい(「高齢者の医療の確保に関する法律」) 5) 正しい(労働安全衛生法) 参考文献サイト】 &blanklink(hogehoge){}"},{"year":"2016","category":"医療情報システム系","question_number":15,"question_text":"総合健診（人間ドック）に用いるシステムの機能としてもっとも必要性が低いのはどれか。","choice1":"予約管理機能","choice2":"XMLデータ作成機能","choice3":"PACSとの連携機能","choice4":"レセプトオンライン機能","choice5":"受診者ごとの検査結果管理機能","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)人間ドック(自由診療)システムに診療報酬(=保険診療)請求機能)は必要性が低い 5)"},{"year":"2016","category":"医療情報システム系","question_number":16,"question_text":"病病連携システムを構築する際に必須のシステム要件はどれか。","choice1":"連携用の物理的専門回線","choice2":"VPN等のセキュリティを考慮した通信","choice3":"連携元／連携先の両施設の患者IDの統一","choice4":"連携用のデータ仕様の共通化による診療情報の送受信","choice5":"連携元／連携先の両施設に同一の電子カルテシステム","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。"},{"year":"2016","category":"医療情報システム系","question_number":17,"question_text":"通常、地域医療連携システムの機能に含まれないのはどれか。","choice1":"返書管理","choice2":"紹介件数統計","choice3":"紹介情報登録","choice4":"地域がん登録","choice5":"医療機関情報登録","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)地域医療連携システムと地域がん登録はまったく別物だ。 5)"},{"year":"2016","category":"医療情報システム系","question_number":18,"question_text":"地域医療連携システムの目的でないのはどれか。","choice1":"薬剤の重複の回避","choice2":"患者のプライバシー保護の強化","choice3":"地域全体としての医療費の抑制","choice4":"病診間、病病間での連携医療の促進","choice5":"診療情報共有による診療の質の向上","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 患者のプライバシー保護に留意することは必要だが、これを目的として地域医療連携システムを導入するわけではない。 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":19,"question_text":"医師事務作業補助者が利用するシステムはどれか。","choice1":"看護管理システム","choice2":"診断書作成システム","choice3":"放射線部門システム","choice4":"オーダエントリシステム","choice5":"レセプト電算処理システム","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1) 看護師 2) 3) 受付事務, 診療放射線技師 4) 5) 医療事務"},{"year":"2016","category":"医療情報システム系","question_number":20,"question_text":"初診患者の患者基本情報（氏名、住所、生年月日、保健情報）の登録を行うシステムはどれか。","choice1":"医事会計システム","choice2":"地域連携システム","choice3":"債権管理システム","choice4":"電子カルテシステム","choice5":"オーダエントリシステム","correct_answer":1,"correct_answers":[1],"explanation":"1) ・ 2) 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":21,"question_text":"レセプトオンライン請求の記述について誤っているのはどれか。","choice1":"再請求もオンラインでできる。","choice2":"医薬品はHOTコードで請求する。","choice3":"電子証明書の取得が必要である。","choice4":"ASPにより事務的な誤りをリアルタイムで確認できる。","choice5":"セキュリティを確保することで、通常のインターネット回線でも請求できる。","correct_answer":2,"correct_answers":[2],"explanation":"レセプトオンライン請求で作成される電子レセプトは、厚生労働省が定めた記録条件仕様に基づき、レセプト電算処理システムに使用する各種基本マスターのコードを使ってCSV形式のテキストデータとして作成される 1) 2)→レセプト電算処理コード（=支払基金コード）を使用する HOTコードは、MEDIS-DCがメンテナンスする医薬品HOTコードマスターで用いられる管理番号であり、汎用される4種の医療用医薬品コード(薬価基準収載医薬品コード、個別医薬品(YJ)コード、レセプト電算処理システム用コード、JANコード)をひもづけるためのコードである。電子レセプトの医薬品の識別には、基本マスターである医薬品マスターの9桁の医薬品コード(レセプト電算処理システム用コード)が用いられる。 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":22,"question_text":"レセプト電算処理において、支払基金が提供していないマスタはどれか。","choice1":"歯式マスタ","choice2":"傷病名マスタ","choice3":"医薬品マスタ","choice4":"看護行為マスタ","choice5":"調剤行為マスタ","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":23,"question_text":"診療報酬算定可能な電子的診療情報提供書の要件はどれか。","choice1":"規格はCDAとすること","choice2":"媒体はCD-Rとすること","choice3":"電子署名はHPKIとすること","choice4":"ファイルはPDF形式とすること","choice5":"通信はインターネットを使用しないこと","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)HPKIは、医師・薬剤師・看護師など保健医療福祉分野の27種類の国家資格と、 院長・管理薬剤師など5種類の管理者資格を電子的に認証することができる 厚生労働省が認めた唯一の電子証明書です。 医師・歯科医師の署名は、HPKIで行うことが義務付けられている 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":24,"question_text":"以下に示す電子カルテの機能のうち、多職種で入力できる必要がないのはどれか。","choice1":"褥瘡管理","choice2":"看護サマリ","choice3":"院内感染管理","choice4":"入院診療計画書","choice5":"クリニカルパス","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":25,"question_text":"通常、予約枠を設定して行う検査はどれか。","choice1":"尿定性検査","choice2":"胃内視鏡検査","choice3":"病理組織検査","choice4":"血液学的検査","choice5":"安静時心電図検査","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":26,"question_text":"代行入力する場合の運用や機能として誤っているはどれか。","choice1":"麻薬の投与を代行できない運用とすること","choice2":"承認操作はできるだけ速やかに行われていること","choice3":"代行依頼者のログインIDとパスワードでログインして利用すること","choice4":"必ず代行依頼者を指定し、承認操作が可能なシステムとなっていること","choice5":"","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)→代行入力者のログインIDとパスワードでログインする 5)"},{"year":"2016","category":"医療情報システム系","question_number":27,"question_text":"病棟の注射薬の運用には一本渡し運用と定数配置運用がある。定数配置運用の説明として誤っているのはどれか。","choice1":"注射オーダが必要である。","choice2":"期限切れの薬剤が出やすい","choice3":"重症系病棟での運用に適している","choice4":"病院全体の注射薬の在庫を削減できる","choice5":"薬の取り出し時の間違いが発生しやすい","correct_answer":4,"correct_answers":[4],"explanation":"一本渡し・・・注射オーダーが来たら１患者１回ごとに注射薬を薬剤部から病棟へ払い出して、注射を実施するやりかた 定数配置・・・病棟に一定数の注射薬をストックしておいて、オーダーに応じて注射実施するやりかた 1)〇：定数配置だからといって注射オーダーが必要ないわけではない（と思う） 2)〇：各病棟で注射薬の在庫を持っているので、期限切れも出やすい 3)〇：必要時にすぐに注射できるので重症系病棟に向いている（一回ごとに薬剤部から払い出すよりも早く投与できる） 4)×：各病棟で注射薬の在庫を持っているので、病院全体としては在庫が多くなってしまう。 5)〇：一本渡しの場合は、薬剤部の薬剤師→病棟の看護師 とチェックが増えるので、間違いが発生しにくい。それに比べれば、定数配置は間違いが発生しやすい。"},{"year":"2016","category":"医療情報システム系","question_number":28,"question_text":"処方オーダー時の処方内容チェックの対象でないはどれか。","choice1":"体重","choice2":"入院歴","choice3":"内服薬歴","choice4":"注射薬歴","choice5":"病名情報","correct_answer":2,"correct_answers":[2],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":29,"question_text":"抗がん剤投与の為に利用するレジメンシステムに関する以下の記述のうち、適切でないのはどれか。","choice1":"休薬期間は医師の裁量で自由に設定する。","choice2":"レジメンは権限のある者だけが登録できる。","choice3":"実施当日に改めて投与の可否の判定を入力する。","choice4":"登録するレジメンは診療科や疾患別に整理し管理する。","choice5":"薬剤の投与量は患者の身体情報から自動で算出される。","correct_answer":1,"correct_answers":[1],"explanation":"レジメンとは がん薬物療法における抗がん薬、輸液、支持療法薬等を組み合わせた時系列的な治療計画をいいます。 抗がん薬の投与量、投与スケジュール、治療期間等が記載された治療計画書になります。 1)医師の自由裁量で旧約期間を設定することは適切でない 2) 3) 4) 5) 化学療法を計画する医師が自由にレジメンを作成することはできません。 使用する抗がん剤の科学的妥当性をはじめ、治療の安全性、 薬剤の相互作用などを複数の職種（医師、薬剤師、看護師など） によるチームで審査して、審査に合格したレジメンのみが実際に運用されています。"},{"year":"2016","category":"医療情報システム系","question_number":30,"question_text":"「お薬手帳（電子版）の運用上の留意事項について」（平成27年11月27日 厚生労働省通知）に記載されていないのはどれか。","choice1":"紙のお薬手帳を廃止すること","choice2":"利用者の求めに応じてQRコードを使用すること","choice3":"データ項目は「JAHIS標準フォーマット」に従うこと","choice4":"薬剤師が患者の了承なく、お薬手帳の情報を閲覧できること","choice5":"一人の患者の服薬情報を一元的に閲覧できる仕組みの構築が望ましいこと","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　1) 2) 3) 4) 5) お薬手帳（電子版）の運用上の留意事項について"},{"year":"2016","category":"医療情報システム系","question_number":31,"question_text":"検体検査システムについて誤っているのはどれか。","choice1":"検体到着処理を行ってから検査を実施する。","choice2":"同一検査項目であれば、基準値は一定である。","choice3":"基準値マスタは性別や年齢を考慮して設定する。","choice4":"同時に依頼された検査の結果がそろってから報告する。","choice5":"院内で実施する検査と院外で実施する検査の双方に対応する。","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1) 2) 同一検査項目であっても、測定手法が統一されていないものがあり、その場合は基準値が一致しないことがある。 3) 4) 同時に依頼された検査であっても、パニック値など主治医に可及的早期に報告すべき結果が得られた場合は、速報などの形で先に報告する。その場合でも、すべての結果がそろった時点で、改めてその項目も含めて報告する。 5)"},{"year":"2016","category":"医療情報システム系","question_number":32,"question_text":"生理機能検査システムについて誤っているのはどれか。","choice1":"画像を含むレポートを作成する機能がある。","choice2":"取り扱うデータ量は検査項目ごとに一定である。","choice3":"超音波検査の画像転送にはDICOMが用いられる。","choice4":"検査時に患者情報や検査目的を参照する機能がある。","choice5":"予約枠を越えてオーダする機能や必要に応じて予約枠を閉じる機能がある。","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 超音波、負荷心電図、脳波等の検査のデータ量は、症例により異なる。 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":33,"question_text":"内視鏡検査をオーダする際にシステムでチェックすべき項目はどれか。","choice1":"抗凝固薬の服用","choice2":"ペースメーカーの装着","choice3":"食物アレルギーの有無","choice4":"肝炎ウィルス感染の有無","choice5":"リハビリテーションの有無","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　1)内視鏡処置・治療により出血が止まらなくなる危険性があるため、事前確認が必要である 2)MRI検査の高磁場では機械の故障が発生する危険があるが、内視鏡検査では問題とならない 3) 4)体液や分泌物に肝炎ウィルスが出現するので、内視鏡自体やその他の物品が新たな感染源とならないようにする対策が必要である。 5)"},{"year":"2016","category":"医療情報システム系","question_number":35,"question_text":"病理検査に関するシステムについて誤っているのはどれか。","choice1":"診断の進捗管理を行う。","choice2":"術中迅速診断は予約を行う。","choice3":"シェーマなど画像の編集を行う。","choice4":"他の検査のレポート作成時に参照される。","choice5":"オーダ時点で必要な検体ラベルの枚数が決まる。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2)　迅速診断は病理部の体制確保が必要なので、予約が必要。 3) 4) 5)病理検体の数は、検査や手術時に、その腫瘍自体やリンパ節などを確認して決まるものであり、術前に確定することはできない。このため、オーダー時点でラベルの枚数は決定できない"},{"year":"2016","category":"医療情報システム系","question_number":36,"question_text":"放射線部門システムの機能に含まれないのはどれか。","choice1":"検査予約リストを印刷する。","choice2":"患者別に被曝線量を記録する。","choice3":"医療従事者の放射線被曝量を管理する。","choice4":"使用した医療物品名や数量を医事会計システムへ伝達する。","choice5":"DICOMのMWM機能により患者基本情報を検査装置へ送出する。","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 「病院システムとは別に管理されている」 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":37,"question_text":"PACSの基本機能でないのはどれか。","choice1":"画像生成","choice2":"画像保管","choice3":"画像配信","choice4":"画像検索","choice5":"画像参照","correct_answer":1,"correct_answers":[1],"explanation":"1) 生成するのは各モダリティ 2) 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":38,"question_text":"一次診断を行う際に、5メガピクセルのモニタが必要とされる検査はどれか。","choice1":"CT","choice2":"MRI","choice3":"PET","choice4":"超音波","choice5":"マンモグラフィ","correct_answer":5,"correct_answers":[5],"explanation":"1)2M 2)2M 3) 4) 5)5M"},{"year":"2016","category":"医療情報システム系","question_number":39,"question_text":"歯科口腔領域のシステムについて誤っているのはどれか。","choice1":"咬合検査など歯科独自の検査に対応している。","choice2":"貴金属の種類など歯科技工物の属性が取り扱える。","choice3":"保険請求に対応した会計と保険給付外の治療の会計ができる。","choice4":"歯科衛生士業務記録は、診療録と同じ5年間の保存義務がある。","choice5":"保険請求の単位は、1診療ごと、傷病名・処置部位ごとに診療行為を記述して算定する。","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) ×→3年 歯科衛生士法施行規則 第十八条『歯科衛生士は、その業務を行った場合には、その記録を作成して三年間これを保存するものとする。』 5)"},{"year":"2016","category":"医療情報システム系","question_number":40,"question_text":"輸液実施時に行われる3点認証の正しい組み合わせはどれか。","choice1":"医師・看護師・薬剤","choice2":"医師・看護師・薬剤師","choice3":"患者・オーダ者・実施者","choice4":"患者・実施者・オーダ番号","choice5":"実施者・オーダ番号・薬剤","correct_answer":4,"correct_answers":[4],"explanation":"「 患者・実施者・薬剤 」の選択肢なし。 JAHIS患者安全ガイドライン＜注射編＞に『オーダ番号等がバーコード印字され注射ボトル等に貼付されたシール』と記載があるので、”オーダ番号”が正解か。 【PDF】JAHIS患者安全ガイドライン＜注射編＞ p2『また患者様に付けられた患者番号が印刷されたバーコード付きのリストバンド、オーダ番号等がバーコード印字され注射ボトル等に貼付されたシールと無線ＬＡＮを利用したＰＤＡ又はノートパソコンに接続されたバーコードリーダを使用した３点チェックシステム「患者認証システム」についても導入されていることを前提とする。』 p16 注者実施フロー(図)"},{"year":"2016","category":"医療情報システム系","question_number":41,"question_text":"病棟指示について誤っているのはどれか。","choice1":"オーダされた指示は電子指示受けシステムに反映される。","choice2":"指示受け業務では内容が適切か看護師による確認が行われる。","choice3":"病棟指示一覧システムがあれば正確な進捗状況が把握できる。","choice4":"1回完結型指示と中止・修正するまで継続する指示が混在する。","choice5":"必要時指示（条件付き指示）にもとづき看護師は薬剤を投与できる。","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3) 誤り。指示の実施状況が必ずしもその都度登録されていない場合や「安静度」や「食事」などは中止or指示修正が出るまで継続する場合もある為、 病棟指示一覧システムがあったとしても正確な進捗状況を把握できない。 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":42,"question_text":"看護業務を支援するシステムとその説明の組み合わせで誤っているのはどれか。","choice1":"看護ワークシート　―　看護業務を一覧で表示","choice2":"看護サマリ　　　　―　ある一定期間の患者状態の要約","choice3":"看護計画　　　　　―　患者状態を維持的にグラフと表で表示","choice4":"患者基本情報　　　―　患者の基本的な身体状態を収集・把握","choice5":"経過記録　　　　　―　患者の日々の状態および看護ケア・処置の記録","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)看護計画は、患者の問題を解決するための個別的なケア計画を記載したものである。患者状態を経時的にグラフと表で表示したものは、経過表（温度表）である。 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":43,"question_text":"クリニカルパスシステムを構築するにあたりもっとも関係の薄い事項はどれか。","choice1":"タスク","choice2":"アウトカム","choice3":"オプトイン","choice4":"標準診療プロセス","choice5":"クリニカルインディケータ","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)患者にクリニカルパスを適用する際にはインフォームドコンセントは必要である。患者のオプトイン（明確な参加の意思の表明）は。システムの運用に関係する可能性はあるが、システム構築とは関係が薄い。 4) 5)重要な達成目標のこと"},{"year":"2016","category":"医療情報システム系","question_number":44,"question_text":"クリニカルパスシステムについて誤っているのはどれか。","choice1":"バリアンスへの対応が必要である。","choice2":"統計解析機能があることが望ましい。","choice3":"記録機能と一体化していることが望ましい。","choice4":"複数組み合わせることで多様な病態の患者に適用可能である。","choice5":"あらかじめセットされているオーダはどの職種でも発行できる。","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":46,"question_text":"システムテストを実施するのは誰か。","choice1":"病院長","choice2":"エンドユーザ","choice3":"システム開発者","choice4":"システム運用管理者","choice5":"医療機関の要件定義作成担当者","correct_answer":3,"correct_answers":[3],"explanation":""},{"year":"2016","category":"医療情報システム系","question_number":47,"question_text":"情報システムの導入にあたり病院側が主となって行うのはどれか。","choice1":"結合テスト","choice2":"リハーサル","choice3":"データベース設計","choice4":"運用マニュアル作成","choice5":"操作マニュアル作成","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。"},{"year":"2016","category":"医療情報システム系","question_number":48,"question_text":"保存義務のある文書等の電子保存の3基準における要求事項に該当しないのはどれか。","choice1":"作成の責任の所在を明確にすること","choice2":"病院職員全員が容易に利用できる操作性を有していること","choice3":"法令に定める保存期間内、復元可能な状態で保存すること","choice4":"情報の内容を必要に応じて肉眼で見読可能な状態に容易にできること","choice5":"故意または過失による虚偽入力、書換え、消去及び混同を防止すること","correct_answer":2,"correct_answers":[2],"explanation":"1) 真正性 2) 3) 保存性 4) 見読性 5) 真正性"},{"year":"2016","category":"医療情報システム系","question_number":49,"question_text":"電子カルテシステムの真正性確保を目的として行うのはどれか。","choice1":"機器設置場所への入室制限","choice2":"情報の修正履歴の保存とその管理","choice3":"クラークによる代行入力の承認作業","choice4":"システムの障害対策のための冗長化","choice5":"標準形式で記録するためのテンプレート作成","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　1) 保存性 2) 真正性 3) 真正性 4) 見読性 5) 標準形式で記録するためのテンプレートの作成は、診療情報の二次活用に関する内容であり、「電子保存の3基準」とは直接関係しない。"},{"year":"2016","category":"医療情報システム系","question_number":50,"question_text":"電子保存のための運用管理事項における見読性確保にあたるのはどれか。","choice1":"情報の所在管理","choice2":"更新履歴の保存","choice3":"システム障害対策","choice4":"作成者の識別及び認証","choice5":"バックアップ媒体の管理","correct_answer":1,"correct_answers":[1,3],"explanation":"正答は1、3。　1) 情報の所在管理 →見読性 2) 更新履歴の保存 →真正性 3) システム障害対策 →見読性 4) 作成者の識別及び認証 →真正性 5) バックアップ媒体の管理 →保存性"},{"year":"2016","category":"医療情報システム系","question_number":51,"question_text":"紙媒体等をスキャナ等で電子化保存する場合の実施計画書は、「医療情報システムの安全管理に関するガイドライン（第4.3版）」に基づいて作成される必要がある。ガイドラインに記載されていないのはどれか。","choice1":"実施記録の作成と記録項目","choice2":"個人情報保護管理責任者の特定","choice3":"運用管理規定の作成と妥当性の評価","choice4":"患者等への周知の手段と異議の申し立てに対する対応","choice5":"スキャン等で電子化を行ってから紙やフィルムの破棄までの期間、及び破棄の方法","correct_answer":2,"correct_answers":[2],"explanation":"”診療録等をスキャナ等により電子化して保存する場合”とは以下を想定して記載されている。 ・電子カルテ運用されているが、運用等の問題で紙媒体が残るまたは施行前の紙媒体がある場合 ・既に電子化している医療機関へ他院から紙媒体（例：診療情報提供書）を提供された場合 1) 実施記録の作成と記録項目 →「最低限のガイドラインの項」に記載されている。 2) 個人情報保護管理責任者の特定 →記載されていない。 3) 運用管理規定の作成と妥当性の評価 →「最低限のガイドラインの項」に記載されている。 4) 患者等への周知の手段と異議の申し立てに対する対応 →過去の紙媒体を電子化する場合に必要とされている。 5) スキャン等で電子化を行ってから紙やフィルムの破棄までの期間、及び破棄の方法 →過去の紙媒体をスキャンして保存する場合に求められる。"},{"year":"2016","category":"医療情報システム系","question_number":52,"question_text":"病院情報システムに障害が発生した際のシステム運用部門の対応として誤っているのはどれか。","choice1":"障害記録票に発生時の状況を記録した。","choice2":"関連部門に障害発生の第一報を伝えた。","choice3":"障害通報の内容を実際に操作して確認した。","choice4":"第一報が入った時点で即座に紙運用に切り替えた。","choice5":"障害の切り分けを行うため、発生している箇所の情報収集を行った。","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 紙媒体の記録と電子情報との整合性などの点から誤った対応 5)"},{"year":"2016","category":"医療情報システム系","question_number":53,"question_text":"地域医療ネットワークにおける標準化と関連のないのはどれか。","choice1":"XDS","choice2":"HL7","choice3":"PDQ","choice4":"DPC","choice5":"DICOM","correct_answer":4,"correct_answers":[4],"explanation":"1) 施設間医療情報交換についてのIHE統合プロファイル（XDS, XDR, XDM） 2) 施設間・システム間での臨床情報や管理情報を交換するための標準規約 3) 施設間患者情報参照についてのIHE統合プロファイル（PDQ, PIX） 4) 包括医療費支払い制度方式 5) 医療画像の交換規約(Digital Imaging and COmmunications in Medicine)"},{"year":"2016","category":"医療情報システム系","question_number":54,"question_text":"下記の組み合わせでもっとも関係が薄いのはどれか。","choice1":"ICD　－　病名","choice2":"PDI　－　音声","choice3":"CDA　－　診療文書","choice4":"MFER　－　医用波形","choice5":"DICOM　－　適合宣言書","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) PDI=Portable Data for Imaging:可搬媒体による画像データ交換 3) 4) 5)"},{"year":"2016","category":"医療情報システム系","question_number":55,"question_text":"標準規格に関する組み合わせで誤っているのはどれか。","choice1":"ICD-10　－　病名","choice2":"HOTコード　－　医薬品","choice3":"JLAC10　－　臨床検査","choice4":"ICD-9-CM　－　病理検査","choice5":"JJ1017　－　画像検査","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4) 「手術」で利用 5)"},{"year":"2016","category":"医療情報システム系","question_number":56,"question_text":"医療用医薬品に表示されているバーコード（GS1 DataBar）について、誤っているのはどれか。","choice1":"錠剤の1シート単位にも表示される。","choice2":"医療安全確保を目的の1つとしている。","choice3":"この表示に伴いJANコードは表示禁止となった。","choice4":"包装単位によりロットや有効期限も表示されている。","choice5":"使用することで診療報酬上の加算が認められている。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 2015/7より禁止 4) 5)GS1 DataBarを使用しても診療報酬上の加算は認められない 【PDF】厚労省「医療用医薬品へのバーコード表示の実施要項」の一部改正について"},{"year":"2016","category":"医療情報システム系","question_number":57,"question_text":"DPCと関係の深いコードはどれか。","choice1":"Kコード","choice2":"ICD-10","choice3":"JLAC10","choice4":"HOTコード","choice5":"JJ1017","correct_answer":1,"correct_answers":[1,2],"explanation":"正答は1、2。　1)Kコードは、医科診療報酬点数表の診療行為の中の手術・処置に振られたコードで、コードの頭文字にKが割り振られているため、Kコードと呼ばれている。 2)ICD-10は、WHOが作成している疾病及び関連保険問題の国際統計分類第10版のことである。ICD-10とKコードはDPCを決定するために必要なコードであり、関係が深い。 3)臨床検査のコード 4)医薬品のコード 5)画像検査のコード"},{"year":"2016","category":"医療情報システム系","question_number":58,"question_text":"JLAC10コードの説明として正しいのはどれか。","choice1":"日本臨床検査医学会が制定した臨床検査コード","choice2":"医療情報システム間における医療情報交換のための標準規約","choice3":"世界保健機構（WHO）の設定した、国際疾病分類の第10版","choice4":"DICOMを運用するにあたっての医療の放射線分野の標準コード","choice5":"約4900ある全ての診断群分類に対して14桁で構成される診断群分類番号","correct_answer":1,"correct_answers":[1],"explanation":"1) JLAC10 2) HL7 3) ICD-10 4) JJ1017 5) DPC"},{"year":"2016","category":"医療情報システム系","question_number":59,"question_text":"IHEに関する説明で誤っているのはどれか。","choice1":"通信にHL7とDICOMのみが使われている。","choice2":"マルチベンダ接続によりシステム構成の選択肢が増える。","choice3":"システムの導入にあたって打ち合わせや仕様書作成が容易になる。","choice4":"コネクタソンは特定の統合プロファイルとの適合性を検証するものである。","choice5":"分野（ドメイン）ごとに業務フローを決め、利用するメッセージなどを定めている。","correct_answer":1,"correct_answers":[1],"explanation":"1)HL7,DICOM,MFER,PDF,SVGが使われている。 機器間の通信にはHL7とDICOMが使われることが多いが、その他の通信規約が利用されることもある。 2) 3) 4) 5) IHEとは Integrating the Healthcare Enterprise の略で医療情報システムの相互接続性を推進する国際的なプロジェクトです。"},{"year":"2016","category":"医療情報システム系","question_number":60,"question_text":"SS-MIX2標準化ストレージに格納される項目に含まれないのはどれか。","choice1":"病名情報","choice2":"処方オーダ","choice3":"読影レポート","choice4":"退院時サマリ","choice5":"アレルギー情報","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　SS-MIX2標準化ストレージとは、多施設間での診療データの効率的な二次利用のために定められた診療情報の表現と格納形式の標準である。 1) 2) 3) 4) 5) 厚生労働省電子的診療情報交換推進事業（SS-MIX；Standardized Structured Medical Information Exchange）では平成１８年度に厚生労働省医政局が行った、標準的電子カ ルテ情報交換システム開発委託事業の成果を全国に普及・展開することを目的としてい る。"},{"year":"2017","category":"情報処理技術系","question_number":1,"question_text":"16進数の「36」と2進数の「1010101」の足し算の結果を2進数で表したのはどれか。","choice1":"10001010","choice2":"10001011","choice3":"10011001","choice4":"11011010","choice5":"11011011","correct_answer":2,"correct_answers":[2],"explanation":"【16進数「XY」を2進数に変換する】 16進数「X」,「Y」それぞれを2進数にしたものが「xxxx」,「yyyy」のとき 16進数「XY」を2進数であらわすと、「xxxxyyyy」となる。 16進数「3」,「6」それぞれを2進数であらわすと「0011」,「0110」なので 16進数「36」を2進数であらわすと、「00110110」となる。 00110110 + 1010101 = 10001011 より、回答する選択肢は「2」"},{"year":"2017","category":"情報処理技術系","question_number":2,"question_text":"情報の単位の接頭辞のT(テラ)の表現として正しいのはどれか。","choice1":"10の  3乗","choice2":"10の  6乗","choice3":"10の  9乗","choice4":"10の 12乗","choice5":"10の 15乗","correct_answer":4,"correct_answers":[4],"explanation":"1) キロ 2) メガ 3) ギガ 4) テラ 5) ペタ あまり良くない問題。 10の3乗の累乗で表すのは国際単位系（SI）での話。 情報分野では、2の10乗の累乗で表すのが標準（10の3乗の累乗とは値が異なる）。 2進表現での「T（テラ）」を明示したい場合は「Ti（ティビ）」を使う。 ただし、ハードディスクの容量等、歴史的な経緯から慣習的に国際単位系の表現が残っている分野もある。 参考文献サイト】 2進接頭辞 – Wikipedia"},{"year":"2017","category":"情報処理技術系","question_number":3,"question_text":"表の結果が得られる演算はどれか。","choice1":"X OR Y","choice2":"X AND Y","choice3":"NOT(X OR Y)","
