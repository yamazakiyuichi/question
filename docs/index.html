を行うサービス名 3)TCPとは、1対1のセッションによる信頼性の高い通信を行うためのプロトコルである。 Transmission Control Protocolの略称で、インターネットの主要なプロトコルの1つである。 パケットの再送やエラー訂正などを行う機能を持っているため、確実性をもった通信を行いたい場面で利用される。 4)トランスポート層で用いられるがコネクションは確立しない インターネットで標準的に使われているプロトコルの一種で、 「User Datagram Protocol」の略です。 インターネット・プロトコル(IP)を使ったネットワークにおいて、 アプリケーション同士が最小限の仕組みでデータを送受信できるように考案された、 シンプルなプロトコルです。 5)物理層で用いられる通信用ケーブル構造の一つで、電磁ノイズを遮断するシールド加工を行っていない線のこと"},{"year":"2019","category":"情報処理技術系","question_number":23,"question_text":"192.168.32.0/23のサブネットマスクはどれか。","choice1":"255.255.248.0","choice2":"255.255.252.0","choice3":"255.255.254.0","choice4":"255.255.255.0","choice5":"255.255.255.128","correct_answer":3,"correct_answers":[3],"explanation":"24ビット以降が0のため 1) ・ 2) 3) 4) 5)"},{"year":"2019","category":"情報処理技術系","question_number":24,"question_text":"電子メールの受信に使うサービス名称とポート番号の組み合わせで正しいのはどれか","choice1":"POP3   – 993","choice2":"SMTP   – 465","choice3":"POP3s  – 995","choice4":"SMTPs  –  25","choice5":"IMAP4s – 110","correct_answer":3,"correct_answers":[3],"explanation":"1)110 2)25 3) 4)465 5)993"},{"year":"2019","category":"情報処理技術系","question_number":25,"question_text":"Webブラウザを使って","choice1":"にアクセスすると、「サーバーのIPアドレスが見つかりませんでした」と表示された。原因として考えられるのはどれか。","choice2":"ページが存在しない","choice3":"DNSサーバーが停止していた","choice4":"ファイルのアクセス権がない","choice5":"サーバーの内部処理が不正である","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3)の場合は「アクセスが拒否されました」や「アクセス権がありません」と表示される 4)「500　内部サーバーエラーです」 5)「アクセスできません」や「サイトが停止しています」などのように表示される"},{"year":"2019","category":"情報処理技術系","question_number":26,"question_text":"VLANの説明として正しいのはどれか","choice1":"データを暗号化して通信できる","choice2":"物理的なネットワーク分割である","choice3":"信頼性を重視する通信で使われる","choice4":"ネットワーク設定情報が自動的に提供される","choice5":"1台のスイッチに複数のネットワークを割り当てられる","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)"},{"year":"2019","category":"情報処理技術系","question_number":27,"question_text":"無線LANを識別するための情報はどれか。","choice1":"CDMA","choice2":"MIME","choice3":"TKIP","choice4":"WPA2","choice5":"ESSID","correct_answer":5,"correct_answ rect_answers":[3,5],"explanation":"正答は3、5。　＜一次予防＞ 病気になる前の健康者に対して生活習慣を改善して健康を増進し、生活習慣病等を予防すること 予防接種による疾病の発生予防、事故防止による障害の発生を予防すること ＜二次予防＞ 病気になった人を健康診査等で早期に発見し、早期発見・早期治療、重症化を予防すること ＜三次予防＞ 疾病が発症した後、必要な治療やリハビリテーションを受け、機能の維持・回復を図り、社会復帰を支援すること また、再発予防もこれに含まれる 1)三次予防 2)一次予防 3)二次予防 4)一次予防 5)二次予防"},{"year":"2019","category":"医学・医療系","question_number":2,"question_text":"リスボン宣言に含まれないのはどれか。","choice1":"秘密保持","choice2":"自己決定権","choice3":"尊厳性の尊重","choice4":"代理人の役割","choice5":"パターナリズムの普及","correct_answer":5,"correct_answers":[5],"explanation":"＜患者の権利に関するリスボン宣言＞ １．良質の医療を受ける権利 ２．選択の自由の権利 ３．自己決定の権利 ４．情報を得る権利 ５．プライバシーを守られる権利 ６．人間としての尊厳を得る権利 ・代理人の役割 意識の無い患者あるいは自己の意思を表現できない患者の場合、 インフォームドコンセントはできる限り患者の法律上の権限を有する 代理人（法定代理人）に求めるべきである →自己決定の権利となる ※パターナリズム（父権主義）とは ひと昔前までの医療の傾向。 患者さんは治療に関する自己決定権を医師に譲る（放棄する）形で、半ば強制的にその指示に従う"},{"year":"2019","category":"医学・医療系","question_number":3,"question_text":"「医師による診断・治療に関する十分な説明に基づく患者の同意」はどれか。","choice1":"ターミナルケア","choice2":"リビングウィル","choice3":"パートナーシップ","choice4":"セカンドオピニオン","choice5":"インフォームドコンセント","correct_answer":5,"correct_answers":[5],"explanation":"「医師による診断・治療に関する十分な説明に基づく患者の同意」のことを 5)インフォームドコンセントという。 1)ターミナルケアは終末期医療のこと 2)リビングウィルとは自らの終末期をどのように迎えたいかについての意思表示 3)医療専門職が患者の苦痛や苦悩、不安の共感に努める一方で患者は療養上必要な制約を守る。 パートナーシップとはそのようにして築く両者の関係をいう。 4)セカンドオピニオンとは、主治医以外の専門医に求める「意見」または「意見を求める行為」のことである。"},{"year":"2019","category":"医学・医療系","question_number":4,"question_text":"地域包括ケアシステムの目的でないのはどれか。","choice1":"介護予防","choice2":"生活支援","choice3":"医療費抑制","choice4":"認知症施策","choice5":"医療・介護連携","correct_answer":3,"correct_answers":[3],"explanation":"＜地域包括ケアシステム＞ 重度な要介護状態となっても住み慣れた地域で自分らしい暮らしを 人生の最後まで続けることができるよう、 「住まい」 「医療」 「介護」 「予防」 「生活支援」 が一体的に提供されるシステム。 認知症高齢者の地域での生活を支えるためにも構築が重要。 1)介護予防とは、厚生労働省の資料をによると、「要介護状態の発生をできる限り防ぐ（遅らせる）こと、そして要介護状態にあってもその悪化をできる限り防ぐこと、さらには軽減を目指すこと」 と定義がされています。"},{"year":"2019","category":"医学・医療系","question_number":5,"question_text":"診療情報の一次利用にあたるのはどれか。2つマークしなさい。","choice1":"医学研究","choice2":"診療報酬請求","choice3":"医療政策の立案","choice4":"病院の経営計画","choice5":"インフォームドコンセント","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。　＜一次利用：その患者さんに直接関係する＞ ・診療そのものへの利用 ・本人や家族への説明 ・スタッフ間の情報共有、カルテ閲覧 ・術前カンファレンス ・診療情報提供書 ・会計、診療報酬請求に関すること ＜二次利用：患者さん自身に直接は関係ない＞ ・病院の経営計画 ・行政への届出（がん登録など） ・公衆衛生（感染症など） ・研究、教育 ・症例報告 1)二次利用 2)一次利用 3)二次利用 4)二次利用 5)一次利用"},{"year":"2019","category":"医学・医療系","question_number":6,"question_text":"保険診療として認められているのはどれか。","choice1":"健康診断","choice2":"自然分娩","choice3":"帝王切開","choice4":"美容整形","choice5":"予防接種","correct_answer":2,"correct_answers":[2],"explanation":"保険診療は、健康保険法、国民健康保険法、高齢者の医療の確保に関する法律などに基づき、 保険医療機関が、被保険者の病気や怪我に対して行う診療行為」（診療、検査、投薬、手術、処置等） のことで、3)帝王切開だけが保険適用である。 1)健康診断や5)予防接種は予防医療であり保険診療とはならない。 2)自然分娩や4)美容整形は保険診療とは認められていない。 2)自然分娩とは、特別な処置を行わずに陣痛を待ち、産道を通して赤ちゃんを出産する分娩法です。痛みを和らげる麻酔や、胎児が母体から出てくる際に手助けとして使用する吸引処置などの医療行為は行いません。 出産場所は産院だけでなく、助産師や医師を呼んで自宅で出産する方もいます。現在さまざまな出産方法がある中で、現在も昔ながらの自然分娩を選択される方が多いです。 2)厚生労働大臣が定める疾患に起因した咬合異常対する矯正歯科治療等、 一部保険診療が適用になる場合がある。 1)口腔外科のように歯科診療でも入院する場合があり、請求時も区別する。 3)医科と同様に社保・国保に毎月請求する。 4)最近改善傾向にはあるが、未コード化傷病名は医科・歯科を問わず問題になっている。 5)診療報酬明細書の様式は歯科独自のものである。"},{"year":"2019","category":"医学・医療系","question_number":8,"question_text":"DPC/PDPSについて正しいのはどれか。","choice1":"外来診療にも適用される。","choice2":"すべての疾患が対象となる。","choice3":"1入院あたり定額支払いの仕組みである。","choice4":"一度決定したコードは入院途中で変更できない。","choice5":"病名と手術と処置などの組み合わせでコードが決まる。","correct_answer":5,"correct_answers":[5],"explanation":"DPC/PDPSとは、傷病名と手術や処置、決められた合併症などをもとに作成された診断群分類である DPCに基づいて、入院医療費を一日あたりの定額支払いをもとに算定する制度のことであり、5)が正解。 1)急性期の入院医療が対象である。 2)DPCコードに該当する疾患が対象である。 3)1入院あたりではなく、入院一日あたりの点数が決められているので入院日数に応じて変化する。 また手術等の出来高部分の点数との合併なので定額ではない。 4)入院中の症状の変化や治療内容の変更に伴い、当初の診断群分類が入院途中で変更になる場合がある。"},{"year":"2019","category":"医学・医療系","question_number":9,"question_text":"医師法について正しいのはどれか。2つマークしなさい。","choice1":"自ら検案をしないで検案書を交付することは禁止されている。","choice2":"医師は診療終了後7日目までに診療録を記載しなくてはならない。","choice3":"慢性疾患の患者については、診察を行わずに処方箋を発行できる。","choice4":"薬剤を調剤して投与する必要がある場合には、処方箋を交付しなければならない。","choice5":"","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。　1)診療録の保存期間は「5年」（医師法 第24条） 2)検案→自宅など、病院以外で亡くなった方の死因、死亡時刻、異状死でないかの確認を医師が行うこと 検案書→死亡診断書（死体検案書） 3)医師は、診療をしたときは、遅滞なく診療に関する事項を診療録に記載しなければならない（医師法 第24条） 4) 5)医師は、患者に対し治療上薬剤を調剤して投与する必要があると認めた場合には、患者又は現にその看護に当っている者に対して処方せんを交付しなければならない（医師法 第22条）"},{"year":"2019","category":"医学・医療系","question_number":10,"question_text":"特定健康診査について正しいのはどれか。","choice1":"健康保険法に基づいて行われる。","choice2":"糖尿病を対象とした制度である。","choice3":"保険者が主体となって実施する。","choice4":"50歳から74歳までが対象である。","choice5":"受診者全員が特定保健指導を受ける。","correct_answer":3,"correct_answers":[3],"explanation":"1)「健康増進法」および「高齢者の医療の確保に関する法律」に基づいて行われる。 2)生活習慣病の発症リスクの高い者を抽出する。糖尿病のみを対象としているわけではない。 3)特定健康診査の実施主体は保険者である。 4)40歳から74歳までのすべての国民が対象である。 5)腹囲とBMIの基準を上回り、かつ血圧・血中脂質・血糖・喫煙の追加リスクを持つ場合に指導対象となる。"},{"year":"2019","category":"医学・医療系","question_number":11,"question_text":"我が国の医療制度について誤っているのはどれか。","choice1":"国民皆保険制度である。","choice2":"医療給付は現物給付である。","choice3":"医療機関は自由開業制である。","choice4":"患者は医療機関を自由に選択できる。","choice5":"患者は包括払いと出来高払いを選択できる。","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)診療報酬の算定は基本的に診療行為の合計による出来高払いである。 入院診療におけるDPC/PDPS制度において一部が包括払いとなるが、患者が選択できるわけではない。"},{"year":"2019","category":"医学・医療系","question_number":12,"question_text":"要介護認定の申請窓口はどれか。","choice1":"主治医","choice2":"市区町村","choice3":"都道府県","choice4":"サービス事業者","choice5":"ケアマネージャー","correct_answer":2,"correct_answers":[2],"explanation":"介護保険法第3条 申請後、市区町村による認定調査、主治医意見書による一次判定、介護認定審査会による 二次判定により要介護度および認定有効期間が最終判定される。"},{"year":"2019","category":"医学・医療系","question_number":13,"question_text":"国家資格でないのはどれか。","choice1":"准看護師","choice2":"介護福祉士","choice3":"柔道整復師","choice4":"診療放射線技師","choice5":"あん摩マッサージ指圧師","correct_answer":1,"correct_answers":[1],"explanation":"保健師助産師看護師法第六条 ”      准看護師は都道府県知事の免許を受ける"},{"year":"2019","category":"医学・医療系","question_number":14,"question_text":"助産師の守秘義務を定めている法律はどれか。","choice1":"刑法","choice2":"民法","choice3":"医師法","choice4":"医療法","choice5":"保健師助産師看護師法","correct_answer":1,"correct_answers":[1],"explanation":"助産師の守秘義務は1)刑法第134条に定められている。"},{"year":"2019","category":"医学・医療系","question_number":15,"question_text":"平均在院日数の計算式として正しいのはどれか。","choice1":"A/B","choice2":"A/((B+C)÷2)","choice3":"A/(B+C)","choice4":"A/((B+C)×2)","choice5":"A/((B+C)÷2)","correct_answer":5,"correct_answers":[5],"explanation":""},{"year":"2019","category":"医学・医療系","question_number":16,"question_text":"医療安全について正しいのはどれか。","choice1":"医療安全の向上に職員教育は有用でない。","choice2":"インシデントレポートは自主的な報告である。","choice3":"インシデントレポートは職員の能力評価に用いられる。","choice4":"有害事象は患者への影響度が比較的軽微なものを指す。","choice5":"医療過誤は医療行為を通じて発生した傷害と定義されている。","correct_answer":2,"correct_answers":[2],"explanation":"2)インシデントレポートは、医療安全を目的として医療現場に内在する危険要素を把握するための 情報収集ツールであり、自主的な報告である。 1)医療安全は原因追究と事例から学ぶことが必要であるため、職員教育は有用である。 3)インシデントレポートは、医療事故・医療過誤の発生を未然に防止する事が目的であり、 職員の能力評価には用いられない。 4)有害事象は、医療行為を通じて患者に発生した障害と定義されており、患者への影響が大きい。 5)医療過誤は、法律上の用語であり、患者に障害が発生するとともに、医療行為や管理上に 過失が認められ、両者の間に因果関係があるものを意味する。"},{"year":"2019","category":"医学・医療系","question_number":17,"question_text":"医薬品医療機器等法で高度管理医療機器に分類されないのはどれか。","choice1":"人工心臓弁","choice2":"人工透析器","choice3":"電子内視鏡","choice4":"ペースメーカー","choice5":"心血管用ステント","correct_answer":3,"correct_answers":[3],"explanation":"電子内視鏡は、管理医療機器に分類される。"},{"year":"2019","category":"医学・医療系","question_number":18,"question_text":"根本原因分析（RCA:Root Cause Analysis）について誤っているのはどれか。","choice1":"4M4E分析が用いられる。","choice2":"バリアンス分析が用いられる。","choice3":"SHELモデル分析が用いられる。","choice4":"複雑な事実関係を明らかにすることが必要である。","choice5":"「事実」と「推測や判断」を区別することが必要である。","correct_answer":2,"correct_answers":[2],"explanation":"根本原因分析（RCA:Root Cause Analysis）とは、インシデントや有害事象の再発防止策を 検討するために、事例をもとに根本的な原因を追究するための分析である。’ 1)4M4E分析とはフレームワーク型の分析手法で、インシデントやアクシデントの要因を4つの「M」の視点から分析して、さらに対策を4つの「E」の視点で行う手法です。 2)バリアンス分析はクリニカルパスの改善を目的として用いられる分析のため、誤りである。 3)シェルモデルはヒトを中心におき要因を周囲に配置し図式化、視覚的に事象を把 握しつつ、各々の相互関係から事故発生に影響を与えた要因を整理できるとされ ています。"},{"year":"2019","category":"医学・医療系","question_number":19,"question_text":"クリニカルパスによる期待される効果でないのはどれか。","choice1":"治療の標準化","choice2":"医療の質の向上","choice3":"チーム医療の推進","choice4":"平均在院日数の短縮","choice5":"症例数の少ない疾患の治療法の確立","correct_answer":5,"correct_answers":[5],"explanation":"クリニカルパスは「患者状態と診療行為の目標、および評価・記録を含む標準診療計画であり 標準からの偏位を分析することで医療の質を改善する手法」と定義されている。（日本クリニカルパス学会）"},{"year":"2019","category":"医学・医療系","question_number":20,"question_text":"診療ガイドラインの目的でないのはどれか。","choice1":"診療の画一化","choice2":"医療の質の向上","choice3":"エビデンスの提供","choice4":"患者への情報提供","choice5":"施設間格差の解消","correct_answer":1,"correct_answers":[1],"explanation":"診療ガイドラインは科学的根拠に基づき、臨床現場における意思決定の際の 判断材料の1つとして利用することを目的にされたものである。診療はガイドラインの情報に加え 患者の希望などを考慮の上、医療者と患者が合意の上で行われるものであるため、1)診療の画一化は誤り。"},{"year":"2019","category":"医学・医療系","question_number":21,"question_text":"化学療法が用いられるのはどれか。","choice1":"喘息","choice2":"糖尿病","choice3":"脳梗塞","choice4":"心筋梗塞","choice5":"急性白血病","correct_answer":5,"correct_answers":[5],"explanation":"5)化学療法として抗がん剤を使用する"},{"year":"2019","category":"医学・医療系","question_number":22,"question_text":"血糖値を下げる働きのあるホルモンはどれか。","choice1":"インスリン","choice2":"グルカゴン","choice3":"オキシトシン","choice4":"コルチゾール","choice5":"テストステロン","correct_answer":1,"correct_answers":[1],"explanation":"1)膵臓β細胞から分泌、血糖値を下げる 2)膵臓α細胞から分泌、グリコーゲンの分解を促進し、血糖値を上げる 3)下垂体後葉ホルモン 4)副腎皮質ホルモン、糖代謝により血糖値を上げる 5)男性ホルモン"},{"year":"2019","category":"医学・医療系","question_number":23,"question_text":"臓器移植の対象でないのはどれか。","choice1":"肺","choice2":"心臓","choice3":"腎臓","choice4":"膵臓","choice5":"脾臓","correct_answer":5,"correct_answers":[5],"explanation":"※脾臓（ひぞう）とは、胃の外側から裏側にある循環器系内に組み込まれた臓器のこと 老化した赤血球を破壊し、除去する ＜移植のできる臓器＞ [脳死] ・心臓 ・肺 ・肝臓 ・腎臓 ・膵臓 ・小腸 ・眼球 [心停止] ・腎臓 ・膵臓 ・眼球"},{"year":"2019","category":"医学・医療系","question_number":24,"question_text":"動脈血が流れている血管はどれか。","choice1":"冠動脈","choice2":"冠静脈","choice3":"腎静脈","choice4":"肺静脈","choice5":"下大静脈","correct_answer":4,"correct_answers":[4],"explanation":"体をめぐった血液は右心房に集まり、右心室、肺動脈を経て肺に送り込まれる。 肺に入って酸素を多く含んだ血液（動脈血）は、肺と左心房をつなぐ4)肺動脈から左心房、左心室に流れ込み 大動脈を介して全身に送られる。"},{"year":"2019","category":"医学・医療系","question_number":25,"question_text":"抗凝固薬が投与される疾患はどれか。","choice1":"痛風","choice2":"高血圧症","choice3":"心房細動","choice4":"脂質異常症","choice5":"くも膜下出血","correct_answer":3,"correct_answers":[3],"explanation":"※抗凝固薬 心筋梗塞（こうそく）、脳梗塞、深部静脈血栓症、肺塞栓（そくせん）症など 血管を詰まらせないようにするため、血液を“さらさらにする薬” ※心房細動 心房が小刻みに震え、規則正しい心房の収縮ができない状態。 このため心房内の血液の流れがよどみ、左心房の壁の一部に血栓が発生、 これが心臓内から動脈に沿って流れて、脳の中の大きな血管を突然閉塞するのが心原性脳塞栓症です。 1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":26,"question_text":"誤っている組み合わせはどれか。","choice1":"肝臓 – 消化器系","choice2":"血管 – 循環器系","choice3":"腎臓 – 泌尿器系","choice4":"食道 – 呼吸器系","choice5":"副腎 – 内分泌系","correct_answer":4,"correct_answers":[4],"explanation":"※呼吸器系 外呼吸を行うための器官系 鼻から気管支までの空気の出入りと発声に関する気道と、 空気と血液との間のガス交換の場である肺とがあります 食道は「消化器系」となります 1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":27,"question_text":"尿検査の項目に分類されないのはどれか。","choice1":"尿糖","choice2":"尿潜血","choice3":"尿比重","choice4":"尿素窒素","choice5":"尿タンパク","correct_answer":4,"correct_answers":[4],"explanation":"4)尿素窒素とは血液中の尿素に含有される窒素を測定するものであり、 BUNと呼ばれる。腎機能の評価などに用いられ、尿検査ではない。"},{"year":"2019","category":"医学・医療系","question_number":28,"question_text":"生理機能検査はどれか。","choice1":"心電図検査","choice2":"生化学的検査","choice3":"マンモグラフィー","choice4":"腫瘍マーカー検査","choice5":"末梢血液一般検査","correct_answer":1,"correct_answers":[1],"explanation":"生理機能検査とは、患者の身体を対象にして計測を行う検査であり、1)心電図検査や呼吸機能検査などがある。 2)生化学的検査 3)画像検査 4)検体検査 5)検体検査"},{"year":"2019","category":"医学・医療系","question_number":29,"question_text":"耳鼻咽喉科領域の検査はどれか。","choice1":"眼底検査","choice2":"色覚検査","choice3":"呼吸機能検査","choice4":"分腎機能検査","choice5":"平衡機能検査","correct_answer":5,"correct_answers":[5],"explanation":"※平衡機能検査 主に難聴、耳鳴り、めまい、ふらつきを感じた方に行う 1)眼科領域 2)眼科領域 3)肺の換気機能を調べる検査 4)左右の腎臓の機能を別々に調べる検査 5)"},{"year":"2019","category":"医学・医療系","question_number":30,"question_text":"特定生物由来製品の使用記録の保存期間を定めているのはどれか。","choice1":"医師法","choice2":"医療法","choice3":"健康保険法","choice4":"医薬品医療機器法","choice5":"保険診療機関及び保健医療養担当規則","correct_answer":4,"correct_answers":[4],"explanation":"※医薬品医療機器法→薬機法 平成26年11月25日の薬事法等の一部を改正する法律の施行により薬事法から薬機法に改められた 1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":31,"question_text":"医薬品の体内動態の過程でないのはどれか。","choice1":"吸収","choice2":"阻害","choice3":"代謝","choice4":"排泄","choice5":"分布","correct_answer":2,"correct_answers":[2],"explanation":"＜医薬品の体内動態（薬物動態）＞ 1)[吸収] 薬物が投与された部位から、血液循環系へと取り込まれること ※主な吸収部位：経口、静脈内、筋肉、皮下、口腔粘膜、皮膚、気管支粘膜、鼻粘膜、肛門、膣 5)[分布] 体の中に薬物が吸収され、循環血に乗り、全身の組織へと広がっていくこと ※血液中での分布、薬物の血液と組織間の分布がある 3)[代謝] 吸収、分布を経て薬物分子を、水溶性物質に変化させて体外へ排出しやすくすること ※代謝の種類 第Ⅰ相反応：酸化、還元、加水分解 第Ⅱ相反応：水溶性分子（例：硫酸、グルクロン酸など）がくっつく反応（抱合反応） 4)[排泄] 腎臓で老廃物や異物を尿として排泄すること 2)[阻害] 薬理作用（薬物が生体に及ぼす作用）が邪魔されること"},{"year":"2019","category":"医学・医療系","question_number":32,"question_text":"誤っているのはどれか。2つマークしなさい。","choice1":"抗がん剤は専用の処方箋で処方する。","choice2":"保険における医薬品の投与は原則7日分である。","choice3":"麻薬を処方する場合は、麻薬施用者番号を記載する必要がある。","choice4":"向精神薬は医薬品により処方可能な投与日数が制限されている。","choice5":"新薬は原則として最初の1年間は処方可能な投与日数が制限されている。","correct_answer":1,"correct_answers":[1,2],"explanation":"正答は1、2。　1)抗がん剤はその他の処方薬と同様の様式の処方箋で処方して差し支えない。 2)保険診療における長期投与の制限は、原則廃止されており、医師の判断により適切な期間の投薬が可能。 3) 4)麻薬・向精神薬の処方可能な投与日数は最大14~90日 5)発売後一年以内の新薬には投与日数（原則として最大14日）がある。"},{"year":"2019","category":"医学・医療系","question_number":33,"question_text":"看護診断分類はどれか。","choice1":"NIC","choice2":"NOC","choice3":"ICNP","choice4":"NANDA-I","choice5":"SNOMED-CT","correct_answer":4,"correct_answers":[4],"explanation":"1)看護介入分類 2)看護成果分類 3)看護実践のための国際分類 4)NANDA-I（North American Nursing Diagnosis Association – International) 看護師が独自に診断・介入する患者問題を看護問題と呼び、その診断名称を看護診断と呼ぶ。 日本ではNANDAインターナショナルで承認された看護診断が普及している。 5)国際保健用語企画開発機構が配布する国際医療用語集"},{"year":"2019","category":"医学・医療系","question_number":34,"question_text":"ゲノム情報を用いて患者一人ひとりの遺伝的な背景を考慮して提供する医療を指すのはどれか。","choice1":"再生医療","choice2":"終末期医療","choice3":"ゲノム解析","choice4":"個別化医療","choice5":"チーム医療","correct_answer":4,"correct_answers":[4],"explanation":"※個別化医療 患者さんの体質や病気の特徴にあった治療を行うこと 同じ病気でも患者さんによっては薬の効きに差があるため、体質にあった薬を投薬します 1)幹細胞を用いて機能を失った細胞や組織を復元させる医療 2)近い将来に死に至ることがある程度予想される状況下において、身体的苦痛の緩和だけでなく、 その人らしさをまっとうできるように支援する医療 3)生物（患者）の遺伝子情報を解析 4) 5)診療科や部門を横断した多職種による医療"},{"year":"2019","category":"医学・医療系","question_number":35,"question_text":"放射線を用いない検査はどれか。2つマークしなさい。","choice1":"胸部単純撮影","choice2":"腹部超音波検査","choice3":"頭部MRI造影検査","choice4":"心臓カテーテル検査","choice5":"脳血流シンチグラフィー","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　1)放射線の一種であるX線を用いて胸部のX線透過画像を撮影する 2)体表から超音波を照射して反射波により内部臓器を観察する検査 3)単純、造営にかかわらず、体外から強い高周波磁場を与え、その際に体内から放出される核磁気共鳴信号を用いて体内の水素原子の分布を画像化する検査 4)X線透過下で、橈骨動脈などからカテーテルを心臓あるいは冠動脈内に挿入し造影剤を注入して動きや形態を観察する 5)核医学検査の一つで、放射線同意元素を含む薬剤を体内に投与し、一定時間後に体内から放出される放射線量を画像化する"},{"year":"2019","category":"医学・医療系","question_number":36,"question_text":"放射性医薬品を使用する検査はどれか。2つマークしなさい。","choice1":"CT","choice2":"MRI","choice3":"PET","choice4":"マンモグラフィー","choice5":"骨シンチグラフィー","correct_answer":3,"correct_answers":[3,5],"explanation":"正答は3、5。　1)CTは外部から照射するX線を用いて断層撮影を行うもの 2)MRIは体外から放出される核磁気共鳴信号を用いて体内の水素原子の分布を画像化するもの 3)PETは、腫瘍など目的組織に集積しやすい放射線同意元素を含む薬剤を投与し、対外へ放出される γ線を体の周囲360°方向から同時計測して放射性医薬品の体内での分布を画像化する。 4)マンモグラフィーは乳房を側面から圧迫した状態で側面方向の単純X線撮影を行うもの 5)骨シンチグラフィは、骨に集積しやすい放射線同意元素を含む薬剤を静脈内に投与し、 体外へ放出されるγ線を画像化する。"},{"year":"2019","category":"医学・医療系","question_number":37,"question_text":"診断に超音波検査が用いられないのはどれか。","choice1":"妊娠","choice2":"胆石症","choice3":"肺気腫","choice4":"心臓弁膜症","choice5":"深部静脈血栓症","correct_answer":3,"correct_answers":[3],"explanation":"超音波の特性上、肺などの空気を多く含む組織（超音波が拡散してしまう）や 脳などの硬い組織の下にある組織（超音波を透過しにくい）は画像の描出が困難なため肺気腫 には用いられない。 1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":38,"question_text":"がんの治療法として代表的でないのはどれか。","choice1":"運動療法","choice2":"化学療法","choice3":"免疫療法","choice4":"外科的治療","choice5":"放射線治療","correct_answer":1,"correct_answers":[1],"explanation":""},{"year":"2019","category":"医学・医療系","question_number":39,"question_text":"SOAP形式の医療記録で「S」に記載するのはどれか。","choice1":"処方","choice2":"評価","choice3":"治療計画","choice4":"客観的情報","choice5":"主観的情報","correct_answer":5,"correct_answers":[5],"explanation":"・Ｓ（subjective）：主観的情報 対象者が話した内容などから得られた情報 ・Ｏ（objective）： 客観的情報 診察や検査からなど得られた客観的な情報 ・Ａ（assessment）： 評価 医師の診断や、O と Sの内容を元に分析や解釈を行った総合的な評価 ・Ｐ（plan）： 計画（治療） Ａに基づいて決定した治療の方針・内容、生活指導など 1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":40,"question_text":"ICD（国際疾病分類）について正しいのはどれか。2つマークしなさい。","choice1":"原死因の分類には用いられない。","choice2":"DPCの診断群分類コードに利用されている。","choice3":"MEDISの標準病名マスターが準拠している。","choice4":"ICD-10のコードは8桁の数字で構成されている。","choice5":"アメリカ疾病管理予防センター（CDC）が制定している。","correct_answer":2,"correct_answers":[2,3],"explanation":"正答は2、3。　ICDは世界保健機関（WHO）が作成した死亡や疾病のデータの体系的な記録や分析、比較を行うための分類であり、2)DPCの診断軍分類コード、3)MEDISの標準疾病マスターにも用いられているため、正しい。 1)原死因の分類にはICDの第10版であるICD-10が用いられている。 2) 3)MEDISとは一般財団法人医療情報システム開発センターのこと。 厚生労働省から委託を受けて平成16年度までに診療情報の「用語・コード」の標準化として、次の9分野、１０の標準マスターを作成しました。 1.病名マスター（ICD10対応標準病名マスター） 2.手術・処置マスター 3.臨床検査マスター（生理機能検査を含む） 4.医薬品HOTコードマスター 5.医療機器マスター 6.看護実践用語標準マスター＜看護行為編＞＜手術観察編＞ 7.症状所見マスター＜身体所見編＞ 8.歯科分野マスター＜病名＞＜手術処置＞ 9.画像検査 4)ICD-10コードはアルファベット一文字に2桁の数字の3桁分類、詳細な発生場所や疾病の原因を表す4桁分類および5桁分類が用いられる。 5)ICDはWHOが制定したものである"},{"year":"2019","category":"医学・医療系","question_number":41,"question_text":"看護サマリーの説明で正しいのはどれか。","choice1":"患者の重症度や自立度を評価した記録","choice2":"一定期間経過後に患者状態を要約した記録","choice3":"入院時に患者から聴取する基本的情報の記録","choice4":"主に看護師長が記載する病棟及び看護体制の記録","choice5":"日々の患者状態や観察結果などを記載する経時的な記録","correct_answer":2,"correct_answers":[2],"explanation":"※看護サマリー 患者の病歴や治療・看護等の情報を要約した書類 看護要約、退院時サマリー、退院時要約とも呼ばれている 1)看護必要度 2)看護サマリー 3)入院時記録 4) 5)看護記録"},{"year":"2019","category":"医学・医療系","question_number":42,"question_text":"手術手技のコーディングに利用されるのはどれか。","choice1":"DRG","choice2":"ICF","choice3":"ICD-10","choice4":"JLAC10","choice5":"Kコード","correct_answer":5,"correct_answers":[5],"explanation":"1)DRGとは米国の診断群分類のこと 2)ICFはWHOが定める国際生活機能分類のこと 3)ICD-10はWHOが作成した死亡や疾病のデータの体系的な記録や分析、比較を行うための分類 4)JLAC10は臨床検査医学会が制定した臨床検査項目分類 5)Kコードは診療報酬点数表における手術手技・処置の領域を定めたコード"},{"year":"2019","category":"医学・医療系","question_number":43,"question_text":"新薬開発のための臨床試験において、健常人ボランティアを対象とするのはどれか。","choice1":"検証試験","choice2":"臨床薬理試験","choice3":"探索試験（前期）","choice4":"探索試験（後期）","choice5":"製造販売後臨床試験","correct_answer":2,"correct_answers":[2],"explanation":"1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":44,"question_text":"医学研究に関する用語とその説明の組み合わせで誤っているのはどれか。","choice1":"介入研究 – 健康や疾病の姿を単に観察する研究のこと","choice2":"バイアス – 対象者の選定や測定方法により正しい値から系統的なずれが生じること","choice3":"交絡 – 暴露とアウトカムに関する解析で、隠れた要因の影響によって両者の関連性が歪められること","choice4":"コホート研究 – 固定集団を一定期間追跡調査する研究のこと","choice5":"症例対照研究 – ある因子について、患者集団と病気に罹っていない対照集団とで比較する研究のこと","correct_answer":1,"correct_answers":[1],"explanation":"1)介入研究とは、運動、薬剤や手術など、人体に関与する新たな外的要因の有効性を調査する研究のことであり、説明にある健康や疾病の姿を単に観察する研究は観察研究のことである。 2)～5)の用語とその説明はすべて正しい。"},{"year":"2019","category":"医学・医療系","question_number":45,"question_text":"疾患に罹患していない患者のなかで、検査結果が陰性の患者の割合を表すのはどれか。","choice1":"感度","choice2":"自由度","choice3":"特異度","choice4":"オッズ比","choice5":"相対危険度","correct_answer":3,"correct_answers":[3],"explanation":"1)罹患している患者の中での、検査結果が陽性の患者の割合 2)変数のうち、独立に選べるものの数のこと 3)罹患していない患者の中での検査結果が陰性の患者の割合 4)事象が起こる確率と起こらない確率の比 5)暴露群の疾病発症率を、非暴露群の疾病発症率で割った割合"},{"year":"2019","category":"医学・医療系","question_number":46,"question_text":"正規分布の形を決めるのはどれか。2つマークしなさい。","choice1":"最頻値","choice2":"中央値","choice3":"平均値","choice4":"標準偏差","choice5":"四分位範囲","correct_answer":3,"correct_answers":[3,4],"explanation":"正答は3、4。　正規分布は、平均値を境に左右対称の凸型で、そのすそ野は、サンプル数にかかわらず適用できる（即ち標準化された）散らばり方の指標である4)標準偏差の値と、中心となる3)平均値が定まると、一意的に形が決まる。"},{"year":"2019","category":"医学・医療系","question_number":47,"question_text":"帰無仮説を棄却するか否かを判定する際に、あらかじめ決めておく基準はどれか。","choice1":"四分位数","choice2":"標準誤差","choice3":"標準偏差","choice4":"標本平均","choice5":"有意水準","correct_answer":5,"correct_answers":[5],"explanation":"統計学上の仮説で，ある一つの変数が他の一つの変数，もしくは一群の変数と関係がないとする仮説． あるいは二つ以上の母集団の間の差がないとする仮説． これが成立するならば，得られた結果は偶然によって支配されたと予想される結果と違わないことになる． 1) 2) 3) 4) 5)"},{"year":"2019","category":"医学・医療系","question_number":48,"question_text":"正規分布に従わない独立な2群の差を比較する手法としてもっとも適切なのはどれか。","choice1":"t検定","choice2":"回帰分析","choice3":"符号検定","choice4":"符号付順位和検定","choice5":"Wilcoxonの順位和検定","correct_answer":5,"correct_answers":[5],"explanation":"1)正規分布に従う独立な2群の差を比較する手法、独立な2群に使用する検定と、対応のある2群に使用する検定の2種類のt検定がある 2)2変数間の関係を検討する手法 3)正規分布に従わない場合に介入の前後で変化があるかどうか検討する手法 4)正規分布に従わない対応のある2群の差を比較する手法 5)ウィルコクソンの順位和検定は得られた2つのデータ間の代表値 (中央値) に差があるかどうかを検定する．主にサンプル数が少なく得られたデータに正規性を仮定できないときに用いられる．"},{"year":"2019","category":"医学・医療系","question_number":49,"question_text":"レセプト情報ならびに特定健康診査の結果の情報が格納されているデータベースはどれか。","choice1":"DPC","choice2":"MDC","choice3":"NCD","choice4":"NDB","choice5":"PHR","correct_answer":4,"correct_answers":[4],"explanation":"1)DPC(Diagnosis Procedure Combination) 医療資源の必要度によって入院患者を分類する診断群分類 2)MDC(Major Diagnosis Criteria) DPCの診断群分類コードに用いられる主要診断群 3)NCD(National Clinical Databese) 外科手術症例についてのデータベース 4)NDB(National DataBase) 5)PHR(Personal Health Record) 個人の健康記録を経年的に蓄積したもの"},{"year":"2019","category":"医学・医療系","question_number":50,"question_text":"がん登録について誤っているのはどれか。","choice1":"全国がん登録では患者氏名も登録される。","choice2":"地域がん登録は全国がん登録に統一された。","choice3":"全ての病院で臓器がん登録が実施されている。","choice4":"法律に基づいて全国がん登録が実施されている。","choice5":"全ての病院はがん患者の情報を都道府県に届け出る。","correct_answer":3,"correct_answers":[3],"explanation":"専門の医師が所属する病院などで登録されるため、全ての病院が対象ではない。 1) 2) 3)臓器別がん登録は、学会・研究会が中心となって、所属する医師のいる比較的大きな病院から学会・ 研究会の中央事務局にデータを集約することにより、全国規模の登録を実施する仕組みである 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":1,"question_text":"次の画像検査のうち、カラー画像を利用しないのはどれか。","choice1":"CT検査","choice2":"眼底カメラ","choice3":"超音波検査","choice4":"内視鏡検査","choice5":"マンモグラフィ","correct_answer":5,"correct_answers":[5],"explanation":"1) 2) 3) 4) 5)乳がん診断に使用される。病変部を影として撮影するため、カラー画像ではない。"},{"year":"2019","category":"医療情報システム系","question_number":2,"question_text":"診療情報の二次利用に該当するのはどれか。２つマークしなさい","choice1":"統計資料の作成","choice2":"臨床研究、疫学研究","choice3":"提供したサービスの記録","choice4":"患者ケアの計画立案と実施の根拠","choice5":"包括（DPC）・出来高払い保険請求の根拠","correct_answer":1,"correct_answers":[1,2],"explanation":"正答は1、2。　1)患者本人には直接的に利用されない為、二次利用に該当する。 2)患者本人には直接的に利用されない為、二次利用に該当する。 3)一次利用に該当する 4)一次利用に該当する 5)一次利用に該当する"},{"year":"2019","category":"医療情報システム系","question_number":3,"question_text":"医療情報を登録する際にあらかじめ明示的に本人の同意を必要とするのはどれか。２つ選びなさい。","choice1":"MID-NET","choice2":"J-DREAMS","choice3":"DPCデータベース","choice4":"指定難病患者データベース","choice5":"介護保険統合データベース","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　基本的にどのシステムも匿名化されるが、J-DREAMSと指定難病患者データベースは 同意が必要である。 1) 2)糖尿病患者の同意を得て、匿名化、暗号化され登録される。 3) 4)利用目的を明示し、本人の同意を得る必要がある。 5)"},{"year":"2019","category":"医療情報システム系","question_number":4,"question_text":"地域医療連携室の業務支援システムの機能のうち、必要性がもっとも低いのはどれか。","choice1":"紹介状管理","choice2":"紹介元管理","choice3":"返書作成機能","choice4":"手術予約機能","choice5":"宛名ラベル印刷機能","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)患者の手術が必要となる場合、診療科でその判断を行うため、 地域医療連携室のシステムで手術予約をさせる必要性は限りなく低いと思われる。 5)"},{"year":"2019","category":"医療情報システム系","question_number":5,"question_text":"電子カルテに主治医が入力しない診療情報はどれか。","choice1":"退院時要約","choice2":"病名オーダ","choice3":"入院診療計画書","choice4":"病理検査レポート","choice5":"患者プロファイル","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3) 4)検査レポートは主治医ではなく、主治医から検査を依頼された病理医などが入力する情報である。 主治医は、病理検査レポートの報告を受ける立場である。 5)"},{"year":"2019","category":"医療情報システム系","question_number":6,"question_text":"外来診療予約システムの機能として誤っているのはどれか","choice1":"1)各種検査予約と連携できること","choice2":"2)外部の医療機関から予約ができること","choice3":"3)時間ごとの予約人数を設定できること","choice4":"4)予約項目に応じて時間枠を設定できること","choice5":"5)同一患者が同一日時に複数予約できること","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。"},{"year":"2019","category":"医療情報システム系","question_number":7,"question_text":"医事会計システムに登録されないのはどれか。","choice1":"勤務先","choice2":"マイナンバー","choice3":"紹介状の有無","choice4":"保険証の確認日","choice5":"保険証の記号・番号","correct_answer":2,"correct_answers":[2],"explanation":"1)連絡先として、勤務先が登録されることがあります 2)マイナンバーは登録しません。 オンライン資格システムの導入によって、マイナンバーカードと保険証の紐づけが可能になりました。 （2021年4月時点） 今後はマイナンバーカードを持って、病院にかかるケースが増えていくと思いますが、 オンライン資格確認では、マイナンバーではなく、マイナンバーカードのICチップ内の 利用者証明用電子証明書を利用します。 医療機関・薬局において患者のマイナンバー（ 12 桁の番号）を取り扱う ことはありません。 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":8,"question_text":"医事会計システムの基本システムあるいは拡張システムとして用意される機能はどれか。２つ選べ。","choice1":"空床管理","choice2":"未収金管理","choice3":"物品購入管理","choice4":"臨床研究管理","choice5":"DPC請求管理","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。　1)看護支援、管理システムなどで実装されているべき機能であり、医事会計としては不適当と思われる。 2)必要な機能である。 3)物流管理システムで実装されるべき機能である。 4) 5)DPC対象病院としては必要な機能である。"},{"year":"2019","category":"医療情報システム系","question_number":9,"question_text":"医師事務作業補助者の業務として適切でないものはどれか","choice1":"レセプトの修正","choice2":"診断書などの文書作成の補助","choice3":"医師の指示のもとでの患者移送","choice4":"カンファレンスのための準備作業","choice5":"","correct_answer":1,"correct_answers":[1,4],"explanation":"正答は1、4。　1または4のどちらかを解答していれば正解です。 医師事務作業補助者の業務は、医師の指示のもとに2),3),5)などを 行うことです。 1)診療報酬請求事務であり、医師事務の補助には該当しません。 2) 3) 4)患者移送は看護業務の補助であり、医師事務の補助には該当しません。 5)"},{"year":"2019","category":"医療情報システム系","question_number":10,"question_text":"診療情報管理部門の業務で無いものはどれか。","choice1":"がん登録","choice2":"診療報酬請求業務","choice3":"DPCコーディング支援","choice4":"データ抽出と分析、改善","choice5":"クリニカルパス作成・改定の支援","correct_answer":2,"correct_answers":[2],"explanation":"1) 2)医事部門の業務になります。 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":11,"question_text":"物品管理システムを導入している病院情報システムにおいて、食い違いが生じない組み合わせはどれか。２つ選べ。","choice1":"実施情報と払い出し物品","choice2":"依頼情報と払い出し物品","choice3":"依頼情報と保険請求データ","choice4":"保険請求データと実施情報","choice5":"払い出し物品と保険請求データ","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　基本的にオーダは「依頼」された後に「実施」の入力が行われます。 この問題の場合、以下のようなイメージになると思います。 ・依頼情報：医療用物品の使用の依頼情報。未実施の情報であり、オーダのキャンセルもありえます。 ・実施情報：医療用物品の使用の実施情報。実施済みの情報であり、オーダのキャンセルはありえない。 ・払い出し物品：依頼時に生じる情報。払い出されたが、オーダのキャンセルもありえる。 ・保険請求データ：実施時に生じる情報。使用された医療用物品の請求データ。オーダのキャンセルはありえない。 1) 2) 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":12,"question_text":"がん化学療法のレジメンシステムの運用について適切でないのはどれか","choice1":"投与量の変更は誰でも可能とする。","choice2":"投与する薬剤の点滴順を管理できる。","choice3":"薬剤を投与しない休薬日を管理できる。","choice4":"抗がん剤の投与量は患者ごとに自動計算できる。","choice5":"レジメンマスターの登録内容を複数人で確認する。","correct_answer":1,"correct_answers":[1],"explanation":"レジメンは、がん化学療法における容量用法を時系列に明示した治療計画です。 1)抗がん剤の投与量の多寡で患者の生死を分けます。がん化学療法に精通した医師によって 決定されるべきです。 2) 3) 4)登録されている患者の身長、体重から投与量を自動計算し、参考値とする場合があります。 5)"},{"year":"2019","category":"医療情報システム系","question_number":13,"question_text":"医療事故防止に直接関与する機能はどれか。2つ選べ。","choice1":"入院患者統計機能","choice2":"禁忌薬チェック機能","choice3":"看護師の勤怠管理機能","choice4":"アレルギーチェック機能","choice5":"インシデントレポートの登録機能","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1) 2)疾病禁忌（疾病に対する仕様禁忌の薬剤投与）、併用禁忌（副作用を引き起こす相互作用のある組み合わせのある複数薬剤の投与）などが 発生しないように処方オーダ時にエラーやアラームが表示される機能。 3) 4)アレルギーのある患者にアレルギー症状の引き起こす薬剤、食物、造影剤を誤ってオーダしないようにエラーやアラームが表示される機能 5)"},{"year":"2019","category":"医療情報システム系","question_number":14,"question_text":"インシデントレポートシステムの導入目的でないのはどれか。","choice1":"報告数を削減できる","choice2":"集計作業が容易となる","choice3":"報告者が報告しやすい環境ができる","choice4":"報告内容ごとに参照権限を設定できる","choice5":"事案が発生したときに情報を速やかに収集できる","correct_answer":1,"correct_answers":[1],"explanation":"医療安全に関するリスクマネージメント目的で導入する。 施設内の医療事故のみならず、軽微なヒアリハット事案も網羅的に、収集することで 医療安産の向上を目的とするシステムである。 1)軽微な案件でも報告を収集する必要がある。報告数を削減することは望ましくない。 2) 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":15,"question_text":"レポーティングシステムにおける既読管理の対象者は誰か。","choice1":"病院長","choice2":"医療情報部長","choice3":"検査を指示した医師","choice4":"報告書を作成した医師","choice5":"検査を実施した医療従事者","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)レポート（検査結果）は、検査依頼した医師により読まれるべきであるため。 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":16,"question_text":"注射薬の一本渡し運用の説明として適切なものはどれか","choice1":"抗がん剤の運用に適している","choice2":"期限切れの薬剤が放置されやすい","choice3":"重症系病棟での運用に適している","choice4":"薬の取り出し時の間違いが発生しやすい","choice5":"病院全体の注射薬の在庫が多くなりがちである。","correct_answer":1,"correct_answers":[1],"explanation":"一本渡し：注射オーダーが来たら１患者１回ごとに注射薬を薬剤部から病棟へ払い出して、注射を実施するやりかた 定数配置：病棟に一定数の注射薬をストックしておいて、オーダーに応じて注射実施するやりかた 1)抗がん剤は患者により投与量などが異なるため、定数配置だと細かな調整がきかない。 一本渡しの場合、薬剤部（薬剤師）による処方監査、調剤監査が行われるため、 薬品の取違、投与量誤りを防げる。 2) 3)重症系は患者の状態変化が激しいため、一本渡しでは間に合わない 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":17,"question_text":"輸血実施時に記録する必要性がもっとも低いのはどれか。","choice1":"血液製剤種","choice2":"輸血既往歴","choice3":"血液製剤番号","choice4":"輸血投与時刻","choice5":"輸血製剤投与により生じた副作用","correct_answer":2,"correct_answers":[2],"explanation":"ひっかけ問題。どれも大事な項目だが、輸血既往歴は「輸血実施時」ではなく「輸血実施前」に記録されているべきである 1) 2) 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":18,"question_text":"輸液実施時に行われる3点認証において、読み取らないのはどれか。２つ選べ。","choice1":"患者ID","choice2":"病室番号","choice3":"実施者ID","choice4":"調剤担当薬剤師ID","choice5":"輸液対象物の識別番号","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1) 2)入院中に病室の移動が発生する為、輸液実施時の個人識別に使用できない。（しない） 3) 4)輸液実施時に調剤担当薬剤師が立ち会うわけでは無い。 5)"},{"year":"2019","category":"医療情報システム系","question_number":19,"question_text":"持参薬を取り扱う運用について誤っているのはどれか。2つ選べ。","choice1":"薬剤師が持参薬の鑑別を行う。","choice2":"薬剤師が持参薬オーダを発行する。","choice3":"持参薬マスターは、院内採用医療薬マスターと別に作成する。","choice4":"院内採用されていない薬剤を自動的に院内採用薬に変換する。","choice5":"持参薬オーダによる処方は、通常の処方オーダと同様の服薬指示ができる。","correct_answer":2,"correct_answers":[2,4],"explanation":"正答は2、4。　1) 2)持参薬オーダは医師が発行するもので、薬剤師が発行することはない 3) 4)勝手に薬剤が変換されるのは非常に危険である。 医師は、薬剤師からの情報、患者の状態などから判断し、適切な薬剤を処方する必要がある。 支援機能として、院内採用薬候補を表示する機能は必要ではあるが、自動変換されてしまうのはリスクがある。 5)"},{"year":"2019","category":"医療情報システム系","question_number":20,"question_text":"リハビリテーション部門システムに求められる機能として適切でないものはどれか。","choice1":"予約枠管理","choice2":"実施単位の管理","choice3":"療法士の労務管理","choice4":"実施計画書の管理","choice5":"地域連携パスとの連携","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)療法士のスケジュール管理は必要だと思われるが、 労務管理の語彙として 労働時間の管理、休暇の付与なども含まれる。 人事管理システムの範囲と思われるため、適切ではない。 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":21,"question_text":"PACSの機能として誤っているのはどれか。2つ選べ。","choice1":"レポートシステムと連携できる。","choice2":"画像保存機能のみを有するシステムである。","choice3":"PACSとモダリティの通信はDICOM規格で行われている。","choice4":"よく利用される画像圧縮方法にはJPEG圧縮とWavelet圧縮がある。","choice5":"PACSに画像が保存されるとPACSは医事会計システムに実施情報を送る。","correct_answer":2,"correct_answers":[2,5],"explanation":"正答は2、5。　1) 2)電子カルテ、レポートシステムへの連携機能も有することが多い 3) 4) 5)医事連携は他システムで行われることが多い。 電子カルテや実際にオーダを受けた検査システム側で医事会計システムに実施情報を送る。"},{"year":"2019","category":"医療情報システム系","question_number":22,"question_text":"MRI検査のチェック項目として必要でないのはどれか。","choice1":"刺青の有無","choice2":"妊娠の有無","choice3":"てんかんの有無","choice4":"閉所恐怖症の有無","choice5":"ペースメーカーの有無","correct_answer":3,"correct_answers":[3],"explanation":"1)刺青には金属成分があるため、やけどの危険性がある 2)胎児への影響がある 3) 4)MRIは閉所になるため、恐怖症の人には注意が必要 5)ペースメーカの発熱、誤作動の可能性がある"},{"year":"2019","category":"医療情報システム系","question_number":23,"question_text":"医用画像表示用モニタ（医用モニタ）利用および管理について誤っているのはどれか。","choice1":"不変性試験と受け入れ試験の双方が必要である。","choice2":"医用モニタ品質管理責任者は導入、維持管理、対応について責任を行う。","choice3":"スクリーンセーバーを用いてもバックライトの寿命を延ばすことはできない。","choice4":"読影を行う場合は医療機器である医用モニタを使用する必要がある。","choice5":"医用モニタの品質管理に関する業務の一部は医療機関外部に委託することができる。","correct_answer":4,"correct_answers":[4],"explanation":"1) 2) 3)スクリーンセーバーにより画面は暗くなるが、バックライト自身は発光したままの為、寿命は延びない。 4)必ずしも、医用モニタを使用する必要はない。 5)"},{"year":"2019","category":"医療情報システム系","question_number":24,"question_text":"食事オーダのシステムについて正しいのはどれか。２つ選べ。","choice1":"食事を中止する場合には食止めオーダを出す。","choice2":"選択食の情報を医事会計システムに転送する。","choice3":"締切時間を過ぎた後は食事オーダはできない。","choice4":"食物アレルギーに対応すると診療報酬上の加算がある。","choice5":"食事オーダ時に、身長や体重、アレルギーの情報を参照できる。","correct_answer":4,"correct_answers":[4],"explanation":"1)正しい。 2)選択食は特別食加算の対象ではない。よって医事連携は不要。 3) 4)食物アレルギーに対応する食事を用意する必要はあるが、残念ながら加算はつかない。 5) 1) 2) 3) 4)記載は必要である 5)"},{"year":"2019","category":"医療情報システム系","question_number":26,"question_text":"歯科診療での指示と指示受けは、義歯などの歯科技工装置と関連して歯科医師と歯科技工士との間でおこなわれており、","choice1":"歯科医師は、歯科技工指示書で歯科技工士に歯科技工装置の内容を伝える。","choice2":"歯科医師は、完成した歯科技工装置を患者に装着した日を診療録に記載する。","choice3":"歯科技工士は、必要に応じて歯科技工装置の材料を自ら選択し、歯科医師に報告する。","choice4":"歯科技工士は、歯科技工指示書によらなければ、業として歯科技工を行ってはならない。","choice5":"歯科技工所の管理者は、歯科技工に関する指示書を、当該技工終了日から起算して2年間保持する。","correct_answer":3,"correct_answers":[3],"explanation":"1) 2) 3)材料は歯科技工士が判断するものではない。歯科技工指示書に従う。 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":27,"question_text":"看護業務支援システムの主な機能として適切でないものはどれか","choice1":"看護職員の月単位の勤務表を作成できる","choice2":"マスター登録された標準看護計画を立案できる。","choice3":"医師が入力したオーダの実施入力を行うことができる。","choice4":"ケアプランを看護オーダとしてスケジューリングできる。","choice5":"医師が入力したオーダを看護ワークシートに出力できる","correct_answer":1,"correct_answers":[1],"explanation":"1)看護職員の月単位の勤務表作成は、看護管理支援システムの機能である。 2) 3) 4) 5)"},{"year":"2019","category":"医療情報システム系","question_number":28,"question_text":"医療情報システム調達の際に行うRFIに含まれないのはどれか。","choice1":"
